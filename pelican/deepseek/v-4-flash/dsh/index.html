<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑单车的卡通鹈鹕 · 纯 CSS Keyframes 动画</title>
<style>
  :root {
    /* 轮半径 74 → 周长 465 单位；车轮 0.45s 转一圈，
       于是地面滚动速度 = 465/0.45 ≈ 1033 单位/秒，据此推算背景各层周期，
       车轮与地面同速，不会出现"打滑"感。 */
    --dur: 0.9s;        /* 踩踏循环：大腿 / 小腿 / 脚掌关键帧周期 */
    --wheelDur: 0.45s;  /* 车轮转一圈 */

    --cream: #fdf8ec;
    --line: #c9a45c;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 18px;
    background: radial-gradient(120% 90% at 78% 6%, #1d4657 0%, #142b3a 46%, #0b1620 100%);
    font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: #e8f1f6;
  }

  .card { width: min(1060px, 100%); display: flex; flex-direction: column; gap: 15px; }

  .head { text-align: center; }
  .head h1 {
    margin: 0 0 6px;
    font-size: clamp(18px, 2.3vw, 27px);
    font-weight: 700;
    letter-spacing: .04em;
    background: linear-gradient(92deg, #ffe9b4, #ffd07a 40%, #9be3d3);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .head p { margin: 0; font-size: clamp(11px, 1.3vw, 13px); color: #9fb6c4; letter-spacing: .09em; }

  .stage {
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    background: #9fd4e6;
    box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .85),
                0 0 0 1px rgba(255, 255, 255, .1),
                0 0 0 10px rgba(255, 255, 255, .045);
  }
  .stage svg { display: block; width: 100%; height: auto; }

  .note { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: center;
          font-size: clamp(10px, 1.2vw, 12px); color: #8ea7b6; letter-spacing: .06em; }
  .note code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #ffd88f; background: rgba(255, 216, 143, .1);
    border: 1px solid rgba(255, 216, 143, .22); border-radius: 999px;
    padding: 2px 9px; letter-spacing: 0;
  }

  /* ==========================================================================
     全部动画由纯 CSS @keyframes 驱动：无 JavaScript、无外部库、无 SMIL。
     所有会动的部件都写成真实标签（不用 <use> 克隆，因为克隆出的影子树里
     这些关键帧动画不会运行）。
     ========================================================================== */

  /* --- 车轮辐条绕轮毂自转：每 0.45s 一圈 --- */
  .spin { animation: wheelSpin var(--wheelDur) linear infinite; }
  @keyframes wheelSpin { to { transform: rotate(-360deg); } }

  /* --- 曲柄与齿盘：与腿部逆运动学同相位 --- */
  .crank { animation: crankTurn var(--dur) linear infinite; }
  @keyframes crankTurn { to { transform: rotate(-360deg); } }

  /* --- 脚踏保持接近水平，并轻微前后摆动 --- */
  .pedalRock { animation: pedalRock calc(var(--dur) / 2) ease-in-out infinite; }
  @keyframes pedalRock { 0%, 100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }

  /* --- 腿与脚：几何只用 line / circle / path，画面样式集中在这里 --- */
  .leg { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .leg.near { stroke: #f0cd7e; stroke-width: 21; }
  .leg.far  { stroke: #dcb668; stroke-width: 19; }
  .leg .shin { stroke: inherit; }
  .kneeCap, .ankleCap, .hipBall { fill: #f4d68f; stroke: #cf9f45; stroke-width: 2.4; }
  .leg.far .kneeCap, .leg.far .ankleCap, .leg.far .hipBall { fill: #dcb668; stroke: #bf9140; }
  .foot { fill: #f5a94f; stroke: #cf8231; stroke-width: 3; }
  .leg.far .foot { fill: #e09443; stroke: #bf7a2c; }
  .toeLine { fill: none; stroke: #cf8231; stroke-width: 2.6; stroke-linecap: round; }
  .leg.far .toeLine { stroke: #bf7a2c; }

  /* 每个部件都用自带的 transform="translate(关节x 关节y)" 建立局部坐标系，
     再以 transform-origin:0 0 绕该原点旋转（等价于 SVG rotate 语义）。
     不要设 transform-box:view-box —— 那会把原点改成视口原点，导致双重平移。 */
  .thigh, .shin, .pedalGroup, .pedalRock, .pedalKick,
  .kneeCap, .ankleCap, .hipUnspin, .crank, .crankInner, .spin,
  .tail, .wing, .pouch, .headG { transform-origin: 0 0; }

  /* --- 踩踏：大腿角与小腿相对角（由踏板位置做逆运动学，采样成 24 帧） --- */
  .thigh, .shin { animation: pedal var(--dur) linear infinite; }
  @keyframes pedal {
  0% { --th: 38.5deg; --sh: 60.0deg; transform: rotate(var(--th)); }
  4.17% { --th: 43.5deg; --sh: 52.3deg; transform: rotate(var(--th)); }
  8.33% { --th: 48.8deg; --sh: 44.9deg; transform: rotate(var(--th)); }
  12.5% { --th: 53.9deg; --sh: 38.3deg; transform: rotate(var(--th)); }
  16.67% { --th: 58.4deg; --sh: 33.3deg; transform: rotate(var(--th)); }
  20.83% { --th: 61.7deg; --sh: 31.0deg; transform: rotate(var(--th)); }
  25% { --th: 63.3deg; --sh: 32.1deg; transform: rotate(var(--th)); }
  29.17% { --th: 63.3deg; --sh: 36.1deg; transform: rotate(var(--th)); }
  33.33% { --th: 62.1deg; --sh: 42.2deg; transform: rotate(var(--th)); }
  37.5% { --th: 60.0deg; --sh: 49.3deg; transform: rotate(var(--th)); }
  41.67% { --th: 57.4deg; --sh: 57.0deg; transform: rotate(var(--th)); }
  45.83% { --th: 54.3deg; --sh: 64.6deg; transform: rotate(var(--th)); }
  50% { --th: 50.8deg; --sh: 71.8deg; transform: rotate(var(--th)); }
  54.17% { --th: 46.9deg; --sh: 78.4deg; transform: rotate(var(--th)); }
  58.33% { --th: 42.8deg; --sh: 84.1deg; transform: rotate(var(--th)); }
  62.5% { --th: 38.7deg; --sh: 88.4deg; transform: rotate(var(--th)); }
  66.67% { --th: 34.7deg; --sh: 91.3deg; transform: rotate(var(--th)); }
  70.83% { --th: 31.2deg; --sh: 92.6deg; transform: rotate(var(--th)); }
  75% { --th: 28.5deg; --sh: 92.0deg; transform: rotate(var(--th)); }
  79.17% { --th: 27.0deg; --sh: 89.8deg; transform: rotate(var(--th)); }
  83.33% { --th: 26.8deg; --sh: 85.9deg; transform: rotate(var(--th)); }
  87.5% { --th: 28.0deg; --sh: 80.8deg; transform: rotate(var(--th)); }
  91.67% { --th: 30.5deg; --sh: 74.5deg; transform: rotate(var(--th)); }
  95.83% { --th: 34.1deg; --sh: 67.5deg; transform: rotate(var(--th)); }
  }

  /* --- 脚掌：在"随曲柄旋转"的坐标系里反向自转，因此始终贴合脚踏 --- */
  .pedalKick { animation: pedalKick var(--dur) linear infinite; }
  @keyframes pedalKick {
  0% { --fo: -90.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  4.17% { --fo: -105.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  8.33% { --fo: -120.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  12.5% { --fo: -135.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  16.67% { --fo: -150.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  20.83% { --fo: -165.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  25% { --fo: -180.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  29.17% { --fo: -195.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  33.33% { --fo: -210.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  37.5% { --fo: -225.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  41.67% { --fo: -240.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  45.83% { --fo: -255.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  50% { --fo: -270.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  54.17% { --fo: -285.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  58.33% { --fo: -300.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  62.5% { --fo: -315.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  66.67% { --fo: -330.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  70.83% { --fo: -345.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  75% { --fo: -360.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  79.17% { --fo: -375.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  83.33% { --fo: -390.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  87.5% { --fo: -405.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  91.67% { --fo: -420.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  95.83% { --fo: -435.0deg; transform: rotate(calc(-360deg + var(--fo))); }
  }

  /* --- 关节圆点反向自转，保持完美圆形；髋关节固定不转 --- */
  .kneeCap { animation: unspinK var(--dur) linear infinite; }
  .ankleCap { animation: unspinS var(--dur) linear infinite; }
  .hipUnspin { animation: none; }
  @keyframes unspinK { to { transform: rotate(calc(-1 * var(--th, 0deg))); } }
  @keyframes unspinS { to { transform: rotate(calc(-1 * var(--sh, 0deg))); } }

  /* 远侧腿整体落后半个踩踏周期 */
  .leg.far .thigh, .leg.far .shin, .leg.far .pedalKick,
  .leg.far .kneeCap, .leg.far .ankleCap { animation-delay: calc(var(--dur) / -2); }

  /* --- 车体基准变换：镜头跟拍。车轮接地点落在 viewBox 底边的路面上
         （bike 内部坐标系里轮胎最低点 y≈640 → 640*.98+6.6 = 634） --- */
  .bikeBase { transform: translate(21px, 6.6px) scale(.98); }

  /* --- 背景分层后移：近层快、远层慢，形成视差 ---
     地面层线速度与车轮一致（960 单位 / 0.9289s = 1033 单位每秒） */
  .scroll { will-change: transform; }
  .scroll.road   { animation: scrollRoad .9289s linear infinite; }
  .scroll.grass  { animation: scrollGrass .6776s linear infinite; }
  .scroll.mid    { animation: scrollMid 2.4s   linear infinite; }
  .scroll.far    { animation: scrollFar 6.4s   linear infinite; }
  .scroll.clouds { animation: scrollClouds 26s  linear infinite; }
  @keyframes scrollRoad   { to { transform: translateX(-960px); } }
  @keyframes scrollGrass  { to { transform: translateX(-700px); } }
  @keyframes scrollMid    { to { transform: translateX(-960px); } }
  @keyframes scrollFar    { to { transform: translateX(-1800px); } }
  @keyframes scrollClouds { to { transform: translateX(-640px); } }

  /* --- 车与鸟：细微上下起伏 --- */
  .bob { animation: bob var(--dur) ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4.5px); } }

  .shadow { animation: shadowPulse var(--dur) ease-in-out infinite; }
  @keyframes shadowPulse {
    0%, 100% { opacity: .32; transform: scale(1); }
    50%      { opacity: .21; transform: scale(.93); }
  }

  /* --- 鹈鹕的小动作：扇翅、喉囊晃、尾羽摆、点头、眨眼 --- */
  .wing { animation: wingFlap calc(var(--dur) * 2) ease-in-out infinite; }
  @keyframes wingFlap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(3.4deg); } }

  .pouch { animation: pouchJiggle var(--dur) ease-in-out infinite; }
  @keyframes pouchJiggle {
    0%, 100% { transform: rotate(0deg) scale(1); }
    35%      { transform: rotate(2.1deg) scale(1.03, .98); }
    70%      { transform: rotate(-1.4deg) scale(.985, 1.02); }
  }

  .tail { animation: tailSway var(--dur) ease-in-out infinite; }
  @keyframes tailSway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4.5deg); } }

  .headG { animation: headBob calc(var(--dur) * 2) ease-in-out infinite; }
  @keyframes headBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.6px); } }

  .eyeLid { animation: blink 4.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(0); } 94.5% { transform: scaleY(1); } }

  /* --- 速度感：速度线、后轮扬尘 --- */
  .streak { animation: streak .78s linear infinite; }
  @keyframes streak {
    0%   { transform: translateX(0) scaleX(.5); opacity: 0; }
    25%  { opacity: .7; }
    100% { transform: translateX(-520px) scaleX(1.6); opacity: 0; }
  }

  .puff { animation: puff .58s linear infinite; }
  @keyframes puff {
    0%   { transform: translate(0, 0) scale(.35); opacity: 0; }
    18%  { opacity: .45; }
    100% { transform: translate(-148px, -14px) scale(1.8); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage svg * { animation-duration: 3s !important; }
  }
</style>
</head>
<body>
<main class="card">
  <header class="head">
    <h1>骑单车的卡通鹈鹕</h1>
    <p>纯 CSS Keyframes · SVG 矢量绘制 · 零依赖 · 零脚本</p>
  </header>

  <div class="stage">
    <svg viewBox="0 0 1130 634" role="img" aria-labelledby="t d">
      <title id="t">一只卡通鹈鹕骑着带辐条的自行车向前行进</title>
      <desc id="d">白与浅黄色的鹈鹕生着大喉囊，双翅扶把、双腿交替踩踏板，车轮旋转，背景向后滚动。</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5fb2d2"/>
          <stop offset=".42" stop-color="#a7dbe8"/>
          <stop offset=".74" stop-color="#e2f0e3"/>
          <stop offset="1" stop-color="#fdf0c6"/>
        </linearGradient>
        <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#fff6d4" stop-opacity=".95"/>
          <stop offset=".45" stop-color="#ffe9a8" stop-opacity=".4"/>
          <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bodyG" x1=".2" y1="0" x2=".75" y2="1">
          <stop offset="0" stop-color="#fffdf6"/>
          <stop offset=".55" stop-color="#fdf7e6"/>
          <stop offset="1" stop-color="#f3e6bd"/>
        </linearGradient>
        <linearGradient id="wingG" x1=".15" y1="0" x2=".8" y2="1">
          <stop offset="0" stop-color="#fdf6e2"/>
          <stop offset="1" stop-color="#eddfb4"/>
        </linearGradient>
        <linearGradient id="billG" x1="0" y1="0" x2=".4" y2="1">
          <stop offset="0" stop-color="#ffd894"/>
          <stop offset="1" stop-color="#f0a94d"/>
        </linearGradient>
        <linearGradient id="pouchG" x1=".2" y1="0" x2=".5" y2="1">
          <stop offset="0" stop-color="#fdf2cd"/>
          <stop offset=".6" stop-color="#f7dfa6"/>
          <stop offset="1" stop-color="#eec87f"/>
        </linearGradient>
        <radialGradient id="shadowG" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#0d2231" stop-opacity=".5"/>
          <stop offset="1" stop-color="#0d2231" stop-opacity="0"/>
        </radialGradient>

        <clipPath id="clipStage"><rect x="0" y="0" width="1130" height="634"/></clipPath>
        <clipPath id="clipNear"><rect x="0" y="500" width="1130" height="120"/></clipPath>
      </defs>

      <g clip-path="url(#clipStage)">
        <!-- 天空 -->
        <rect x="0" y="0" width="1130" height="634" fill="url(#sky)"/>
        <circle cx="838" cy="106" r="96" fill="url(#sunGlow)"/>
        <circle cx="838" cy="106" r="34" fill="#fff7dc" opacity=".92"/>

        <!-- 云（漂移最慢） -->
        <g class="scroll clouds" opacity=".9">
          <g transform="translate(150 92) scale(1.15)"><ellipse rx="34" ry="21" fill="#fff"/><ellipse cx="-28" cy="8" rx="26" ry="15" fill="#fff"/><ellipse cx="28" cy="6" rx="24" ry="14" fill="#fff"/><ellipse cx="-4" cy="-12" rx="22" ry="15" fill="#fff"/></g>
          <g transform="translate(410 60) scale(.8)"><ellipse rx="34" ry="21" fill="#fff"/><ellipse cx="-28" cy="8" rx="26" ry="15" fill="#fff"/><ellipse cx="28" cy="6" rx="24" ry="14" fill="#fff"/><ellipse cx="-4" cy="-12" rx="22" ry="15" fill="#fff"/></g>
          <g transform="translate(710 42)"><ellipse rx="34" ry="21" fill="#fff"/><ellipse cx="-28" cy="8" rx="26" ry="15" fill="#fff"/><ellipse cx="28" cy="6" rx="24" ry="14" fill="#fff"/><ellipse cx="-4" cy="-12" rx="22" ry="15" fill="#fff"/></g>
          <g transform="translate(960 96) scale(.9)"><ellipse rx="34" ry="21" fill="#fff"/><ellipse cx="-28" cy="8" rx="26" ry="15" fill="#fff"/><ellipse cx="28" cy="6" rx="24" ry="14" fill="#fff"/><ellipse cx="-4" cy="-12" rx="22" ry="15" fill="#fff"/></g>
          <g transform="translate(1190 62) scale(1.05)"><ellipse rx="34" ry="21" fill="#fff"/><ellipse cx="-28" cy="8" rx="26" ry="15" fill="#fff"/><ellipse cx="28" cy="6" rx="24" ry="14" fill="#fff"/><ellipse cx="-4" cy="-12" rx="22" ry="15" fill="#fff"/></g>
          <g transform="translate(1430 100) scale(.75)"><ellipse rx="34" ry="21" fill="#fff"/><ellipse cx="-28" cy="8" rx="26" ry="15" fill="#fff"/><ellipse cx="28" cy="6" rx="24" ry="14" fill="#fff"/><ellipse cx="-4" cy="-12" rx="22" ry="15" fill="#fff"/></g>
        </g>

        <!-- 远山（慢） -->
