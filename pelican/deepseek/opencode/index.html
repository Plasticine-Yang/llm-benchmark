<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑单车 · Pelican on a Bike</title>
<style>
  :root{
    --cadence: 1.2s;
    --wheel-dur: .55s;
    --road-dur: .5s;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    display:grid;
    place-items:center;
    padding:28px 18px;
    background: radial-gradient(1200px 700px at 50% 0%, #1e2d4a 0%, #0d1526 55%, #090f1c 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color:#aebcd4;
  }
  main{ width:min(980px, 94vw); display:grid; gap:14px; justify-items:center; }
  .stage{
    width:100%;
    border-radius:20px;
    overflow:hidden;
    box-shadow: 0 32px 70px -34px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.07);
  }
  svg{ display:block; width:100%; height:auto; }
  p{ margin:0; font-size:13px; letter-spacing:.14em; opacity:.66; }

  @keyframes spin{
    to{ transform: rotate(360deg); }
  }
  @keyframes leg-thigh{
    0%{ transform: rotate(0deg); }
    6.25%{ transform: rotate(9.78deg); }
    12.5%{ transform: rotate(19.86deg); }
    18.75%{ transform: rotate(27.74deg); }
    25%{ transform: rotate(29.65deg); }
    31.25%{ transform: rotate(27.29deg); }
    37.5%{ transform: rotate(23.32deg); }
    43.75%{ transform: rotate(18.34deg); }
    50%{ transform: rotate(12.41deg); }
    56.25%{ transform: rotate(5.5deg); }
    62.5%{ transform: rotate(-2.1deg); }
    68.75%{ transform: rotate(-9.36deg); }
    75%{ transform: rotate(-14.6deg); }
    81.25%{ transform: rotate(-16.3deg); }
    87.5%{ transform: rotate(-14.01deg); }
    93.75%{ transform: rotate(-8.26deg); }
    100%{ transform: rotate(0deg); }
  }
  @keyframes leg-shin{
    0%{ transform: translate(0px, 0px) rotate(0deg); }
    6.25%{ transform: translate(-10.56px, 13.39px) rotate(-4.81deg); }
    12.5%{ transform: translate(-23.66px, 25.11px) rotate(-8.29deg); }
    18.75%{ transform: translate(-35.21px, 32.55px) rotate(-8.61deg); }
    25%{ transform: translate(-38.14px, 34.11px) rotate(-2.5deg); }
    31.25%{ transform: translate(-34.52px, 32.17px) rotate(7.55deg); }
    37.5%{ transform: translate(-28.59px, 28.56px) rotate(18.05deg); }
    43.75%{ transform: translate(-21.55px, 23.49px) rotate(27.46deg); }
    50%{ transform: translate(-13.77px, 16.66px) rotate(34.75deg); }
    56.25%{ transform: translate(-5.65px, 7.75px) rotate(38.9deg); }
    62.5%{ transform: translate(1.96px, -3.09px) rotate(39.08deg); }
    68.75%{ transform: translate(7.84px, -14.32px) rotate(35.2deg); }
    75%{ transform: translate(11.17px, -22.84px) rotate(28.35deg); }
    81.25%{ transform: translate(12.08px, -25.65px) rotate(20.35deg); }
    87.5%{ transform: translate(10.83px, -21.85px) rotate(12.63deg); }
    93.75%{ transform: translate(7.04px, -12.57px) rotate(5.81deg); }
    100%{ transform: translate(0px, 0px) rotate(0deg); }
  }
  @keyframes pedal-circle{
    0%{ transform: translate(0px, 0px); }
    6.25%{ transform: translate(-2.59px, 13.01px); }
    12.5%{ transform: translate(-9.96px, 24.04px); }
    18.75%{ transform: translate(-20.99px, 31.41px); }
    25%{ transform: translate(-34px, 34px); }
    31.25%{ transform: translate(-47.01px, 31.41px); }
    37.5%{ transform: translate(-58.04px, 24.04px); }
    43.75%{ transform: translate(-65.41px, 13.01px); }
    50%{ transform: translate(-68px, 0px); }
    56.25%{ transform: translate(-65.41px, -13.01px); }
    62.5%{ transform: translate(-58.04px, -24.04px); }
    68.75%{ transform: translate(-47.01px, -31.41px); }
    75%{ transform: translate(-34px, -34px); }
    81.25%{ transform: translate(-20.99px, -31.41px); }
    87.5%{ transform: translate(-9.96px, -24.04px); }
    93.75%{ transform: translate(-2.59px, -13.01px); }
    100%{ transform: translate(0px, 0px); }
  }
  @keyframes dash-left{
    to{ stroke-dashoffset: 120; }
  }
  @keyframes drift-cloud{
    to{ transform: translateX(-1600px); }
  }
  @keyframes scroll-hills{
    to{ transform: translateX(-900px); }
  }
  @keyframes scroll-ground{
    to{ transform: translateX(-300px); }
  }
  @keyframes zip-by{
    to{ transform: translateX(-1600px); }
  }
  @keyframes puff-out{
    0%{ transform: translate(0, 0) scale(.35); opacity:.55; }
    60%{ opacity:.3; }
    100%{ transform: translate(-72px, -30px) scale(1.6); opacity:0; }
  }
  @keyframes sea-saw{
    0%, 50%, 100%{ transform: translateY(0); }
    25%, 75%{ transform: translateY(-2.5px); }
  }
  .spin, .crank, .thigh, .knee, .shin, .pedal, .cloud, .zip,
  .hills-far, .hills-near, .ground, .puff, .rider{
    transform-box: view-box;
  }
  .spin{ animation: spin var(--wheel-dur) linear infinite; }
  .spin.rear{ transform-origin: 280px 355px; }
  .spin.front{ transform-origin: 640px 355px; }
  .crank{ animation: spin var(--cadence) linear infinite; transform-origin: 455px 350px; }
  .thigh, .knee{ animation: leg-thigh var(--cadence) linear infinite; transform-origin: 405px 200px; }
  .shin{ animation: leg-shin var(--cadence) linear infinite; transform-origin: 488.52px 255px; }
  .pedal{ animation: pedal-circle var(--cadence) linear infinite; }
  .delayed{ animation-delay: calc(var(--cadence) / -2); }
  .road-dash{ animation: dash-left var(--road-dur) linear infinite; }
  .cloud{ animation: drift-cloud linear infinite; }
  .hills-far{ animation: scroll-hills 20s linear infinite; }
  .hills-near{ animation: scroll-hills 11s linear infinite; }
  .ground{ animation: scroll-ground 1.25s linear infinite; }
  .zip{ animation: zip-by linear infinite; }
  .puff{ animation: puff-out .85s ease-out infinite; transform-origin: 215px 435px; }
  .rider{ animation: sea-saw var(--cadence) ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; }
  }
</style>
</head>
<body>
<main>
  <div class="stage">
    <svg viewBox="0 0 900 520" role="img" aria-label="卡通鹈鹕骑着带辐条的自行车，车轮旋转、双腿踩踏板、背景向后移动">
      <defs>
