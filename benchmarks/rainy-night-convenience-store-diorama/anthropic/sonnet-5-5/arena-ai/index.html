// ----- Toon 渐变贴图 -----
function makeToonGradient(steps=4){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 1;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,256,0);
  grad.addColorStop(0, '#2a2a2a');
  grad.addColorStop(0.32, '#6a6a6a');
  grad.addColorStop(0.58, '#b0b0b0');
  grad.addColorStop(1, '#ffffff');
  g.fillStyle = grad; g.fillRect(0,0,256,1);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.NoColorSpace;
  return tex;
}
const toonGrad = makeToonGradient();

// 轮廓线辅助
function addOutline(mesh, color=0x0a0f18, threshold=12){
  const edges = new THREE.EdgesGeometry(mesh.geometry, threshold);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color, transparent:true, opacity:0.95}));
  mesh.add(line);
  return line;
}
function toonMat(color, opts={}){
  return new THREE.MeshToonMaterial({ color, gradientMap: toonGrad, ...opts });
}

function makeGlass(w,h, x,y,z, rotY=0){
  const g = new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshPhysicalMaterial({
    color:0xffffff, transparent:true, opacity:0.18, roughness:0.08, metalness:0.05,
    transmission:0.85, thickness:0.2, envMapIntensity:1.1, side:THREE.DoubleSide
  }));
  g.position.set(x,y,z); g.rotation.y = rotY;
  storeGroup.add(g);
  // 玻璃窗框
  const frame = new THREE.Mesh(new THREE.BoxGeometry(w+0.4, h+0.4, 0.15), toonMat(0x1a2a3a));
  frame.position.set(x,y,z);
  frame.rotation.y = rotY;
  // 用线框描边替代实体避免遮挡
  const frEdges = new THREE.EdgesGeometry(new THREE.PlaneGeometry(w,h));
  const frLine = new THREE.LineSegments(frEdges, new THREE.LineBasicMaterial({color:0x1e2f42}));
  frLine.position.set(x,y,z+0.08);
  frLine.rotation.y = rotY;
  storeGroup.add(frLine);
  return g;
}

function createShelf(x,z, rot=0){
  const g = new THREE.Group();
  g.position.set(x,0.6,z); g.rotation.y=rot;
  const shelfMat = toonMat(0xf2ebe0);
  for(let level=0; level<3; level++){
    const plank = new THREE.Mesh(new THREE.BoxGeometry(7,0.25,2.2), shelfMat);
    plank.position.set(0, 1.2+level*1.9,0);
    plank.castShadow=true; plank.receiveShadow=true;
    g.add(plank); addOutline(plank,0x241d14,30);
    // 商品 (彩色小盒子)
    for(let i=0;i<5;i++){
      const col = [0xff7a7a,0xffd86e,0x7de0ff,0x8aff8a,0xc49aff][i%5];
      const box = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.7,0.7), toonMat(col));
      box.position.set(-2.4+i*1.2, 1.7+level*1.9, 0);
      g.add(box);
    }
  }
  // 侧板
  const sideA = new THREE.Mesh(new THREE.BoxGeometry(0.2,5.8,2.4), toonMat(0x3a2d1e));
  sideA.position.set(-3.5,3,0); g.add(sideA);
  const sideB = sideA.clone(); sideB.position.x=3.5; g.add(sideB);
  interior.add(g);
}

  pudCtx.clearRect(0,0,512,512);
  pudCtx.fillStyle='#0f2438'; pudCtx.fillRect(0,0,512,512);
  // 反射的光斑
  for(let i=0;i<6;i++){
    const x= 80+ i*70 + Math.sin(t*0.0007+i)*20;
    const y= 200+ Math.cos(t*0.0005+i*1.3)*30;
    const r= 40+ Math.sin(t*0.0006+i)*8;
    const g=pudCtx.createRadialGradient(x,y,0,x,y,r*1.8);
    g.addColorStop(0, `hsla(${35+i*18}, 100%, 62%, 0.32)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    pudCtx.fillStyle=g; pudCtx.beginPath(); pudCtx.arc(x,y,r*1.6,0,Math.PI*2); pudCtx.fill();
  }
}

// 玻璃雨痕纹理 (动态)
const glassRainCanvas=document.createElement('canvas'); glassRainCanvas.width=256; glassRainCanvas.height=512;
const glassCtx=glassRainCanvas.getContext('2d');
const glassRainTex=new THREE.CanvasTexture(glassRainCanvas);
glassRainTex.colorSpace=THREE.NoColorSpace;
function updateGlassRain(t){
  glassCtx.clearRect(0,0,256,512);
  glassCtx.strokeStyle='rgba(180,210,255,0.35)'; glassCtx.lineWidth=1.2; glassCtx.lineCap='round';
  for(let i=0;i<22;i++){
    const x= (i*23 + t*0.06)%256;
    const y0= (i*47 + t*0.12)%512;
    glassCtx.beginPath(); glassCtx.moveTo(x, y0);
    // 蜿蜒雨痕
    glassCtx.bezierCurveTo(x+2, y0+18, x-1, y0+36, x+1, y0+56);
    glassCtx.stroke();
    // 水滴头
    glassCtx.fillStyle='rgba(200,220,255,0.55)';
    glassCtx.beginPath(); glassCtx.arc(x+1, y0+56, 1.6,0,Math.PI*2); glassCtx.fill();
  }
  glassRainTex.needsUpdate=true;
}
const glassOverlayMat=new THREE.MeshBasicMaterial({map:glassRainTex, transparent:true, opacity:0.42, side:THREE.DoubleSide, depthWrite:false});
const glassRainMesh1=new THREE.Mesh(new THREE.PlaneGeometry(11,10), glassOverlayMat);

// ----- 动画循环 -----
let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=16.6;
  controls.update();

  // 雨下落
  const pAttr=rainGeo.attributes.position;
  for(let i=0;i<rainCount;i++){
    let y=pAttr.array[i*3+1];
    y -= rainVel[i]*1.0;
    if(y<0.5){ y= 48+Math.random()*8; pAttr.array[i*3]= (Math.random()-0.5)*90; pAttr.array[i*3+2]= (Math.random()-0.5)*90; }
    pAttr.array[i*3+1]=y;
    // 微风偏移
    pAttr.array[i*3] += Math.sin(t*0.0004 + i*0.1)*0.01;
  }
  pAttr.needsUpdate=true;
  const sAttr=rainStreakGeo.attributes.position;
  for(let i=0;i<900;i++){
    sAttr.array[i*3+1] -= 0.9;
    if(sAttr.array[i*3+1]<0.5){ sAttr.array[i*3+1]=46; }
  }
  sAttr.needsUpdate=true;

  // 滴水
  const dAttr=dripGeo.attributes.position;
  for(let i=0;i<60;i++){
    let y=dAttr.array[i*3+1];
    y -= 0.45 + Math.random()*0.15;
    if(y<0.45){ y=11; dAttr.array[i*3]= (Math.random()-0.5)*30; dAttr.array[i*3+2]= sD/2+4.4 + (Math.random()-0.5)*0.8; }
    dAttr.array[i*3+1]=y;
  }
  dAttr.needsUpdate=true;

  // 自动门开合 (每 3-5秒)
  const doorCycle = (Math.sin(t*0.0006) + Math.sin(t*0.00031*1.7))*0.5;
  const openPhase = Math.max(0, Math.sin(t*0.0005 -1.2)); // 0..1
  const openAmt = openPhase>0.15 ? Math.min(1, (openPhase-0.15)*1.6) : 0;
  doorL.position.x = -1.6 - openAmt*1.75;
  doorR.position.x =  1.6 + openAmt*1.75;
  // 门灯闪烁
  doorSensor.material.emissiveIntensity = 0.4 + openAmt*0.6;

  // 招牌霓虹轻微闪烁
  const flicker = 1.8 + Math.sin(t*0.004)*0.2 + (Math.random()<0.015? -0.6:0);
  neonTube.material.emissiveIntensity = flicker;
  neonTube2.material.emissiveIntensity = flicker*0.95;
  signBoard.position.y = 14.6 + Math.sin(t*0.001)*0.04;

  // 交通灯变化
  const trafficPhase = (t*0.00025)%1;
  if(trafficPhase<0.45){ tlRed.material.emissiveIntensity=2.0; tlYellow.material.emissiveIntensity=0.08; tlGreen.material.emissiveIntensity=0.08; }
  else if(trafficPhase<0.55){ tlRed.material.emissiveIntensity=0.08; tlYellow.material.emissiveIntensity=2.0; tlGreen.material.emissiveIntensity=0.08; }
  else { tlRed.material.emissiveIntensity=0.08; tlYellow.material.emissiveIntensity=0.08; tlGreen.material.emissiveIntensity=2.0; }

  // 积水波纹动画
  if(t%70<2) drawPuddleTexture(t);
  puddleTex.needsUpdate=true;
  puddleMesh.position.y = 0.435 + Math.sin(t*0.0015)*0.02;

  // 玻璃雨痕
  updateGlassRain(t);

  // 室内灯轻微呼吸
  warmLight1.intensity = 76 + Math.sin(t*0.0012)*6;
  lampLight1.intensity = 68 + Math.sin(t*0.0023)*8;

  // 轻微相机浮动 (增强模型感)
  // 不自动旋转，仅保留用户控制

  renderer.render(scene, camera);
}
drawPuddleTexture(0);
