<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>雨の夜・街角コンビニ — miniature diorama</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse 70% 55% at 50% 38%, #34405e 0%, #222c46 38%, #141b2e 70%, #0b101d 100%);
    background-color:#0b101d;
  }
  #stage { position:fixed; inset:0; display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  #stage.dragging { cursor:grabbing; }
  #vignette {
    position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(ellipse 78% 76% at 50% 47%, rgba(0,0,0,0) 52%, rgba(5,8,18,0.30) 82%, rgba(4,6,14,0.58) 100%);
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vignette"></div>
<script src="./three.min.js"></script>
<script src="./core.js"></script>
<script src="./world.js"></script>
<script src="./props.js"></script>
<script src="./fx.js"></script>
</body>
</html>
