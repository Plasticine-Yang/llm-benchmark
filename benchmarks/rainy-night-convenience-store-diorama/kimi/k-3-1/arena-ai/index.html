<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雨夜のコンビニ — 街角ジオラマ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05080e;}
  body{cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;}
  body.dragging{cursor:grabbing;}
  canvas{display:block;width:100%;height:100%;}
  #veil{position:fixed;inset:0;background:#05080e;pointer-events:none;opacity:1;transition:opacity 1.8s cubic-bezier(.3,.7,.3,1);}
  #veil.gone{opacity:0;}
</style>
</head>
<body>
<div id="veil"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ══════════════════════════════════════════════════════════════
   雨夜便利店 · 街角微缩模型  —  toon-shaded diorama
   ══════════════════════════════════════════════════════════════ */
const COARSE = matchMedia('(pointer: coarse)').matches;
const HI = !COARSE && Math.min(innerWidth, innerHeight) > 520;

/* ---------- layout constants (metres, base = 20 x 20) ---------- */
const L = {
  half: 10, baseH: 0.78,
  roadZ0: 3.2, roadZ1: 7.6,          // front road (runs along X)
  roadX0: 5.0, roadX1: 10.0,         // right road (runs along Z)
  walkH: 0.12, roadY: 0.012, markY: 0.022, wetY: 0.045,
  st: { x0: -7.0, x1: 2.4, z0: -6.6, z1: 1.2, h: 3.45 },   // store shell
  doorX0: -3.15, doorX1: -1.05, doorH: 2.62
};
const SX = (L.st.x0 + L.st.x1) / 2, SZ = (L.st.z0 + L.st.z1) / 2;
const SW = L.st.x1 - L.st.x0, SD = L.st.z1 - L.st.z0;

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, HI ? 2 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b1421, 0.0155);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.4, 260);
const CAM_HOME = new THREE.Vector3(14.6, 10.2, 15.4);
const CAM_START = new THREE.Vector3(21.0, 16.5, 22.0);
camera.position.copy(CAM_START);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.4, 1.25, -0.4);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.minDistance = 9.5;
controls.maxDistance = 46;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = 1.44;
controls.rotateSpeed = 0.62;
controls.zoomSpeed = 0.75;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;

let idleT = 0;
controls.addEventListener('start', () => { controls.autoRotate = false; idleT = 0; document.body.classList.add('dragging'); });
controls.addEventListener('end', () => { idleT = 0.0001; document.body.classList.remove('dragging'); });

/* ══════════════ toon material kit ══════════════ */
function gradientMap(stops) {
  const d = new Uint8Array(stops.length);
  for (let i = 0; i < stops.length; i++) d[i] = Math.round(stops[i] * 255);
  const t = new THREE.DataTexture(d, stops.length, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.generateMipmaps = false; t.needsUpdate = true;
  return t;
}
const GRAD = gradientMap([0.40, 0.66, 0.85, 1.0]);
const GRAD_SOFT = gradientMap([0.55, 0.78, 1.0]);

function toon(color, o = {}) {
  return new THREE.MeshToonMaterial(Object.assign({ color: new THREE.Color(color), gradientMap: GRAD }, o));
}
function basic(color, o = {}) {
  return new THREE.MeshBasicMaterial(Object.assign({ color: new THREE.Color(color) }, o));
}
const MAT_VC = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: GRAD });
const MAT_VC_SOFT = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: GRAD_SOFT });

/* outlines (inverted hull, screen-stable width) */
const OUT_VS = `
uniform float uT;
void main(){
  vec4 mv = modelViewMatrix * vec4(position,1.0);
  vec3 n = normalize(normalMatrix * normal);
  mv.xyz += n * uT * max(-mv.z, 1.0) * 0.055;
  gl_Position = projectionMatrix * mv;
}`;
const OUT_FS = `uniform vec3 uC; void main(){ gl_FragColor = vec4(uC,1.0); }`;
const outCache = {};
function outMat(t) {
  const k = t.toFixed(3);
  if (!outCache[k]) outCache[k] = new THREE.ShaderMaterial({
    uniforms: { uT: { value: t }, uC: { value: new THREE.Color(0x070c15) } },
    vertexShader: OUT_VS, fragmentShader: OUT_FS, side: THREE.BackSide
  });
  return outCache[k];
}
function outline(m, t = 1.0) {
  const o = new THREE.Mesh(m.geometry, outMat(t));
  o.castShadow = false; o.receiveShadow = false; o.renderOrder = -1;
  m.add(o); return o;
}

/* ══════════════ geometry accumulator (merges + vertex colours) ══════════════ */
const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3(1, 1, 1);
function Acc() { this.g = []; }
Acc.prototype.box = function (w, h, d, x, y, z, c, rx, ry, rz) {
  const m = new THREE.Matrix4().compose(_v.set(x, y, z), _q.setFromEuler(_e.set(rx || 0, ry || 0, rz || 0)), _s);
  this.g.push({ g: new THREE.BoxGeometry(w, h, d), m, c }); return this;
};
Acc.prototype.cyl = function (rt, rb, h, seg, x, y, z, c, rx, ry, rz) {
  const m = new THREE.Matrix4().compose(_v.set(x, y, z), _q.setFromEuler(_e.set(rx || 0, ry || 0, rz || 0)), _s);
  this.g.push({ g: new THREE.CylinderGeometry(rt, rb, h, seg), m, c }); return this;
};
Acc.prototype.sph = function (r, w, h, x, y, z, c) {
  const m = new THREE.Matrix4().compose(_v.set(x, y, z), _q.identity(), _s);
  this.g.push({ g: new THREE.SphereGeometry(r, w, h), m, c }); return this;
};
Acc.prototype.tor = function (r, t, rs, ts, x, y, z, c, rx, ry, rz) {
  const m = new THREE.Matrix4().compose(_v.set(x, y, z), _q.setFromEuler(_e.set(rx || 0, ry || 0, rz || 0)), _s);
  this.g.push({ g: new THREE.TorusGeometry(r, t, rs, ts), m, c }); return this;
};
Acc.prototype.geo = function (g, x, y, z, c, rx, ry, rz) {
  const m = new THREE.Matrix4().compose(_v.set(x, y, z), _q.setFromEuler(_e.set(rx || 0, ry || 0, rz || 0)), _s);
  this.g.push({ g, m, c }); return this;
};
function paint(geo, hex) {
  const col = new THREE.Color(hex);
  const n = geo.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = col.r; a[i * 3 + 1] = col.g; a[i * 3 + 2] = col.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(a, 3));
}
Acc.prototype.build = function (mat, parent, ol, shadow = true) {
  if (!this.g.length) return null;
  const gs = this.g.map(o => { const g = o.g.clone(); g.applyMatrix4(o.m); paint(g, o.c); return g; });
  const merged = BGU.mergeGeometries(gs, false);
  gs.forEach(g => g.dispose()); this.g.forEach(o => o.g.dispose()); this.g.length = 0;
  merged.computeBoundingSphere();
  const m = new THREE.Mesh(merged, mat || MAT_VC);
  m.castShadow = shadow; m.receiveShadow = shadow;
  (parent || scene).add(m);
  if (ol) outline(m, ol);
  return m;
};

/* simple single mesh helper */
function put(geo, mat, x, y, z, parent, ol) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m); if (ol) outline(m, ol); return m;
}

/* ══════════════ canvas textures ══════════════ */
const FONT_J = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
const FONT_B = '"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif';
const ALL_TEX = [];
function canvasTex(w, h, fn, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); fn(x, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  // redraw once webfonts are ready so the signage gets the rounded gothic face
  t._redraw = () => { x.clearRect(0, 0, w, h); fn(x, w, h); t.needsUpdate = true; };
  ALL_TEX.push(t);
  return t;
}
function rr(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }

/* main fascia sign */
const texSign = canvasTex(2048, 256, (x, w, h) => {
  x.fillStyle = '#0d3d47'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#fdf3dd'; x.fillRect(0, 0, w, h * 0.74);
  x.fillStyle = '#f2683f'; x.fillRect(0, h * 0.74, w, h * 0.10);
  x.fillStyle = '#17a2a8'; x.fillRect(0, h * 0.84, w, h * 0.16);
  // moon logo
  const cx = 150, cy = h * 0.37, R = 78;
  x.fillStyle = '#f5a623'; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.fill();
  x.fillStyle = '#fdf3dd'; x.beginPath(); x.arc(cx + 40, cy - 18, R * 0.92, 0, 7); x.fill();
  x.fillStyle = '#f5a623'; x.beginPath(); x.arc(cx - 46, cy + 40, 5, 0, 7); x.fill();
  x.font = `900 118px ${FONT_J}`; x.fillStyle = '#123a4a'; x.textBaseline = 'middle';
  x.fillText('ムーンマート', 260, h * 0.34);
  x.font = `800 62px ${FONT_J}`; x.fillStyle = '#e2593a';
  x.fillText('MOON  MART', 268, h * 0.60);
  // repeated mini logos along the band
  for (let i = 0; i < 5; i++) {
    const bx = 1080 + i * 190;
    x.fillStyle = '#fdf3dd'; x.beginPath(); x.arc(bx, h * 0.42, 26, 0, 7); x.fill();
    x.fillStyle = '#17a2a8'; x.beginPath(); x.arc(bx + 13, h * 0.42 - 7, 24, 0, 7); x.fill();
  }
  x.font = `700 40px ${FONT_B}`; x.fillStyle = '#eaf6f4';
  x.fillText('24H  OPEN', 1080, h * 0.72);
});
/* small pole-sign panel */
const texPole = canvasTex(256, 512, (x, w, h) => {
  x.fillStyle = '#0f4451'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#fdf3dd'; rr(x, 16, 16, w - 32, 190, 22); x.fill();
  x.fillStyle = '#f5a623'; x.beginPath(); x.arc(w / 2, 108, 58, 0, 7); x.fill();
  x.fillStyle = '#fdf3dd'; x.beginPath(); x.arc(w / 2 + 30, 92, 54, 0, 7); x.fill();
  x.font = `900 40px ${FONT_J}`; x.fillStyle = '#123a4a'; x.textAlign = 'center';
  x.fillText('営業中', w / 2, 182);
  x.fillStyle = '#eaf6f4'; x.font = `900 62px ${FONT_J}`; x.fillText('24', w / 2, 300);
  x.font = `800 34px ${FONT_J}`; x.fillText('HOURS', w / 2, 350);
  x.fillStyle = '#f2683f'; rr(x, 40, 392, w - 80, 74, 16); x.fill();
  x.fillStyle = '#fff3e2'; x.font = `800 34px ${FONT_J}`; x.fillText('ATM', w / 2, 440);
});
/* interior floor */
const texFloor = canvasTex(1024, 768, (x, w, h) => {
  x.fillStyle = '#e6ddcb'; x.fillRect(0, 0, w, h);
  x.strokeStyle = 'rgba(120,110,95,.30)'; x.lineWidth = 2;
  for (let i = 0; i <= 12; i++) { x.beginPath(); x.moveTo(i * w / 12, 0); x.lineTo(i * w / 12, h); x.stroke(); }
  for (let i = 0; i <= 9; i++) { x.beginPath(); x.moveTo(0, i * h / 9); x.lineTo(w, i * h / 9); x.stroke(); }
  for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(150,140,120,${Math.random() * .10})`; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  // guide strip to the register
  x.fillStyle = 'rgba(214,90,60,.55)'; x.fillRect(w * 0.60, h * 0.10, 26, h * 0.80);
  x.fillStyle = 'rgba(30,120,140,.45)'; x.fillRect(w * 0.16, h * 0.62, w * 0.40, 20);
  x.save(); x.translate(w * 0.70, h * 0.5); x.rotate(-Math.PI / 2);
  x.font = `800 44px ${FONT_J}`; x.fillStyle = 'rgba(90,70,50,.55)'; x.textAlign = 'center';
  x.fillText('レジ →', 0, 0); x.restore();
});
/* posters */
function posterTex(kind) {
  return canvasTex(256, 384, (x, w, h) => {
    const pal = [['#1d6f8c', '#ffd166', '#f4643c'], ['#8c3a6e', '#ffd9e3', '#2ec4b6'], ['#2c5f3f', '#e9f5db', '#f2a03d'], ['#39406b', '#ffcf5c', '#ef6f6f']][kind % 4];
    x.fillStyle = pal[1]; x.fillRect(0, 0, w, h);
    x.fillStyle = pal[0]; x.fillRect(0, 0, w, h * 0.52);
    x.fillStyle = pal[2]; x.beginPath(); x.arc(w * 0.5, h * 0.30, w * 0.26, 0, 7); x.fill();
    x.fillStyle = pal[1]; x.beginPath(); x.arc(w * 0.58, h * 0.26, w * 0.20, 0, 7); x.fill();
    x.fillStyle = pal[0]; x.font = `900 52px ${FONT_J}`; x.textAlign = 'center';
    x.fillText(['新商品', 'おでん', 'フェア', 'コーヒー'][kind % 4], w / 2, h * 0.70);
    x.fillStyle = pal[2]; x.font = `700 26px ${FONT_B}`;
    x.fillText(['NEW ARRIVAL', 'ODEN 40% OFF', 'AUTUMN FAIR', 'HOT COFFEE'][kind % 4], w / 2, h * 0.79);
    x.fillStyle = pal[0]; x.fillRect(w * 0.14, h * 0.86, w * 0.72, 8);
  });
}
/* oden banner */
const texOden = canvasTex(512, 128, (x, w, h) => {
  x.fillStyle = '#f6e7c8'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#c0392b'; rr(x, 10, 10, w - 20, h - 20, 14); x.fill();
  x.fillStyle = '#ffeccd'; x.font = `900 76px ${FONT_J}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('お で ん', w / 2, h / 2 + 4);
});
/* register back lightbox */
const texLightbox = canvasTex(1024, 256, (x, w, h) => {
  x.fillStyle = '#fff4dc'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#1d6f8c'; x.fillRect(0, h * 0.72, w, h * 0.28);
  const items = ['お弁当 398円〜', '揚げたてチキン', 'コーヒー 110円', 'スイーツ新入荷'];
  x.font = `800 54px ${FONT_J}`; x.fillStyle = '#c0392b'; x.textBaseline = 'middle';
  items.forEach((t, i) => x.fillText(t, 26 + i * 256, h * 0.36));
  x.fillStyle = '#fff4dc'; x.font = `800 40px ${FONT_J}`;
  items.forEach((t, i) => x.fillText(t.slice(0, 4), 40 + i * 256, h * 0.86));
});
/* bulletin board */
const texBoard = canvasTex(512, 640, (x, w, h) => {
  x.fillStyle = '#e8e2d2'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#2f3b4d'; x.fillRect(0, 0, w, 62);
  x.fillStyle = '#fff'; x.font = `800 34px ${FONT_J}`; x.textBaseline = 'middle'; x.fillText('掲示板', 22, 32);
  const notes = [['#fdf6c8', '地域のお知らせ'], ['#d9f0ff', '求人情報'], ['#ffe3e0', 'イベント'], ['#e6ffe0', '回覧板']];
  notes.forEach((n, i) => {
    const nx = 22 + (i % 2) * 240, ny = 84 + Math.floor(i / 2) * 210;
    x.save(); x.translate(nx, ny); x.rotate((Math.random() - .5) * .05);
    x.fillStyle = n[0]; x.fillRect(0, 0, 220, 190);
    x.fillStyle = 'rgba(0,0,0,.14)'; x.fillRect(0, 182, 220, 8);
    x.fillStyle = '#333'; x.font = `700 24px ${FONT_J}`; x.fillText(n[1], 14, 36);
    x.fillStyle = 'rgba(60,60,60,.5)';
    for (let k = 0; k < 7; k++) x.fillRect(14, 62 + k * 17, 150 + Math.random() * 40, 5);
    x.fillStyle = '#d94f4f'; x.beginPath(); x.arc(196, 20, 9, 0, 7); x.fill();
    x.restore();
  });
  x.fillStyle = 'rgba(120,110,90,.35)'; x.fillRect(0, 520, w, h - 520);
  x.fillStyle = '#5a5142'; x.font = `700 26px ${FONT_J}`; x.fillText('※ 掲示は月末に更新', 22, 560);
});
/* vending banner */
function vendTex(kind) {
  return canvasTex(512, 128, (x, w, h) => {
    x.fillStyle = kind ? '#1a6fa8' : '#c8392f'; x.fillRect(0, 0, w, h);
    x.fillStyle = 'rgba(255,255,255,.16)'; x.fillRect(0, h * .55, w, h * .45);
    x.fillStyle = '#fff6e2'; x.font = `900 58px ${FONT_J}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(kind ? 'つめたい' : 'あたたかい', w / 2, h / 2 - 4);
    x.font = `700 24px ${FONT_B}`; x.fillText(kind ? 'COLD DRINKS' : 'HOT DRINKS', w / 2, h * .80);
  });
}
/* ramen shop sign across the street */
const texRamen = canvasTex(512, 160, (x, w, h) => {
  x.fillStyle = '#1a1410'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#ffb03a'; rr(x, 8, 8, w - 16, h - 16, 12); x.fill();
  x.fillStyle = '#2a1a0e'; x.font = `900 78px ${FONT_J}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('らーめん', w / 2, h / 2 + 2);
});
/* alley back sign */
const texAlley = canvasTex(256, 128, (x, w, h) => {
  x.fillStyle = '#241a2a'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#ff7ab8'; x.font = `900 54px ${FONT_J}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('スナック', w / 2, h / 2);
});
/* road sign */
const texStreet = canvasTex(512, 128, (x, w, h) => {
  x.fillStyle = '#1b5fa8'; x.fillRect(0, 0, w, h);
  x.strokeStyle = '#fff'; x.lineWidth = 7; x.strokeRect(10, 10, w - 20, h - 20);
  x.fillStyle = '#fff'; x.font = `800 52px ${FONT_J}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('さくら通り', w / 2, h / 2);
});
/* soft round sprite (rain drip / steam) */
function softSprite(inner, outer) {
  return canvasTex(64, 64, (x, w, h) => {
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, inner); g.addColorStop(.45, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  });
}
const texDrop = softSprite('rgba(220,240,255,1)', 'rgba(150,200,240,.55)');
const texSteam = softSprite('rgba(255,240,215,.55)', 'rgba(255,225,190,.16)');

/* ══════════════ lights ══════════════ */
scene.add(new THREE.AmbientLight(0x3a4f74, 0.62));
const hemi = new THREE.HemisphereLight(0x5a80b4, 0x12161f, 0.55); scene.add(hemi);

const moon = new THREE.DirectionalLight(0x9dc2f0, 0.85);
moon.position.set(-11, 16, 9);
moon.castShadow = true;
moon.shadow.mapSize.set(HI ? 2048 : 1024, HI ? 2048 : 1024);
moon.shadow.camera.left = -13; moon.shadow.camera.right = 13;
moon.shadow.camera.top = 13; moon.shadow.camera.bottom = -13;
moon.shadow.camera.near = 1; moon.shadow.camera.far = 46;
moon.shadow.bias = -0.0009; moon.shadow.normalBias = 0.022;
scene.add(moon);

const PL = [];
function pl(color, intensity, dist, x, y, z, decay = 2) {
  const l = new THREE.PointLight(color, intensity, dist, decay);
  l.position.set(x, y, z); scene.add(l); PL.push(l); return l;
}
const lIn1 = pl(0xffdcae, 26, 13, -4.6, 2.75, -3.6);

(function backdrop() {
  const g = new THREE.SphereGeometry(95, 32, 20);
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uT: { value: 0 } },
    vertexShader: `varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader: `
      varying vec3 vP; uniform float uT;
      void main(){
        float h = clamp(vP.y*0.5+0.5, 0.0, 1.0);
        vec3 top = vec3(0.016,0.026,0.052);
        vec3 mid = vec3(0.055,0.090,0.145);
        vec3 bot = vec3(0.020,0.032,0.052);
        vec3 c = mix(bot, mid, smoothstep(0.10,0.50,h));
        c = mix(c, top, smoothstep(0.48,0.95,h));
        // faint city glow low on the horizon
        float g1 = pow(max(0.0, 1.0-abs(vP.y)*4.2), 3.0);
        c += vec3(0.09,0.075,0.11) * g1 * (0.55+0.45*smoothstep(-0.4,0.9,vP.x));
        c += vec3(0.03,0.07,0.09) * g1 * (0.55+0.45*smoothstep(0.5,-0.9,vP.x));
        // soft grain
        float n = fract(sin(dot(vP.xy*400.0, vec2(12.9898,78.233)))*43758.5453);
        c += (n-0.5)*0.006;
        gl_FragColor = vec4(c,1.0);
      }`
  });
  const s = new THREE.Mesh(g, m); s.renderOrder = -10; scene.add(s);
})();

(function guardrail() {
  const a = new Acc();

  function run(x0, z0, x1, z1, n) {
    for (let i = 0; i <= n; i++) {
      const t = i / n, x = x0 + (x1 - x0) * t, z = z0 + (z1 - z0) * t;
      a.cyl(0.045, 0.05, 0.86, 8, x, 0.12 + 0.43, z, col2);
      a.cyl(0.075, 0.075, 0.05, 8, x, 0.14, z, col2);

    const len = Math.hypot(x1 - x0, z1 - z0), ang = Math.atan2(x1 - x0, z1 - z0);
    a.box(0.055, 0.075, len, (x0 + x1) / 2, 0.12 + 0.80, (z0 + z1) / 2, col, 0, ang, 0);
    a.box(0.055, 0.075, len, (x0 + x1) / 2, 0.12 + 0.52, (z0 + z1) / 2, col, 0, ang, 0);
    for (let i = 0; i < Math.floor(len / 0.5); i++) {
      const t = (i + 0.5) / Math.floor(len / 0.5);
      a.box(0.058, 0.075, 0.20, x0 + (x1 - x0) * t, 0.12 + 0.80, z0 + (z1 - z0) * t, 0xf0a03a, 0, ang, 0);
    }
  }
  run(1.45, 3.02, 3.55, 3.02, 5);
  run(3.55, 3.02, 4.28, 2.66, 2);
  run(4.80, 2.05, 4.80, -1.95, 8);

})();

/* ══════════════ wet-road reflector (积水反射) ══════════════ */
const wetUni = {
  uTime: { value: 0 },

let wetPlane = null;
(function wet() {
  const geo = new THREE.PlaneGeometry(20, 20);
  const shader = {
    uniforms: Object.assign({ color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null } }, wetUni),
    vertexShader: `
      uniform mat4 textureMatrix;
      varying vec4 vProj; varying vec2 vW;

      float sdRB(vec2 p, vec2 c, vec2 h, float r){ vec2 d=abs(p-c)-h+r; return length(max(d,0.0))+min(max(d.x,d.y),0.0)-r; }
      float rings(vec2 p, float t, float sc, float sp, out float hi){
        p*=sc; vec2 g=floor(p), f=fract(p); hi=0.0;
        for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
          vec2 o=vec2(float(x),float(y)); vec2 cell=g+o;
          float h1=h21(cell), h2=h21(cell+7.3);
          vec2 cp=o+vec2(h1,h2)-0.5;
          float d=length(f-cp);
          float ph=fract(t*sp+h1);
          float rad=ph*0.85;
          float w=0.055+ph*0.05;
          float r=smoothstep(w,0.0,abs(d-rad))*(1.0-ph)*(1.0-ph);
          hi=max(hi,r);
        }
        return hi;
      }
      void main(){
        vec2 p = vW;
        // road regions
        float roadA = 1.0-smoothstep(-0.02,0.22, sdRB(p, vec2(0.0,5.4), vec2(10.2,2.2), 0.0));
        float roadB = 1.0-smoothstep(-0.02,0.22, sdRB(p, vec2(7.5,0.0), vec2(2.6,10.2), 0.0));
        float road = max(roadA,roadB);
        // gutter
        float gut = (1.0-smoothstep(0.0,0.14, abs(p.y-3.44))) * 0.95;
        gut = max(gut, (1.0-smoothstep(0.0,0.14, abs(p.x-5.24))) * 0.95);
        // crosswalk bars (reflective paint)
        float cw = 0.0;
        float bx = fract((p.x-2.55)/0.52);
        if(p.x>2.45 && p.x<4.85 && p.y>3.30 && p.y<7.50) cw = smoothstep(0.55,0.30,abs(bx-0.5))*0.85;
        float bz = fract((p.y-1.75)/0.42);
        if(p.y>1.65 && p.y<3.15 && p.x>5.10 && p.x<9.60) cw = max(cw, smoothstep(0.55,0.30,abs(bz-0.5))*0.85);
        // puddle noise (only outside buildings)
        float n = h21(floor(p*1.35)) *0.5 + h21(floor(p*0.62)+3.1)*0.5;
        float inside = step(sdRB(p, vec2(-2.3,-2.7), vec2(4.9,4.1), 0.0), 0.0)
                     * step(sdRB(p, vec2(-9.05,-4.2), vec2(1.1,6.1), 0.0), 0.0)
                     * step(p.y, 7.55);
        float pud = smoothstep(0.62,0.86,n) * 0.55 * inside * (1.0-road);
        float wet = clamp(max(max(road*0.88, gut), max(cw, pud)), 0.0, 1.0);
        if(wet < 0.01) discard;

        float hi; float r1 = rings(p, uTime, 2.6, 1.35, hi);
        float hi2; rings(p+13.7, uTime, 5.4, 2.1, hi2);
        hi = max(hi, hi2*0.6);
        // impact rings fed by the awning drips
        float drip = 0.0;
        for(int i=0;i<10;i++){
          vec4 dd = uDrops[i];
          float age = uTime - dd.z;
          if(age > 0.0 && age < 1.5 && dd.w > 0.0){
            float rad = age*1.05;
            float dist = length(p - dd.xy);
            drip = max(drip, smoothstep(0.055,0.0,abs(dist-rad))*(1.0-age/1.5)*dd.w);
          }
        }
        hi = max(hi, drip);

        // cheap wobble distortion for the reflection sample
        vec2 wob = vec2(sin(p.y*7.0+uTime*2.4)+sin(p.x*5.3-uTime*1.9),
                        cos(p.x*6.1-uTime*2.1)+cos(p.y*4.7+uTime*1.6));
        wob += (vec2(sin(hi*6.283)*0.6));
        vec4 pc = vProj;
        pc.xy += wob * 0.055 * pc.w * (0.35+wet);
        vec3 refl = texture2DProj(tDiffuse, pc).rgb;
        refl = pow(refl, vec3(0.85));
        refl *= vec3(0.62,0.74,0.95);
        refl *= 0.55 + 0.45*wet;

        float fres = 0.42 + 0.58*clamp(1.0 - abs(normalize(pc.xyz).y), 0.0, 1.0);
        float a = wet * (0.40 + 0.42*fres) + hi*0.30*wet;
        vec3 col = refl + vec3(0.30,0.44,0.62)*hi*wet*0.55;
        // rain sparkle
        float sp = h21(floor(p*90.0)+floor(uTime*9.0));
        col += vec3(0.5,0.62,0.8)*step(0.9965, sp)*wet;
        gl_FragColor = vec4(col, clamp(a,0.0,0.9));
      }`
  };
  try {
    wetPlane = new Reflector(geo, {
      textureWidth: HI ? 1024 : 512, textureHeight: HI ? 1024 : 512,
      clipBias: 0.004, shader: shader, color: 0x8899bb, multisample: 0

    wetPlane.material.depthWrite = false;
    wetPlane.renderOrder = 1;
    scene.add(wetPlane);
  } catch (e) { wetPlane = null; }
})();

const rainUni = {

(function rain() {
  const N = HI ? 2600 : 1000;
  const pos = new Float32Array(N * 2 * 3), tip = new Float32Array(N * 2), seed = new Float32Array(N * 2);

      tip[j] = k; seed[j] = s;
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aTip', new THREE.BufferAttribute(tip, 1));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: Object.assign({
      uShelter: { value: [
        new THREE.Vector4(L.st.x0 - 0.2, L.st.z0 - 0.2, L.st.x1 + 0.2, L.st.z1 + 1.5),  // store + awning
        new THREE.Vector4(-10.1, -10.1, -8.1, 1.7),                                      // left building
        new THREE.Vector4(-10.1, 7.7, 5.1, 10.1),                                        // far block
        new THREE.Vector4(0.5, 1.1, 2.6, 2.0),                                           // vending canopy
        new THREE.Vector4(-99, -99, -98, -98)
      ] },
      uShelterH: { value: [3.06, 6.6, 5.4, 2.26, 0] }
    }, rainUni),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute float aTip; attribute float aSeed;
      uniform float uTime,uSpeed,uRange,uLen,uSlant;
      varying float vA; varying vec3 vW;
      void main(){
        float y = mod(position.y - uTime*uSpeed + aSeed*uRange, uRange);
        vec3 p = vec3(position.x, y, position.z);
        float ln = uLen*(0.55+aSeed*0.85);
        p.y -= aTip*ln;
        p.x += aTip*uSlant*ln;
        p.z += aTip*uSlant*0.35*ln;

    fragmentShader: `
      uniform vec3 uColor; uniform vec4 uShelter[5]; uniform float uShelterH[5];
      varying float vA; varying vec3 vW;

          vec4 s = uShelter[i];
          if(vW.x>s.x && vW.x<s.z && vW.z>s.y && vW.z<s.w && vW.y<uShelterH[i]) a = 0.0;

const DRIP_N = 16;
const drips = [];

(function dripSystem() {
  const pos = new Float32Array(DRIP_N * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    size: 0.10, map: texDrop, transparent: true, depthWrite: false,

  for (let i = 0; i < DRIP_N; i++) drips.push({ active: false, x: 0, y: 0, z: 0, vy: 0, t: Math.random() * 3 });
  drips._geo = g;
})();
function spawnDrip() {
  const d = drips.find(v => !v.active) || drips[(Math.random() * DRIP_N) | 0];
  d.active = true;
  d.x = awningEdge.x0 + Math.random() * (awningEdge.x1 - awningEdge.x0);
  d.z = awningEdge.z + (Math.random() - 0.5) * 0.06;
  d.y = awningEdge.y; d.vy = -0.2;
}
function pushRipple(x, z, s) {
  const arr = wetUni.uDrops.value;
  arr[dropSlot % arr.length].set(x, z, wetUni.uTime.value, s);
  dropSlot++;
}
function updateDrips(dt) {

    d.vy -= 9.2 * dt; d.y += d.vy * dt;
    arr[i * 3] = d.x; arr[i * 3 + 1] = d.y; arr[i * 3 + 2] = d.z;
    if (d.y <= 0.16) { d.active = false; d.t = 0.4 + Math.random() * 2.2; pushRipple(d.x, d.z, 1.0); arr[i * 3 + 1] = -99; }
  }
  drips._geo.attributes.position.needsUpdate = true;
}

/* ══════════════ steam (oden + alley vent) ══════════════ */
const steam = (() => {
  const N = 46, pos = new Float32Array(N * 3), dat = [];
  for (let i = 0; i < N; i++) dat.push({ x: 0, y: 0, z: 0, t: Math.random() * 3, life: 0, src: i % 3 });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ size: 0.42, map: texSteam, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.5, sizeAttenuation: true, fog: false });
  const p = new THREE.Points(g, m); p.frustumCulled = false; p.renderOrder = 4; scene.add(p);
  return { p, g, dat, N };
})();
function updateSteam(dt) {
  const arr = steam.g.attributes.position.array;
  for (let i = 0; i < steam.N; i++) {
    const s = steam.dat[i];
    s.life += dt;
    if (s.life > 2.6) {
      s.life = 0;
      if (s.src === 2) { s.x = -7.5 + (Math.random() - .5) * 0.3; s.z = -3.2 + (Math.random() - .5) * 0.3; s.y = 0.7; }
      else { s.x = 1.2 + (Math.random() - .5) * 0.8; s.z = 0.42 + (Math.random() - .5) * 0.4; s.y = 1.25; }
    }
    const k = s.life / 2.6;
    arr[i * 3] = s.x + Math.sin(s.life * 2.2 + i) * 0.10 * k;
    arr[i * 3 + 1] = s.y + s.life * 0.34;
    arr[i * 3 + 2] = s.z + Math.cos(s.life * 1.8 + i) * 0.08 * k;
  }
  steam.g.attributes.position.needsUpdate = true;
}

/* ══════════════ door puddle light spill + extra detail ══════════════ */
const spill = (() => {
  const m = new THREE.MeshBasicMaterial({ color: 0xffcf94, transparent: true, opacity: 0.0, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.5), m);
  p.rotation.x = -Math.PI / 2; p.position.set((L.doorX0 + L.doorX1) / 2, 0.135, L.st.z1 + 0.95);
  p.renderOrder = 2; scene.add(p); return { m, p };
})();

/* ══════════════ post-processing ══════════════ */
let composer = null;
if (HI) {
  try {
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.62, 0.62, 0.66);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());
    composer.setSize(innerWidth, innerHeight);
  } catch (e) { composer = null; }
}

/* ══════════════ animation ══════════════ */
let doorT = 3.0, doorOpen = 0, doorTarget = 0, doorNext = 5.0;
let flick = 1.0, flickT = 0;
const clock = new THREE.Clock();
let introT = 0;
const tmpV = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* intro camera ease */
  if (introT < 1) {
    introT = Math.min(1, introT + dt * 0.30);
    const k = 1 - Math.pow(1 - introT, 3);
    camera.position.lerpVectors(CAM_START, CAM_HOME, k);
  }

  /* idle auto-rotate resumes */
  if (idleT > 0) { idleT += dt; if (idleT > 5.0) { controls.autoRotate = true; idleT = 0; } }
  controls.update();

  /* shaders */
  glassUniforms.uTime.value = t;
  rainUni.uTime.value = t;
  wetUni.uTime.value = t;

  /* automatic door */
  doorT += dt;
  if (doorTarget === 0 && doorT > doorNext) { doorTarget = 1; doorT = 0; }
  else if (doorTarget === 1 && doorT > 2.4) { doorTarget = 0; doorT = 0; doorNext = 5 + Math.random() * 9; }
  const sp = 3.4;
  doorOpen += (doorTarget - doorOpen) * Math.min(1, dt * sp);
  const slide = doorOpen * 0.92;
  doorL.position.x = (L.doorX0 + L.doorX1) / 2 - 0.52 - slide;
  doorR.position.x = (L.doorX0 + L.doorX1) / 2 + 0.52 + slide;
  spill.m.opacity = doorOpen * 0.30;
  lDoor.intensity = 8 + doorOpen * 14;

  /* sign flicker */
  flickT -= dt;
  if (flickT <= 0) { flickT = 0.05 + Math.random() * 0.5; flick = Math.random() < 0.14 ? 0.55 + Math.random() * 0.35 : 1.0; }
  const fl = flick * (0.94 + 0.06 * Math.sin(t * 21.0));
  signGlowMat.color.setRGB(fl, fl * 0.985, fl * 0.94);
  lSign.intensity = 13 * fl;
  poleSignMats.forEach(m => m.color.setRGB(0.9 + 0.1 * fl, 0.9 + 0.1 * fl, 0.9 + 0.1 * fl));

  /* street lamp breathing */
  lLamp.intensity = 29 + Math.sin(t * 3.1) * 0.9 + Math.sin(t * 11.7) * 0.4;
  lampHead.material.color.setScalar(0.96 + Math.sin(t * 7.3) * 0.04);

  /* interior light shimmer */
  lIn1.intensity = 25.5 + Math.sin(t * 1.7) * 0.7;
  lIn3.intensity = 19.5 + Math.sin(t * 2.3 + 1.2) * 0.6;

  /* traffic light cycle */
  traffic.t += dt;
  const cyc = traffic.t % 11;
  let st = cyc < 5 ? 2 : (cyc < 6.4 ? 1 : 0);
  if (st !== traffic.state) {
    traffic.state = st;
    traffic.lamps.forEach((l, i) => { l.mat.color.setHex(i === st ? l.col : 0x1b1516); });
    const ped = st === 2;
    traffic.pm1.color.setHex(ped ? 0x2a1414 : 0xff4a3a);
    traffic.pm2.color.setHex(ped ? 0x4ae07a : 0x14291c);
  }

  /* drips + steam */
  updateDrips(dt);
  updateSteam(dt);
  if (Math.random() < dt * 2.2) pushRipple((Math.random() - 0.5) * 18, 3.3 + Math.random() * 4.2, 0.5 + Math.random() * 0.5);

  /* keep the model framed */
  controls.target.lerp(tmpV.set(-0.4, 1.25, -0.4), 0.06);

  if (composer) composer.render(); else renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});

/* let the webfonts settle, then start */
(async function boot() {
  try {
    await Promise.race([
      Promise.all([document.fonts.load(`900 64px ${FONT_J.split(',')[0]}`), document.fonts.load(`700 32px ${FONT_B.split(',')[0]}`)]),
      new Promise(r => setTimeout(r, 2600))
    ]);
  } catch (e) { }
  ALL_TEX.forEach(t => { try { t._redraw(); } catch (e) { } });
  renderer.compile(scene, camera);
  animate();
  renderer.domElement.style.opacity = '0';
  renderer.domElement.style.transition = 'opacity 1.6s ease';
  requestAnimationFrame(() => {
    renderer.domElement.style.opacity = '1';
    setTimeout(() => document.getElementById('veil').classList.add('gone'), 120);
  });
})();
</script>
</body>
</html>
