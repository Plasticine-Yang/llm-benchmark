<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>雨夜便利店街角 · 微缩立体模型</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070c; }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }

  /* 载入遮罩（场景就绪后自动淡出，不属于场景 UI） */
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 45%, #101a2a 0%, #05070c 70%);
    color: #cfe0f5; letter-spacing: .18em; font-size: 13px; z-index: 20;
    transition: opacity .9s ease; pointer-events: none;
  }
  #boot .inner { text-align: center; }
  #boot .bar { margin-top: 14px; width: 190px; height: 2px; background: #1d2a3d; overflow: hidden; border-radius: 2px; }
  #boot .bar i { display: block; height: 100%; width: 35%; background: linear-gradient(90deg, #59d2ff, #ffd9a0); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(330%); } }
  #boot.done { opacity: 0; visibility: hidden; }

  #fatal {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 30;
    background: #0b0f16; color: #ffb4b4; font-size: 13px; padding: 24px;
    white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; overflow: auto;
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="boot"><div class="inner"><div>RAINY NIGHT&nbsp;&nbsp;/&nbsp;&nbsp;KONBINI CORNER</div><div class="bar"><i></i></div></div></div>
  <pre id="fatal"></pre>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    const fatal = document.getElementById('fatal');
    const showFatal = (e) => {
      fatal.style.display = 'grid';
      fatal.textContent = '场景初始化失败：\n' + (e && (e.stack || e.message) || e);
    };
    window.addEventListener('error', (ev) => showFatal(ev.error || ev.message));
    window.addEventListener('unhandledrejection', (ev) => showFatal(ev.reason));
    import('./src/main.js').catch(showFatal);
  </script>
</body>
</html>
