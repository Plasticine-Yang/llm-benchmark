<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>雨夜のコンビニ街角 — Corner Store in the Rain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05070d;
    font-family:'Zen Kaku Gothic New',system-ui,sans-serif;cursor:grab}
  body.grabbing{cursor:grabbing}
  canvas{display:block;width:100%;height:100%}
  #veil{position:fixed;inset:0;background:#05070d;opacity:1;transition:opacity 1.5s ease .15s;pointer-events:none;z-index:5}
  #veil.off{opacity:0}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:4;
    box-shadow:inset 0 0 220px rgba(2,4,10,.75), inset 0 0 60px rgba(2,4,10,.5)}
</style>
</head>
<body>
<div id="veil"></div>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ══════════════════════════════════════════════════════════
   0 · layout of the miniature block (single source of truth)
   ══════════════════════════════════════════════════════════ */
const HALF=10;
const L={
  roadFront:{z0:-10,z1:-6.35}, roadSide:{x0:6.35,x1:10},
  walkFront:{z0:-6.35,z1:-4.15}, walkSide:{x0:4.15,x1:6.35},
  store:{x0:-7.85,x1:0.55,z0:-4.15,z1:2.7},
  alley:{x0:0.55,x1:2.95,z0:-1.35,z1:7.0},
  nbr:{x0:2.95,x1:4.15,z0:-4.15,z1:3.2},
  curbH:0.30
};
const CL=(L.store.x0+L.store.x1)/2, CW=L.store.x1-L.store.x0;
const CD0=L.store.z0, CD1=L.store.z1, CZ=(CD0+CD1)/2, CD=CD1-CD0;
const FRONT=CD0, RIGHT=L.store.x1;

/* ══════════════════════════════════════════════════════════
   1 · renderer · scene · camera · controls · post
   ══════════════════════════════════════════════════════════ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
const DPR=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(DPR); renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.06;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0b1526,30,86);

const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,0.5,220);
camera.position.set(15.4,11.2,16.6);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.1,1.75,-0.5);
controls.enableDamping=true; controls.dampingFactor=.075;
controls.enablePan=false; controls.minDistance=11; controls.maxDistance=44;
controls.minPolarAngle=.16; controls.maxPolarAngle=1.36;
controls.rotateSpeed=.85; controls.zoomSpeed=.8;
controls.autoRotate=true; controls.autoRotateSpeed=.32;
let idleT=0;
controls.addEventListener('start',()=>{controls.autoRotate=false;document.body.classList.add('grabbing');});
controls.addEventListener('end',()=>{idleT=0;document.body.classList.remove('grabbing');});

const root=new THREE.Group(); scene.add(root);

const rtOpts={type:THREE.HalfFloatType,samples:4};
const rt=new THREE.WebGLRenderTarget(innerWidth*DPR,innerHeight*DPR,rtOpts);
const composer=new EffectComposer(renderer,rt);
composer.setPixelRatio(DPR); composer.setSize(innerWidth,innerHeight);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.62,.62,.62);
composer.addPass(bloom);
const Grade={
  uniforms:{tDiffuse:{value:null},uT:{value:0},uVig:{value:1.0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
  uniform sampler2D tDiffuse;uniform float uT,uVig;varying vec2 vUv;
  float h(vec2 p){return fract(sin(dot(p,vec2(19.7,78.2)))*43758.5453);}
  void main(){
    vec2 u=vUv; vec3 c=texture2D(tDiffuse,u).rgb;
    // faint anamorphic bleed from the strongest highlights
    float m=smoothstep(.72,1.0,max(c.r,max(c.g,c.b)));
    c+=vec3(.30,.44,.62)*m*.055*texture2D(tDiffuse,clamp(u+vec2(.017,0.),0.,1.)).r;
    c+=vec3(.40,.28,.22)*m*.05*texture2D(tDiffuse,clamp(u-vec2(.017,0.),0.,1.)).r;
    // vignette + cool lift in the shadows
    float d=length((u-.5)*vec2(1.16,1.0));
    c*=1.0-smoothstep(.42,.95,d)*.60*uVig;
    c=mix(c,c*vec3(.86,.94,1.12),smoothstep(.5,1.,d)*.5);
    c+=vec3(.012,.02,.036)*(1.0-smoothstep(0.,.7,length(c)));
    c+= (h(u*900.+fract(uT))-.5)*.011;
    gl_FragColor=vec4(max(c,0.),1.0);
  }`
};
composer.addPass(new ShaderPass(Grade));
composer.addPass(new OutputPass());

/* ══════════════════════════════════════════════════════════
   2 · cel-shading kit (ramped toon mats + ink lineart)
   ══════════════════════════════════════════════════════════ */
function rampTex(steps){
  const d=new Uint8Array(steps.length);
  steps.forEach((v,i)=>d[i]=Math.round(v*255));
  const t=new THREE.DataTexture(d,steps.length,1,THREE.RedFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter; t.generateMipmaps=false; t.needsUpdate=true;
  return t;
}
const RAMP=rampTex([.30,.58,.80,1.0]);
const RAMP_SOFT=rampTex([.42,.66,.88,1.0]);
const INK=0x0b1424;
const lineDark=new THREE.LineBasicMaterial({color:INK,transparent:true,opacity:.62});
const lineSoft=new THREE.LineBasicMaterial({color:0x1a2740,transparent:true,opacity:.34});
const lineWarm=new THREE.LineBasicMaterial({color:0x3a2418,transparent:true,opacity:.5});
const geoCache=new Map();
function boxGeo(w,h,d){ const key=`b${w.toFixed(3)}_${h.toFixed(3)}_${d.toFixed(3)}`;
  let g=geoCache.get(key); if(!g){ g=new THREE.BoxGeometry(w,h,d); geoCache.set(key,g);} return g; }
function planeGeo(w,h){ const key=`p${w.toFixed(3)}_${h.toFixed(3)}`;
  let g=geoCache.get(key); if(!g){ g=new THREE.PlaneGeometry(w,h); geoCache.set(key,g);} return g; }
function inked(m,kind){ const t=kind==='soft'?lineSoft:kind==='warm'?lineWarm:lineDark;
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,26),t)); return m; }
function toon(color,o={}){
  const m=new THREE.MeshToonMaterial({color,gradientMap:o.soft?RAMP_SOFT:RAMP});
  if(o.em!==undefined){ m.emissive=new THREE.Color(o.em); m.emissiveIntensity=o.ei??1; }
  if(o.op!==undefined){ m.transparent=true; m.opacity=o.op; }
  m.side=o.side||THREE.FrontSide;
  return m;
}
function glow(color,i=1,op=1){ const m=new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide});
  m.toneMapped=false; if(op<1){m.transparent=true;m.opacity=op;} return m; }
/* ── pools every builder can register into (declared up-front) ── */
const POOL={pops:[],noren:[],steam:[],fans:[],laundry:[],motes:[]};
const POPS=POOL.pops, NOREN=POOL.noren, STEAM=POOL.steam, FANS=POOL.fans,
      LAUNDRY=POOL.laundry, MOTES=POOL.motes;
function box(parent,w,h,d,mat,x=0,y=0,z=0,o={}){
  const m=new THREE.Mesh(boxGeo(w,h,d),mat);
  if(o.ink!==false) inked(m,o.ink);
  m.position.set(x,y,z); if(o.ry) m.rotation.y=o.ry; if(o.rx) m.rotation.x=o.rx; if(o.rz) m.rotation.z=o.rz;
  parent.add(m); return m;
}
function plane(parent,w,h,mat,x=0,y=0,z=0,rx=0,ry=0){
  const m=new THREE.Mesh(planeGeo(w,h),mat); m.position.set(x,y,z);
  m.rotation.x=rx; m.rotation.y=ry; parent.add(m); return m;
}
function cyl(parent,rt,rb,h,seg,mat,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(x,y,z); parent.add(m); return m;
}
const G=[]; // instanced generic pool {geo,key,x,y,z,sx,sy,sz,ry,rx,color}
function push(geoKey,parent,x,y,z,sx,sy,sz,color,ry=0,rx=0){ G.push({geoKey,parent,x,y,z,sx,sy,sz,color,ry,rx}); }
function flushInstances(){
  const byGeo=new Map();
  for(const it of G){ if(!byGeo.has(it.geoKey)) byGeo.set(it.geoKey,[]); byGeo.get(it.geoKey).push(it); }
  for(const [key,list] of byGeo){
    const [type,a,b,c]=key.split('|');
    let geo;
    if(type==='box') geo=new THREE.BoxGeometry(1,1,1);
    else if(type==='cyl') geo=new THREE.CylinderGeometry(+a,+b,+c,+((list[0].seg||6)));
    else if(type==='sphere') geo=new THREE.SphereGeometry(+a,8,6);
    else continue;
    const mat=new THREE.MeshToonMaterial({color:0xffffff,gradientMap:RAMP});
    const im=new THREE.InstancedMesh(geo,mat,list.length);
    const M=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),v=new THREE.Vector3(),p=new THREE.Vector3();
    const col=new THREE.Color();
    list.forEach((it,i)=>{ e.set(it.rx||0,it.ry||0,0); q.setFromEuler(e);
      p.set(it.x,it.y,it.z); v.set(it.sx,it.sy,it.sz); M.compose(p,q,v);
      im.setMatrixAt(i,M); im.setColorAt(i,col.set(it.color)); });
    im.instanceMatrix.needsUpdate=true; if(im.instanceColor) im.instanceColor.needsUpdate=true;
    list[0].parent.add(im);
  }
  G.length=0;
}
function boxI(parent,w,h,d,x,y,z,color,ry=0){ push('box|'+w.toFixed(3)+'|'+h.toFixed(3)+'|'+d.toFixed(3),parent,x,y,z,w,h,d,color,ry); }

/* ══════════════════════════════════════════════════════════
   3 · canvas texture atelier (signage · posters · ground)
   ══════════════════════════════════════════════════════════ */
const JP='"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif';
const JP2='"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif';
const repaint=[];
function tex(w,h,paint,o={}){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  const build=()=>{ x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,w,h); paint(x,c); t.needsUpdate=true; };
  paint(x,c);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=o.linear?THREE.NoColorSpace:THREE.SRGBColorSpace;
  t.anisotropy=8; t.wrapS=t.wrapT=o.wrap||THREE.ClampToEdgeWrapping;
  if(o.rep) t.repeat.set(o.rep[0],o.rep[1]);
  if(o.text) repaint.push(build);
  return t;
}
document.fonts&&document.fonts.ready.then(()=>{ repaint.forEach(f=>{try{f();}catch(e){}}); });
function rr(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r);
  x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
function txt(x,s,a,b,size,col,font=JP,al='center',bl='middle'){
  x.font=`${size}px ${font}`; x.fillStyle=col; x.textAlign=al; x.textBaseline=bl; x.fillText(s,a,b); }
function speckle(x,w,h,n,col,a){ for(let i=0;i<n;i++){ x.fillStyle=`rgba(${col},${Math.random()*a})`;
  x.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);} }
function radial(x,cx,cy,r,inner,outer,pow=1){
  const g=x.createRadialGradient(cx,cy,0,cx,cy,r);
  for(let i=0;i<=8;i++){ const t=i/8;
    g.addColorStop(t,blend(inner,outer,Math.pow(t,pow))); }
  x.fillStyle=g; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill();
}
function blend(a,b,t){ const pa=pa_(a),pb=pa_(b);
  return `rgb(${Math.round(pa[0]+(pb[0]-pa[0])*t)},${Math.round(pa[1]+(pb[1]-pa[1])*t)},${Math.round(pa[2]+(pb[2]-pa[2])*t)})`; }
function pa_(s){ const m=s.replace(/[^0-9,]/g,'').split(',').map(Number);
  if(m.length>=3) return m.slice(0,3);
  const h=s.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

/* ── the painted ground: asphalt, tiles, markings, AO ─────── */
const GS=1448, GK=GS/(HALF*2);
const gx=v=>(v+HALF)*GK, gz=v=>(v+HALF)*GK;
function paintGround(){
  const cC=document.createElement('canvas'); cC.width=cC.height=GS; const x=cC.getContext('2d');
  const cM=document.createElement('canvas'); cM.width=cM.height=GS; const m=cM.getContext('2d');
  m.fillStyle='#000'; m.fillRect(0,0,GS,GS);
  // asphalt base
  const g0=x.createLinearGradient(0,0,0,GS);
  g0.addColorStop(0,'#242c3c'); g0.addColorStop(.5,'#212837'); g0.addColorStop(1,'#1b2230');
  x.fillStyle=g0; x.fillRect(0,0,GS,GS);
  speckle(x,GS,GS,26000,'210,225,255',.05); speckle(x,GS,GS,14000,'0,0,0',.30);
  // tar seams + patch repairs
  for(let i=0;i<26;i++){
    x.strokeStyle=`rgba(12,16,24,${.16+Math.random()*.22})`; x.lineWidth=1+Math.random()*3.4;
    x.beginPath(); let px=Math.random()*GS,py=Math.random()*GS; x.moveTo(px,py);
    for(let j=0;j<7;j++){ px+=(Math.random()-.5)*120; py+=(Math.random()-.5)*120; x.lineTo(px,py);} x.stroke();
  }
  for(let i=0;i<9;i++){ const px=Math.random()*GS,py=Math.random()*GS,r=30+Math.random()*90;
    x.fillStyle='rgba(30,36,50,.5)'; x.beginPath(); x.ellipse(px,py,r,r*.66,Math.random(),0,7); x.fill();
    x.strokeStyle='rgba(10,14,20,.4)'; x.lineWidth=2; x.stroke(); }
  const rectC=(a,b,w,h,fill)=>{ x.fillStyle=fill; x.fillRect(gx(a),gz(b),w*GK,h*GK); };
  const rectM=(a,b,w,h,fill)=>{ m.fillStyle=fill; m.fillRect(gx(a),gz(b),w*GK,h*GK); };
  // ── sidewalks (L band) ──
  const tile=(a,b,w,h,base,line,joint)=>{
    rectC(a,b,w,h,base);
    x.lineWidth=1.6; x.strokeStyle=line;
    for(let t=a;t<=a+w+.01;t+=joint){ x.beginPath(); x.moveTo(gx(t),gz(b)); x.lineTo(gx(t),gz(b+h)); x.stroke(); }
    for(let t=b;t<=b+h+.01;t+=joint){ x.beginPath(); x.moveTo(gx(a),gz(t)); x.lineTo(gx(a+w),gz(t)); x.stroke(); }
  };
  tile(L.walkFront.z1, L.roadSide.x0, -0.001, 0, '#00000000','#00000000',1); // noop guard
  const wf=L.walkFront, ws=L.walkSide;
  // front sidewalk + side sidewalk + corner fill
  rectC(-10, wf.z0, 20, wf.z1-wf.z0, '#4b5163');
  rectC(ws.x0, -10, ws.x1-ws.x0, 20, '#4b5163');
  x.fillStyle='#4b5163'; x.fillRect(gx(ws.x0),gz(wf.z0),(ws.x1-ws.x0)*GK,(wf.z1-wf.z0)*GK);
  // tiles
  x.strokeStyle='rgba(28,34,46,.55)'; x.lineWidth=2;
  for(let t=-10;t<=10.001;t+=1.05){
    x.beginPath(); x.moveTo(gx(t),gz(wf.z0)); x.lineTo(gx(t),gz(wf.z1)); x.stroke();
    x.beginPath(); x.moveTo(gx(ws.x0),gz(t)); x.lineTo(gx(ws.x1),gz(t)); x.stroke();
  }
  for(let t=wf.z0;t<=wf.z1+.01;t+=1.05){ x.beginPath(); x.moveTo(gx(-10),gz(t)); x.lineTo(gx(ws.x1),gz(t)); x.stroke(); }
  for(let t=ws.x0;t<=ws.x1+.01;t+=1.05){ x.beginPath(); x.moveTo(gx(t),gz(-10)); x.lineTo(gx(t),gz(wf.z0)); x.stroke(); }
  x.fillStyle='rgba(200,214,236,.05)'; x.fillRect(gx(-10),gz(wf.z0),20*GK,.34*GK);
  x.fillRect(gx(ws.x1-.34),gz(-10),.34*GK,20*GK);
  // tactile paving strip
  x.fillStyle='#c9a437'; x.fillRect(gx(-7.4),gz(-5.72),7.9*GK,.62*GK);
  x.fillRect(gx(-7.4),gz(-5.72),.62*GK,1.6*GK);
  m.fillStyle='rgba(0,180,0,.5)'; m.fillRect(gx(-7.4),gz(-5.72),7.9*GK,.62*GK);
  // curbs
  const curb=(a,b,w,h)=>{ rectC(a,b,w,h,'#666e80');
    x.strokeStyle='rgba(230,240,255,.22)'; x.lineWidth=2.2;
    x.strokeRect(gx(a),gz(b),w*GK,h*GK); };
  curb(-10,L.roadFront.z1,20,.20); curb(L.roadSide.x0,-10,.20,20);
  // ── road markings ──
  const mark=(fn)=>{ fn(); };
  x.save(); m.save();
  const paintMark=(a,b,w,h)=>{ x.fillStyle='#c8d2dd'; x.fillRect(gx(a),gz(b),w*GK,h*GK);
    m.fillStyle='rgba(255,0,0,.9)'; m.fillRect(gx(a),gz(b),w*GK,h*GK); };
  // front crosswalk (walk direction = z)
  for(let t=-6.4;t<=4.6;t+=1.62) paintMark(t,-9.55,1.02,3.02);
  // side crosswalk
  for(let t=-9.2;t<=1.4;t+=1.62) paintMark(7.05,t,2.75,1.0);
  // stop line front street
  paintMark(-10,-6.62,7.6,.30);
  // lane dash on front street
  for(let t=-9.6;t<6.6;t+=2.7) paintMark(t,-8.28,1.5,.16);
  // side street centre dash
  for(let t=-4.2;t<6.4;t+=2.7) paintMark(8.02,t,.16,1.5);
  // parking bays (駐輪・駐車)
  x.strokeStyle='rgba(200,210,222,.85)'; m.strokeStyle='rgba(255,0,0,.8)'; x.lineWidth=3; m.lineWidth=3;
  for(let i=0;i<3;i++){ const a=-7.4+i*2.26;
    x.strokeRect(gx(a),gz(-5.98),2.06*GK,1.34*GK); m.strokeRect(gx(a),gz(-5.98),2.06*GK,1.34*GK); }
  txt(x,'駐輪場',gx(-3.0),gz(-5.3),26*GK/30,'rgba(214,224,238,.5)',JP2);
  // crosswalk heat stripes on road near store (skip)
  x.restore(); m.restore();
  // manhole + drain
  x.fillStyle='#2c3444'; x.beginPath(); x.arc(gx(2.4),gz(-8.1),.62*GK,0,7); x.fill();
  x.strokeStyle='rgba(150,168,190,.35)'; x.lineWidth=3; x.stroke();
  x.beginPath(); x.arc(gx(2.4),gz(-8.1),.34*GK,0,7); x.stroke();
  m.fillStyle='rgba(0,0,255,.5)'; m.beginPath(); m.arc(gx(2.4),gz(-8.1),.62*GK,0,7); m.fill();
  // gutter channel along curb
  const gut=(a,b,w,h)=>{ rectC(a,b,w,h,'#171d29');
    x.strokeStyle='rgba(160,178,200,.30)'; x.lineWidth=2;
    for(let t=a;t<a+w;t+=.46){ x.beginPath(); x.moveTo(gx(t),gz(b)+2); x.lineTo(gx(t),gz(b+h)-2); x.stroke(); }
    m.fillStyle='rgba(255,80,0,.55)'; m.fillRect(gx(a),gz(b),w*GK,h*GK); };
  gut(-10,-6.66,16.0,.30); gut(6.66,-10,.30,16.4);
  // ── painted contact AO ──
  x.globalCompositeOperation='multiply';
  const ao=(cx,cz,rx,rz,a)=>{ const p=x.createRadialGradient(gx(cx),gz(cz),0,gx(cx),gz(cz),rx*GK);
    p.addColorStop(0,`rgba(255,255,255,${a})`); p.addColorStop(.62,`rgba(120,120,140,${a*.55})`); p.addColorStop(1,'rgba(0,0,0,0)');
    x.save(); x.translate(gx(cx),gz(cz)); x.scale(1,rz/rx); x.translate(-gx(cx),-gz(cz));
    x.fillStyle=p; x.beginPath(); x.arc(gx(cx),gz(cz),rx*GK,0,7); x.fill(); x.restore(); };
  ao(CL,CZ,6.6,4.4,.62); ao(-5.9,-4.35,3.4,.9,.5); ao(3.6,-.5,1.9,4.2,.42);

   4 · ground: pavement shader with puddles, ripples, reflections
   ══════════════════════════════════════════════════════════ */
const GLOW=[
  {x:CL,z:FRONT-1.2,c:'#ffd7a0',i:2.6,tag:'store'},
  {x:-1.0,z:FRONT-0.5,c:'#ffcf92',i:1.5,tag:'door'},

  {x:1.9,z:2.4,c:'#ffb469',i:.75,tag:'alley'},
  {x:-5.4,z:-4.6,c:'#a7d8ff',i:.6,tag:'sign'},
  {x:3.6,z:.4,c:'#cfe0ff',i:.4,tag:'nbr'},
];
const gUni={
  uMap:{value:null},uMask:{value:null},uTime:{value:0},uCam:{value:new THREE.Vector3()},
  uLPos:{value:GLOW.map(g=>new THREE.Vector3(g.x,0,g.z))},
  uLCol:{value:GLOW.map(g=>new THREE.Color(g.c))},
  uLI:{value:GLOW.map(()=>1)},uPud:{value:1.0}
};
const groundMat=new THREE.ShaderMaterial({
  uniforms:gUni,
  vertexShader:`varying vec2 vUv;varying vec3 vW;
   void main(){ vUv=uv; vec4 wp=modelMatrix*vec4(position,1.0); vW=wp.xyz;
   gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader:`
  precision highp float;
  uniform sampler2D uMap,uMask; uniform float uTime,uPud; uniform vec3 uCam;
  uniform vec3 uLPos[8]; uniform vec3 uLCol[8]; uniform float uLI[8];
  varying vec2 vUv; varying vec3 vW;
  float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }
  float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<3;i++){ s+=a*vnoise(p); p*=2.07; a*=0.5;} return s; }
  float rings(vec2 p,float sc,float sp){
    vec2 q=p*sc; vec2 ip=floor(q),fp=fract(q);
    float ph=h21(ip); float tt=fract(uTime*sp+ph);
    vec2 c=vec2(h21(ip+11.3),h21(ip+23.7));
    float d=length(fp-c); float r=0.06+tt*0.62;
    float w=0.05+0.06*tt; float q=(d-r)/w;
    float ring=exp(-q*q);
    return ring*(1.0-tt)*(1.0-tt);
  }
  float band(float x,float c,float w){ return 1.0-smoothstep(w,w*2.2,abs(x-c)); }
  void main(){
    vec3 base=texture2D(uMap,vUv).rgb;
    vec3 mk=texture2D(uMask,vUv).rgb;
    float pud=clamp(mk.r*uPud,0.0,1.0);
    float mark=clamp(mk.g,0.0,1.0);
    vec2 p=vW.xz;
    float rip=rings(p,0.80,0.52)+0.5*rings(p+13.7,1.7,0.78);
    rip*=pud;
    // ambient cel lighting: cool sky from above, warm bounce from shopfront
    vec3 amb=mix(vec3(0.10,0.14,0.24),vec3(0.30,0.38,0.56),smoothstep(-0.2,1.0,fbm(p*0.5)));
    vec3 col=base*(amb*1.35+vec3(0.16));
    col+=base*vec3(0.16,0.13,0.10)*(1.0-smoothstep(0.0,7.0,length(p-vec2(${CL.toFixed(2)},${(FRONT-1.0).toFixed(2)}))));
    // wet gloss from the camera-facing sky
    vec3 V=normalize(uCam-vW);
    float fres=pow(1.0-max(dot(V,vec3(0.,0.,1.)),0.0),3.0);
    col+=vec3(0.26,0.34,0.50)*fres*(0.06+0.42*pud);
    // reflected lights, smeared anisotropically and broken up by ripples
    vec3 refl=vec3(0.0);
    for(int i=0;i<8;i++){
      vec2 lp=uLPos[i].xz;
      vec2 d=(p-lp)/vec2(1.05,2.75);
      float dd=length(d);
      float a=uLI[i]/(1.0+dd*dd*2.4);
      float wob=0.55+0.85*vnoise(p*3.2+vec2(0.0,uTime*0.5));
      wob*=0.6+0.75*fbm(p*7.0-vec2(uTime*0.14,0.0));
      a*=wob*(0.14+1.7*pud);
      a+=rip*0.10*uLI[i];
      refl+=uLCol[i]*a;
    }
    col+=refl*(1.0+mark*1.35);
    col=mix(col,col*0.55+refl*0.7+vec3(0.02,0.03,0.05),pud*0.62);
    // rain drop impacts glinting on any wet surface
    float hit=rings(p,3.4,1.35)*(0.25+0.75*pud);
    col+=vec3(0.42,0.50,0.66)*hit*0.45;
    // painted markings catch a little retroreflection
    col+=base*mark*0.22;
    // quantise to a cel ramp so the ground sits with the toon props
    col=floor(col*4.0+vec3(0.35))/4.0;
    gl_FragColor=vec4(col,1.0);
  }`
});

function rainLayer(n,{x0,x1,z0,z1,top,span,speed,len,wd,op,col,px}){
  const g=new THREE.BufferGeometry();
  const pos=new Float32Array(n*6), dp=new Float32Array(n*4), sd=new Float32Array(n*2), en=new Float32Array(n*2);
  for(let i=0;i<n;i++){
    const x=x0+Math.random()*(x1-x0), z=z0+Math.random()*(z1-z0);
    for(let k=0;k<2;k++){ const j=i*2+k;
      dp[j*2]=x; dp[j*2+1]=z; sd[j]=Math.random(); en[j]=k;
      g.setAttribute?0:0; }
  }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aDrop',new THREE.BufferAttribute(dp,2));
  g.setAttribute('aSeed',new THREE.BufferAttribute(sd,1));
  g.setAttribute('aEnd',new THREE.BufferAttribute(en,1));
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uTime:{value:0},uTop:{value:top},uSpan:{value:span},uSp:{value:speed},
      uLen:{value:len},uWind:{value:wd},uOp:{value:op},uCol:{value:new THREE.Color(col)}},
    vertexShader:`attribute vec2 aDrop;attribute float aSeed;attribute float aEnd;
      uniform float uTime,uTop,uSpan,uSp,uLen,uWind;varying float vA;
      void main(){ float sp=uSp*(.7+aSeed*.6);
        float y=uTop-mod(uTime*sp+aSeed*uSpan,uSpan);
        vec3 p=vec3(aDrop.x,y,aDrop.y);
        p+=vec3(uWind,1.0,uWind*.35)*uLen*(aEnd-.5);
        vA=smoothstep(uTop-uSpan*.92,uTop-uSpan*.10,y)*(.35+.65*aSeed);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`,
    fragmentShader:`uniform vec3 uCol;uniform float uOp;varying float vA;
      void main(){ gl_FragColor=vec4(uCol,vA*uOp); }`});
  const ls=new THREE.LineSegments(g,m); ls.frustumCulled=false; root.add(ls);
  return m;
}

        gl_FragColor=vec4(vec3(.85,.90,1.0),b*vA); }`});
  const pts=new THREE.Points(g,m); pts.frustumCulled=false; root.add(pts); STEAM.push(m);
}
/* dust motes / drizzle glints near the camera side */
{
  const n=140,g=new THREE.BufferGeometry();
  const P=new Float32Array(n*3),S=new Float32Array(n);
  for(let i=0;i<n;i++){ P[i*3]=rnd0(-9,9);P[i*3+1]=rnd0(.6,7);P[i*3+2]=rnd0(-9,7);S[i]=Math.random(); }
  g.setAttribute('position',new THREE.BufferAttribute(P,3));
  g.setAttribute('aSeed',new THREE.BufferAttribute(S,1));
  const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uTime:{value:0},uPx:{value:DPR}},
    vertexShader:`attribute float aSeed;uniform float uTime,uPx;varying float vA;
      void main(){ float ph=fract(uTime*.05+aSeed*3.3);
        vec3 p=position; p.y+=sin(ph*6.28)*.5; p.x+=cos(ph*6.28+aSeed)*.4;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_PointSize=(1.4+3.4*aSeed)*(260.0/max(.1,-mv.z))*uPx;
        vA=sin(ph*6.28)*.5+.5; vA*=.16; gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying float vA;void main(){ float d=length(gl_PointCoord-.5);
      gl_FragColor=vec4(vec3(.7,.82,1.0),exp(-pow(d/.3,2.0))*vA); }`});
  const pts=new THREE.Points(g,m); pts.frustumCulled=false; root.add(pts); MOTES.push(m);
}
/* ══════════════════════════════════════════════════════════
   11 · animation
   ══════════════════════════════════════════════════════════ */
const GLASS=[glassFront,glassSide];
let flick=1, flickT=0, tlT=0, tlI=2;
function tick(dt,t){
  // rain + wet surfaces
  gUni.uTime.value=t;
  for(const m of RAIN) m.uniforms.uTime.value=t;
  for(const m of SPL) m.uniforms.uTime.value=t;
  for(const m of DRIP) m.uniforms.uTime.value=t;
  for(const m of GLASS){ m.uniforms.uTime.value=t; m.uniforms.uCam.value.copy(camera.position); }
  for(const m of WETMATS){ m.uniforms.uTime.value=t; m.uniforms.uCam.value.copy(camera.position); }
  for(const s of STEAM) s.uniforms.uTime.value=t;
  for(const s of MOTES) s.uniforms.uTime.value=t;
  if(skyU) skyU.uT.value=t;
  Grade.uniforms.uT.value=t;
  // light array (with per-source live intensity)
  for(let i=0;i<8;i++) LINT[i]=(GLOW[i].cur??1)*GLOW[i].i;
  for(const m of WETMATS) m.uniforms.uLI.value=LINT;
  for(const m of GLASS) m.uniforms.uLI.value=LINT;
  // sign flicker: mostly steady, occasional stutter
  flickT-=dt;
  if(flickT<0){ flickT=rnd0(.06,.9); flick=Math.random()<.14?rnd0(.25,.75):1; }
  FLICK.cur=lerp2(FLICK.cur??1,flick,Math.min(1,dt*22));
  const sc=FLICK.cur;
  if(FLICK.signPlanes) for(const p of FLICK.signPlanes) p.material.color.setScalar(sc).multiplyScalar(1.05);
  if(FLICK.signMesh) FLICK.signMesh.color.setScalar(.85+sc*.3);
  GLOW[0].cur=.85+sc*.25; GLOW[6].cur=sc;
  if(FLICK.ind) FLICK.ind.color.setHex(0x63e08f).multiplyScalar(.8+.2*Math.sin(t*2.2));
  // vending + street lamp hum
  FLICK.vend=.96+.04*Math.sin(t*13.1)+ (Math.random()<.004?-.35:0);
  GLOW[3].cur=.9+.1*Math.sin(t*.7)+ (Math.random()<.0016? -.6 : 0);
  if(FLICK.lampLight) FLICK.lampLight.intensity=80*(.86+.14*Math.sin(t*1.7));
  if(FLICK.alleyLight) FLICK.alleyLight.intensity=7*(.72+.28*Math.sin(t*2.6+1.1));
  if(FLICK.vendLight) FLICK.vendLight.intensity=9*FLICK.vend;
  // automatic doors: idle, open, hold, close
  DOOR.timer-=dt;
  if(DOOR.timer<=0){ DOOR.tgt=DOOR.tgt>0.5?0:1; DOOR.timer=DOOR.tgt>.5?3.1:rnd0(4.6,9.4); }
  DOOR.open=lerp2(DOOR.open,DOOR.tgt,Math.min(1,dt*(DOOR.tgt>.5?4.6:3.1)));
  const sl=DOOR.open*1.42;
  doorL.m.position.x=-1.9+.95-sl; doorR.m.position.x=1.9-.95+sl;
  // AC fans, laundry, noren, hanging POPs
  for(let i=0;i<FANS.length;i++) FANS[i].rotation.z+=dt*(6.5+i*.7);
  for(let i=0;i<LAUNDRY.length;i++){ const s=LAUNDRY[i];
    s.rotation.x=Math.sin(t*.9+i)*0.13-.06; s.rotation.z=Math.sin(t*.6+i*2)*.08; }
  for(const n of NOREN){ n.rotation.z=Math.sin(t*1.3)*.05; }
  for(const p of POPS){ p.m.rotation.z=Math.sin(t*1.05+p.ph)*.10; p.m.rotation.x=-.12+Math.sin(t*.8+p.ph)*.05; }
  // traffic light cycle — and its reflection on the wet asphalt
  tlT+=dt;
  const dur=[6.4,1.6,5.0][tlI];
  if(tlT>dur){ tlT=0; tlI=(tlI+1)%3; }
  const on=[tlI===0,tlI===1,tlI===2];
  const cc=[new THREE.Color(0x59d17a),new THREE.Color(0xf0c04a),new THREE.Color(0xe8566f)];
  for(let i=0;i<3;i++){
    const m=TL.lights[i];
    m.material.color.copy(cc[i]).multiplyScalar(on[i]?.9+.1*Math.sin(t*9):.06);
    m.material.toneMapped=false;
  }
  TL.ped.color.setHex(tlI===2?0xff7a6b:0x3f6f5f);
  LCOL[4].copy(cc[tlI===2?2:0]).multiplyScalar(tlI===2?1:.35);
  GLOW[4].cur=.6+.5*(tlI===2?1:.25)+.1*Math.sin(t*3.1);
  // gentle life inside the store: a cooler hum brightness drift
  GLOW[1].cur=.9+.12*Math.sin(t*1.9);
  controls.update();
}
const MOTES=[];
function lerp2(a,b,t){ return a+(b-a)*t; }

const clock=new THREE.Clock();
function onResize(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth*DPR,innerHeight*DPR);
}
addEventListener('resize',onResize);
let tAcc=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  tAcc+=dt;
  gUni.uTime.value=t; gUni.uCam.value.copy(camera.position);
  for(let i=0;i<GLOW.length;i++) gUni.uLI.value[i]= (GLOW[i].cur??1)*GLOW[i].i;
  if(!controls.autoRotate){ idleT+=dt; if(idleT>4.2) controls.autoRotate=true; }
  controls.update();
  stepScene(dt,t);
  composer.render();
  if(!document.body.classList.contains('ready')){ document.body.classList.add('ready');
    document.getElementById('veil').classList.add('off'); }
});
function stepScene(){}
