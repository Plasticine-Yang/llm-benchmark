<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕快递 · Pelican Express — SVG 2D 动画</title>
<style>
  :root{
    --bg:#14101f;
    --surface:#1f1830;
    --surface2:#2a2140;
    --overlay:#332850;
    --text:#f4ecff;
    --muted:#b9a8d6;
    --coral:#ff5d73;
    --teal:#2ec4b6;
    --amber:#ffd166;
    --indigo:#6374ff;
    --danger:#ff4d6d;
    --line:rgba(255,255,255,.09);
    --stage-glow:rgba(255,93,115,.4);
    --radius:16px;
    font-size:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  /* ---------- 环境背景：极光 + 颗粒 ---------- */
  .aurora{position:fixed;inset:-20%;z-index:-2;pointer-events:none;
    background:
      radial-gradient(38% 42% at 18% 22%, rgba(255,93,115,.16), transparent 70%),
      radial-gradient(40% 44% at 82% 18%, rgba(46,196,182,.14), transparent 70%),
      radial-gradient(46% 50% at 60% 88%, rgba(99,116,255,.14), transparent 70%),
      linear-gradient(160deg,#171226 0%,#14101f 45%,#191227 100%);
    animation:auroraDrift 22s ease-in-out infinite alternate;
  }
  @keyframes auroraDrift{
    0%{transform:translate(0,0) scale(1)}
    100%{transform:translate(2.5%,-2%) scale(1.06)}
  }
  body::after{content:"";position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.6'/></svg>");
  }
  /* ---------- 滚动条 ---------- */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--surface)}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--teal),var(--coral));border-radius:8px;border:2px solid var(--surface)}
  ::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#4fe0d2,#ff8296)}
  *{scrollbar-width:thin;scrollbar-color:var(--coral) var(--surface)}
  /* ---------- 顶栏 ---------- */
  header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 26px;
    background:rgba(20,16,31,.82);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    animation:fadeUp .6s ease both;
  }
  .logo{display:flex;align-items:center;gap:12px}
  .logo-mark{width:40px;height:40px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--coral),var(--amber) 55%,var(--teal));
    display:grid;place-items:center;box-shadow:0 4px 18px rgba(255,93,115,.35)}
  .logo-mark svg{width:26px;height:26px}
  h1{font-size:1.22rem;letter-spacing:.06em;font-weight:800;
    background:linear-gradient(90deg,var(--coral),var(--amber) 50%,var(--teal));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{font-size:.72rem;color:var(--muted);letter-spacing:.28em;text-transform:uppercase;margin-top:2px}
  .head-chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface)}
  .chip b{color:var(--teal);font-weight:600}
  /* ---------- 布局 ---------- */
  main{display:grid;grid-template-columns:minmax(0,1fr) 322px;gap:22px;max-width:1460px;margin:0 auto;padding:24px 26px 10px}
  .stage-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.4),0 0 44px -12px var(--stage-glow);
    animation:fadeUp .7s .1s ease both;transition:box-shadow .6s ease;
    align-self:start;
  }
  .stage-wrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  #stage{display:block;width:100%;height:auto;background:#0b1030}
  .paused-badge{
    position:absolute;top:12px;right:12px;padding:6px 14px;border-radius:999px;
    background:rgba(20,16,31,.8);border:1px solid var(--coral);color:var(--coral);
    font-size:.75rem;letter-spacing:.2em;opacity:0;transform:translateY(-6px);
    transition:opacity .25s ease,transform .25s ease;pointer-events:none;backdrop-filter:blur(6px);
  }
  .paused-badge.show{opacity:1;transform:translateY(0)}
  .telemetry{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .tele{flex:1;min-width:110px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
  .tele .k{font-size:.68rem;color:var(--muted);letter-spacing:.14em}
  .tele .v{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .tele .v small{font-size:.68rem;color:var(--muted);font-weight:400;margin-left:3px}
  .tele:nth-child(1) .v{color:var(--coral)}
  .tele:nth-child(2) .v{color:var(--teal)}
  .tele:nth-child(3) .v{color:var(--amber)}
  .tele:nth-child(4) .v{color:var(--indigo)}
  /* ---------- 控制台 ---------- */
  aside{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 22px;position:sticky;top:82px;
    max-height:calc(100vh - 104px);overflow-y:auto;
    animation:fadeUp .7s .2s ease both;
  }
  .panel-title{font-size:.85rem;font-weight:800;letter-spacing:.2em;color:var(--text);display:flex;align-items:center;gap:8px}
  .panel-title::before{content:"";width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--teal));box-shadow:0 0 10px var(--coral)}
  .group{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
  .group:first-of-type{border-top:none;margin-top:14px;padding-top:0}
  .group h2{font-size:.68rem;font-weight:600;color:var(--muted);letter-spacing:.3em;margin-bottom:12px}
  .ctl{margin-bottom:13px;animation:fadeUp .5s ease both}
  .ctl .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .ctl label{font-size:.8rem;color:var(--text)}
  .ctl output{font-size:.75rem;font-variant-numeric:tabular-nums;color:var(--teal);font-weight:600}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline:none;cursor:pointer;
    background:linear-gradient(90deg,var(--teal) 0%,var(--coral) 50%,rgba(255,255,255,.12) 50%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:3px solid var(--coral);box-shadow:0 0 0 4px rgba(255,93,115,.18),0 2px 8px rgba(0,0,0,.5);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2);box-shadow:0 0 0 6px rgba(255,93,115,.25),0 2px 10px rgba(0,0,0,.5)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--coral);box-shadow:0 0 0 4px rgba(255,93,115,.18)}
  input[type=range]::-moz-range-track{background:transparent}
  /* 主题分段 */
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .seg button{
    padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface2);
    color:var(--muted);font-size:.78rem;cursor:pointer;font-family:inherit;transition:all .2s ease;
  }
  .seg button:hover{color:var(--text);border-color:rgba(255,255,255,.25);transform:translateY(-1px)}
  .seg button.active{
    background:linear-gradient(135deg,var(--coral),var(--amber));color:#2a1a2e;font-weight:700;border-color:transparent;
    box-shadow:0 4px 16px rgba(255,93,115,.35);
  }
  /* 开关 */
  .switch-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
  .switch-row span{font-size:.8rem}
  .switch{position:relative;width:42px;height:23px;flex:none;cursor:pointer}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;margin:0}
  .switch .pill{position:absolute;inset:0;border-radius:999px;background:var(--overlay);border:1px solid var(--line);transition:background .25s ease}
  .switch .pill::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#cfc3e8;transition:transform .25s ease,background .25s ease}
  .switch input:checked + .pill{background:linear-gradient(90deg,var(--teal),#4fe0d2)}
  .switch input:checked + .pill::after{transform:translateX(19px);background:#fff}
  /* 按钮 */
  .btn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .btn{
    padding:9px 6px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);
    color:var(--text);font-size:.78rem;cursor:pointer;font-family:inherit;transition:all .18s ease;
  }
  .btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.3);box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(135deg,var(--coral),#ff8a5c);border-color:transparent;font-weight:700;color:#fff;box-shadow:0 4px 16px rgba(255,93,115,.35)}
  .btn.primary.paused{background:linear-gradient(135deg,var(--teal),#4fe0d2);color:#0c2b28}
  .btn.accent{border-color:rgba(46,196,182,.5);color:var(--teal)}
  .btn.wide{grid-column:span 3}
  footer{max-width:1460px;margin:0 auto;padding:14px 26px 26px;color:var(--muted);font-size:.72rem;display:flex;gap:18px;flex-wrap:wrap;animation:fadeUp .7s .3s ease both}
  footer kbd{background:var(--surface2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 7px;font-family:inherit;font-size:.7rem;color:var(--text)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @media (max-width:1020px){
    main{grid-template-columns:1fr}
    aside{position:static;max-height:none}
    .head-chips{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .aurora,header,.stage-card,aside,footer,.ctl{animation:none}
  }
</style>
</head>
<body>
<div class="aurora"></div>

<header>
  <div class="logo">
    <div class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="7" cy="16" r="4" stroke="#2a1a2e" stroke-width="2"/><circle cx="17" cy="16" r="4" stroke="#2a1a2e" stroke-width="2"/><path d="M7 16 L11 9 L15 16 M11 9 L9 7 M15 16 L17 8 L14 8" stroke="#2a1a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17" cy="5" r="2.4" fill="#2a1a2e"/></svg>
    </div>
    <div>
      <h1>鹈鹕快递</h1>
      <div class="tagline">Pelican Express · SVG 2D Animation</div>
    </div>
  </div>
  <div class="head-chips">
    <span class="chip">纯 <b>SVG</b> 手绘</span>
    <span class="chip"><b>单文件</b> · 零依赖</span>
    <span class="chip">实时 <b>参数化</b> 驱动</span>
  </div>
</header>

<main>
  <!-- ================= 舞台 ================= -->

            <stop id="sand0" offset="0" stop-color="#eec49a"/>

          <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
            <stop id="road0" offset="0" stop-color="#b07a4a"/>
            <stop id="road1" offset="1" stop-color="#96603a"/>

            <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="vignetteGrad" cx="0.5" cy="0.46" r="0.75">
            <stop offset="0.62" stop-color="#140a1e" stop-opacity="0"/>
            <stop offset="1" stop-color="#140a1e" stop-opacity="0.3"/>
          </radialGradient>
          <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
          <filter id="lampBlur" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="5"/></filter>
          <pattern id="gridPat" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>

          </g>

          <g id="roadTile">
            <rect id="roadLine" x="20" y="540" width="70" height="5" rx="2.5" fill="#ffe9c9" opacity="0.85"/>

          <g id="grassTile">

        </defs>

        <g id="scene">
          <rect x="0" y="0" width="1200" height="675" fill="url(#skyGrad)"/>
          <g id="starsG" opacity="0.25"></g>
          <circle id="sunHalo" cx="930" cy="238" r="98" fill="#ffcf6e" opacity="0.22"/>
          <circle id="sun" cx="930" cy="238" r="54" fill="url(#sunGrad)"/>

            <circle cx="930" cy="130" r="30" fill="#f5f3ce"/>
            <circle id="moonShadow" cx="943" cy="121" r="26" fill="#0b1030"/>
            <circle cx="919" cy="140" r="4" fill="#000000" opacity="0.1"/>
            <circle cx="915" cy="125" r="2.8" fill="#000000" opacity="0.1"/>
          </g>
          <g id="birdsG" stroke="#3a2c4e" stroke-width="2.4" fill="none" stroke-linecap="round">
            <path id="bird0" d="M -9 0 Q -4.5 -6 0 0 Q 4.5 -6 9 0"/>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var SVGNS = "http://www.w3.org/2000/svg";

  var DEFAULTS = { speed:18, gear:0.42, wheelR:70, bounce:5, wind:4, density:55, zoom:1, theme:"dusk", lamp:true, grid:false };
  var state = Object.assign({}, DEFAULTS);
  var paused = false;
  var t = 0, dist = 0, teleAcc = 0;

  var THEMES = {
    day:{ sky:["#6fd3f2","#aee8fa","#e8fbff"], sea:["#79ded4","#18a3ab"], sand:["#f7dfae","#eccf9a"], road:["#dda662","#c98d4e"],
      sun:"#ffd166", sunPos:[960,110,34], sunShow:true, moonShow:false, stars:0, cloud:"#ffffff", cloudOp:0.95,
      hillF:"#a9d9ba", hillN:"#7cc08f", trunk:"#8d5a3b", leaf:"#2f9e63", grass:"#3e8e5a", band:"#2f7a4e", line:"#fff7e6",
      tint:0, lhBeam:0, beam:0, dust:"#e8cf9f", glow:"rgba(46,196,182,.35)", bird:"#3a6a72" },
    dusk:{ sky:["#472a63","#c95d6f","#ffb36b"], sea:["#f0a868","#2b6f7f"], sand:["#eec49a","#d9a877"], road:["#b07a4a","#96603a"],
      sun:"#ffcf6e", sunPos:[930,238,54], sunShow:true, moonShow:false, stars:0.25, cloud:"#ffd9c2", cloudOp:0.9,
      hillF:"#6c5a86", hillN:"#4f4668", trunk:"#6f4630", leaf:"#2c7a5b", grass:"#2f6e52", band:"#245844", line:"#ffe9c9",
      tint:0.05, lhBeam:0.12, beam:0.18, dust:"#e0b183", glow:"rgba(255,93,115,.4)", bird:"#3a2c4e" },
    night:{ sky:["#0b1030","#1b2450","#2c3a6e"], sea:["#24406b","#0e1e38"], sand:["#6f7ba0","#5a6488"], road:["#4a5578","#3a4262"],
      sun:"#f5f3ce", sunPos:[930,130,30], sunShow:false, moonShow:true, stars:1, cloud:"#3c4a7a", cloudOp:0.7,
      hillF:"#232c52", hillN:"#1a2140", trunk:"#3a3352", leaf:"#23564a", grass:"#1f3c4a", band:"#162c38", line:"#cfd8ff",
      tint:0.16, lhBeam:0.3, beam:0.42, dust:"#8b96bd", glow:"rgba(99,116,255,.4)", bird:"#8b96bd" }
  };
  var theme = THEMES.dusk;

  /* ---------- 生成：辐条 / 星星 / 粒子 / 速度线 ---------- */
  function buildSpokes(g){
    for(var i=0;i<8;i++){
      var a = i*Math.PI/4;
      var ln = document.createElementNS(SVGNS,"line");
      ln.setAttribute("x1",0); ln.setAttribute("y1",0);
      ln.setAttribute("x2",(56*Math.cos(a)).toFixed(2));
      ln.setAttribute("y2",(56*Math.sin(a)).toFixed(2));
      g.appendChild(ln);
    }
    var valve = document.createElementNS(SVGNS,"circle");
    valve.setAttribute("cx",0); valve.setAttribute("cy",-50); valve.setAttribute("r",3);
    valve.setAttribute("fill","#ffd166"); valve.setAttribute("stroke","none");
    g.appendChild(valve);
  }
  buildSpokes($("spokesR")); buildSpokes($("spokesF"));

  var stars = [];
  (function(){
    var g = $("starsG");
    for(var i=0;i<30;i++){
      var c = document.createElementNS(SVGNS,"circle");
      var x = Math.random()*1200, y = Math.random()*330, r = 0.8+Math.random()*1.1;
      c.setAttribute("cx",x.toFixed(1)); c.setAttribute("cy",y.toFixed(1)); c.setAttribute("r",r.toFixed(2));
      c.setAttribute("fill","#ffffff");
      g.appendChild(c);
      stars.push({ el:c, ph:Math.random()*6.28, base:0.4+Math.random()*0.6 });
    }
  })();

  var dustPool = [];
  (function(){
    var g = $("dust");
    for(var i=0;i<80;i++){
      var c = document.createElementNS(SVGNS,"circle");
      c.setAttribute("r",3); c.setAttribute("opacity",0);
      g.appendChild(c);
      dustPool.push({ el:c, active:false, x:0, y:0, vx:0, vy:0, life:0, max:1, r0:3 });
    }
  })();
  var dustAcc = 0;

  var speedLines = [];
  (function(){
    var g = $("speedLines");
    for(var i=0;i<7;i++){
      var ln = document.createElementNS(SVGNS,"line");
      ln.setAttribute("opacity",0);
      g.appendChild(ln);
      speedLines.push({ el:ln, y:285+i*34, off:i*230 });
    }
  })();

  /* ---------- 主题 ---------- */
  function setStops(prefix, arr){
    for(var i=0;i<arr.length;i++) $(prefix+i).setAttribute("stop-color", arr[i]);
  }
  function applyTheme(name){
    state.theme = name; theme = THEMES[name];
    setStops("sky", theme.sky); setStops("sea", theme.sea);
    setStops("sand", theme.sand); setStops("road", theme.road);
    $("sunG1").setAttribute("stop-color", theme.sun);
    var sp = theme.sunPos;
    $("sun").setAttribute("cx",sp[0]); $("sun").setAttribute("cy",sp[1]); $("sun").setAttribute("r",sp[2]);
    $("sunHalo").setAttribute("cx",sp[0]); $("sunHalo").setAttribute("cy",sp[1]); $("sunHalo").setAttribute("r",sp[2]*1.8);
    $("sunHalo").setAttribute("fill", theme.sun);
    $("sun").setAttribute("visibility", theme.sunShow ? "visible" : "hidden");
    $("sunHalo").setAttribute("visibility", theme.sunShow ? "visible" : "hidden");
    $("moonG").setAttribute("visibility", theme.moonShow ? "visible" : "hidden");
    $("moonShadow").setAttribute("fill", theme.sky[0]);
    $("starsG").setAttribute("opacity", theme.stars);
    $("cloudsLayer").setAttribute("fill", theme.cloud);
    $("cloudsLayer").setAttribute("opacity", theme.cloudOp);
    $("hillFar").setAttribute("fill", theme.hillF);
    $("hillNear").setAttribute("fill", theme.hillN);
    $("palmTrunks").setAttribute("stroke", theme.trunk);
    ["pc0","pc1","pc2"].forEach(function(id){ $(id).setAttribute("fill", theme.leaf); });
    $("grassBand").setAttribute("fill", theme.band);
    $("grassTufts").setAttribute("fill", theme.grass);
    $("roadLine").setAttribute("fill", theme.line);
    $("nightTint").setAttribute("opacity", theme.tint);
    $("birdsG").setAttribute("stroke", theme.bird);
    document.documentElement.style.setProperty("--stage-glow", theme.glow);
    dustPool.forEach(function(p){ p.el.setAttribute("fill", theme.dust); });
    document.querySelectorAll(".seg button").forEach(function(b){
      b.classList.toggle("active", b.dataset.theme === name);
    });
  }

  /* ---------- 控件绑定 ---------- */
  var fmts = {
    speed:function(v){ return v.toFixed(0)+" km/h"; },
    gear:function(v){ return v.toFixed(2)+"×"; },
    wheelR:function(v){ return v.toFixed(0)+" px"; },
    bounce:function(v){ return v.toFixed(1)+" px"; },
    wind:function(v){ return v.toFixed(1)+" 级"; },
    density:function(v){ return v.toFixed(0)+"%"; },
    zoom:function(v){ return v.toFixed(2)+"×"; }
  };
  var ranges = [
    ["rSpeed","oSpeed","speed"], ["rGear","oGear","gear"], ["rWheel","oWheel","wheelR"],
    ["rBounce","oBounce","bounce"], ["rWind","oWind","wind"], ["rDensity","oDensity","density"], ["rZoom","oZoom","zoom"]
  ];
  function paintTrack(inp){
    var min = parseFloat(inp.min), max = parseFloat(inp.max), v = parseFloat(inp.value);
    var p = ((v-min)/(max-min))*100;
    inp.style.background = "linear-gradient(90deg,var(--teal) 0%,var(--coral) "+p+"%,rgba(255,255,255,.12) "+p+"%)";
  }
  ranges.forEach(function(cfg){
    var inp = $(cfg[0]), out = $(cfg[1]), key = cfg[2];
    inp.addEventListener("input", function(){
      state[key] = parseFloat(inp.value);
      out.textContent = fmts[key](state[key]);
      paintTrack(inp);
    });
  });
  function syncUI(){
    ranges.forEach(function(cfg){
      var inp = $(cfg[0]);
      inp.value = state[cfg[2]];
      $(cfg[1]).textContent = fmts[cfg[2]](state[cfg[2]]);
      paintTrack(inp);
    });
    $("cLamp").checked = state.lamp;
    $("cGrid").checked = state.grid;
    document.querySelectorAll(".seg button").forEach(function(b){
      b.classList.toggle("active", b.dataset.theme === state.theme);
    });
  }
  document.querySelectorAll(".seg button").forEach(function(b){
    b.addEventListener("click", function(){ applyTheme(b.dataset.theme); });
  });
  $("cLamp").addEventListener("change", function(){ state.lamp = this.checked; });
  $("cGrid").addEventListener("change", function(){ state.grid = this.checked; });

  function setPaused(p){
    paused = p;
    var btn = $("bPause");
    btn.textContent = p ? "继续" : "暂停";
    btn.classList.toggle("paused", p);
    btn.setAttribute("aria-pressed", String(p));
    $("pausedBadge").classList.toggle("show", p);
  }
  $("bPause").addEventListener("click", function(){ setPaused(!paused); });
  $("bReset").addEventListener("click", function(){
    state = Object.assign({}, DEFAULTS);
    applyTheme(state.theme); syncUI(); setPaused(false);
  });
  $("bRandom").addEventListener("click", function(){
    function rnd(a,b){ return a+Math.random()*(b-a); }
    state.speed = Math.round(rnd(6,36));
    state.gear = +rnd(0.25,0.7).toFixed(2);
    state.wheelR = Math.round(rnd(54,86));
    state.bounce = +rnd(2,10).toFixed(1);
    state.wind = +rnd(1,9).toFixed(1);
    state.density = Math.round(rnd(20,95));
    state.zoom = +rnd(0.85,1.25).toFixed(2);
    var names = ["day","dusk","night"];
    applyTheme(names[Math.floor(Math.random()*3)]);
    syncUI();
  });

  document.addEventListener("keydown", function(e){
    var tag = (e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select") return;
    if(e.code==="Space"){ e.preventDefault(); setPaused(!paused); }
    else if(e.key==="ArrowUp"||e.key==="ArrowDown"){
      e.preventDefault();
      state.speed = Math.max(0, Math.min(40, state.speed + (e.key==="ArrowUp"?2:-2)));
      $("rSpeed").value = state.speed;
      $("oSpeed").textContent = fmts.speed(state.speed);
      paintTrack($("rSpeed"));
    }
  });

  /* ---------- 导出 ---------- */
  function currentSvgText(){
    var clone = $("stage").cloneNode(true);
    clone.setAttribute("width","1200"); clone.setAttribute("height","675");
    clone.setAttribute("xmlns",SVGNS);
    clone.setAttribute("xmlns:xlink","http://www.w3.org/1999/xlink");
    return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
  }
  function download(blob, name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }
  $("bSvg").addEventListener("click", function(){
    download(new Blob([currentSvgText()],{type:"image/svg+xml;charset=utf-8"}), "pelican-express.svg");
  });
  $("bPng").addEventListener("click", function(){
    var btn = $("bPng"), old = btn.textContent;
    var blob = new Blob([currentSvgText()],{type:"image/svg+xml;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function(){
      var cv = document.createElement("canvas");
      cv.width = 2400; cv.height = 1350;
      cv.getContext("2d").drawImage(img,0,0,2400,1350);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){
        if(b){ download(b,"pelican-express.png"); btn.textContent = old; }
        else { btn.textContent = "导出失败"; setTimeout(function(){btn.textContent=old;},1500); }
      },"image/png");
    };
    img.onerror = function(){
      URL.revokeObjectURL(url);
      btn.textContent = "导出失败"; setTimeout(function(){btn.textContent=old;},1500);
    };
    img.src = url;
  });
  $("bCopy").addEventListener("click", function(){
    var btn = $("bCopy"), txt = currentSvgText();
    function done(ok){
      btn.textContent = ok ? "已复制" : "复制失败";
      setTimeout(function(){ btn.textContent = "复制 SVG"; }, 1500);
    }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){}
      ta.remove(); done(ok);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){done(true);}, fallback);
    } else fallback();
  });

  /* ---------- 腿部 IK ---------- */
  var L1 = 78, L2 = 88;
  function legD(hx,hy,px,py){
    var dx = px-hx, dy = py-hy;
    var d = Math.hypot(dx,dy);
    d = Math.max(Math.abs(L1-L2)+2, Math.min(L1+L2-2, d));
    var ang = Math.atan2(dy,dx);
    var cos = (L1*L1 + d*d - L2*L2)/(2*L1*d);
    cos = Math.max(-1, Math.min(1, cos));
    var off = Math.acos(cos);
    var kx = hx + L1*Math.cos(ang-off), ky = hy + L1*Math.sin(ang-off);
    return "M "+hx.toFixed(1)+" "+hy.toFixed(1)+" L "+kx.toFixed(1)+" "+ky.toFixed(1)+" L "+px.toFixed(1)+" "+py.toFixed(1);
  }

  /* ---------- 主循环 ---------- */
  var palmAnchors = [[104,408],[552,388],[940,416]];
  var last = performance.now();

  function frame(now){
    var dt = Math.min((now-last)/1000, 0.05);
    last = now;
    if(!paused){ t += dt; dist += state.speed*14*dt; }
    render(dt);
    requestAnimationFrame(frame);
  }

  function render(dt){
    var v = state.speed*14;
    var r = state.wheelR, s = r/70;
    var wheelDeg = (dist/r)*180/Math.PI;
    var crankDeg = wheelDeg*state.gear;
    var a = crankDeg*Math.PI/180;
    var wind = state.wind;

    /* 视差层 */
    $("cloudsLayer").setAttribute("transform","translate("+(-((t*(8+wind*6)+dist*0.1)%1200)).toFixed(1)+" 0)");
    $("hillsLayer").setAttribute("transform","translate("+(-(dist*0.22%1200)).toFixed(1)+" 0)");
    $("palmsLayer").setAttribute("transform","translate("+(-(dist*0.55%1200)).toFixed(1)+" 0)");
    $("roadMarks").setAttribute("transform","translate("+(-(dist%240)).toFixed(1)+" 0)");
    $("grassLayer").setAttribute("transform","translate("+(-(dist*1.25%600)).toFixed(1)+" 0)");
    $("wavesA").setAttribute("transform","translate("+(-((dist*0.35+t*20)%300)).toFixed(1)+" "+(1.5*Math.sin(t*1.4)).toFixed(2)+")");
    $("wavesB").setAttribute("transform","translate("+(-((dist*0.5+t*34)%300)).toFixed(1)+" "+(1.2*Math.sin(t*1.9+1)).toFixed(2)+")");

    /* 棕榈摇摆 / 灯塔 / 海鸟 / 星星 */
    for(var i=0;i<3;i++){
      var an = palmAnchors[i];
      $("pc"+i).setAttribute("transform","rotate("+(wind*0.8*Math.sin(t*1.3+i*1.7)).toFixed(2)+" "+an[0]+" "+an[1]+")");
    }
    $("lhBeam").setAttribute("transform","rotate("+((t*24)%360).toFixed(1)+" 182 337)");
    $("lhBeam").setAttribute("opacity",(theme.lhBeam*(0.7+0.3*Math.sin(t*2.2))).toFixed(3));
    for(var b=0;b<2;b++){
      var bx = 1250-((t*(26+b*8)+b*520)%1560);
      var by = 110+b*46+8*Math.sin(t*2+b*2);
      var flap = 0.55+0.45*Math.sin(t*9+b*2.4);
      $("bird"+b).setAttribute("transform","translate("+bx.toFixed(1)+" "+by.toFixed(1)+") scale(1 "+flap.toFixed(2)+")");
    }
    if(theme.stars>0){
      for(var si=0;si<stars.length;si++){
        var st = stars[si];
        st.el.setAttribute("opacity",(st.base*(0.55+0.45*Math.sin(t*2.4+st.ph))).toFixed(2));
      }
    }

    /* 车体姿态 */
    var bobB = state.bounce*0.5*Math.sin(2*a);
    var bobP = state.bounce*0.6*Math.sin(2*a-0.7);
    $("bikeRoot").setAttribute("transform","translate(0 "+(70-r).toFixed(1)+")");
    $("bikeBob").setAttribute("transform","translate(0 "+bobB.toFixed(2)+")");
    $("pelicanBob").setAttribute("transform","translate(0 "+bobP.toFixed(2)+")");
    $("wheelRScale").setAttribute("transform","scale("+s.toFixed(3)+")");
    $("wheelFScale").setAttribute("transform","scale("+s.toFixed(3)+")");
    $("spokesR").setAttribute("transform","rotate("+(wheelDeg%360).toFixed(1)+")");
    $("spokesF").setAttribute("transform","rotate("+(wheelDeg%360).toFixed(1)+")");
    $("shadow").setAttribute("rx",(152-bobB*2).toFixed(1));
    $("shadow").setAttribute("opacity",(0.2-bobB*0.006).toFixed(3));

    /* 曲柄与踏板 */
    var nearDeg = crankDeg%360, farDeg = (crankDeg+180)%360;
    $("crankNear").setAttribute("transform","translate(530 462) rotate("+nearDeg.toFixed(1)+")");
    $("pedalNear").setAttribute("transform","translate(38 0) rotate("+(-nearDeg).toFixed(1)+")");
    $("crankFar").setAttribute("transform","translate(530 462) rotate("+farDeg.toFixed(1)+")");
    $("pedalFar").setAttribute("transform","translate(38 0) rotate("+(-farDeg).toFixed(1)+")");

    /* 双腿 IK */
    var hipX = 502, hipY = 352+bobP;
    var pnx = 530+38*Math.cos(a), pny = 462+38*Math.sin(a);
    var pfx = 530-38*Math.cos(a), pfy = 462-38*Math.sin(a);
    $("legNear").setAttribute("d", legD(hipX,hipY,pnx,pny));
    $("legFar").setAttribute("d", legD(hipX,hipY+2,pfx,pfy));
    $("footNear").setAttribute("transform","translate("+pnx.toFixed(1)+" "+pny.toFixed(1)+") rotate("+(-6+4*Math.sin(a)).toFixed(1)+")");
    $("footFar").setAttribute("transform","translate("+pfx.toFixed(1)+" "+pfy.toFixed(1)+") rotate("+(-6+4*Math.sin(a+Math.PI)).toFixed(1)+")");

    /* 鹈鹕细节 */
    $("headG").setAttribute("transform","rotate("+(1.8*Math.sin(2*a-1)+wind*0.15*Math.sin(t*1.7)).toFixed(2)+" 580 206)");
    $("pouchG").setAttribute("transform","rotate("+(1.2*Math.sin(t*5)+wind*0.25*Math.sin(t*3.3)).toFixed(2)+" 597 210)");
    $("fishG").setAttribute("transform","rotate("+(10*Math.sin(t*4.2)).toFixed(1)+" 628 217)");
    $("wingNear").setAttribute("transform","rotate("+(1.6*Math.sin(2*a+0.5)+wind*0.25*Math.sin(t*2.1)).toFixed(2)+" 506 288)");
    $("wingFar").setAttribute("transform","rotate("+(1.1*Math.sin(2*a+1.5)+wind*0.2*Math.sin(t*2.4)).toFixed(2)+" 500 282)");
    $("tailG").setAttribute("transform","rotate("+(2.2*Math.sin(2*a+2)+wind*0.3*Math.sin(t*2.6)).toFixed(2)+" 450 300)");
    $("lid").setAttribute("opacity", (t%3.7)<0.13 ? "1" : "0");

    /* 围巾飘动 */
    var wAmp = 2+wind*1.1+state.speed*0.06;
    var wFrq = 5+state.speed*0.12;
    var w1 = wAmp*Math.sin(t*wFrq), w2 = wAmp*Math.sin(t*wFrq+1.2), w3 = wAmp*1.3*Math.sin(t*wFrq+2.4);
    $("scarfA").setAttribute("d",
      "M 556 240 C 534 "+(242+w1).toFixed(1)+" 514 "+(236+w2).toFixed(1)+" 492 "+(244+w3).toFixed(1)+
      " L 488 "+(252+w3).toFixed(1)+" C 512 "+(246+w2).toFixed(1)+" 534 "+(252+w1).toFixed(1)+" 558 248 Z");
    $("scarfB").setAttribute("d",
      "M 556 244 C 538 "+(250+w2).toFixed(1)+" 522 "+(246+w3).toFixed(1)+" 504 "+(256+w1).toFixed(1)+
      " L 501 "+(262+w1).toFixed(1)+" C 522 "+(254+w3).toFixed(1)+" 540 "+(258+w2).toFixed(1)+" 558 252 Z");

    /* 尘土粒子 */
    if(!paused){
      dustAcc += dt*(state.speed/40)*(state.density/100)*46;
      while(dustAcc>=1){
        dustAcc -= 1;
        for(var di=0;di<dustPool.length;di++){
          var p = dustPool[di];
          if(!p.active){
            p.active = true;
            p.x = 430-r*0.3+Math.random()*22;
            p.y = 516+Math.random()*7;
            p.vx = -(50+state.speed*4)-Math.random()*40;
            p.vy = -(8+Math.random()*26);
            p.max = 0.5+Math.random()*0.45;
            p.life = p.max;
            p.r0 = 2+Math.random()*3;
            break;
          }
        }
      }
      for(var dj=0;dj<dustPool.length;dj++){
        var q = dustPool[dj];
        if(!q.active) continue;
        q.life -= dt;
        if(q.life<=0){ q.active=false; q.el.setAttribute("opacity",0); continue; }
        q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 14*dt;
        var k = q.life/q.max;
        q.el.setAttribute("cx",q.x.toFixed(1));
        q.el.setAttribute("cy",q.y.toFixed(1));
        q.el.setAttribute("r",(q.r0*(1.6-k*0.6)).toFixed(2));
        q.el.setAttribute("opacity",(k*0.5).toFixed(2));
      }
    }

    /* 速度线 */
    var slOp = Math.max(0,(state.speed-22)/18)*0.5;
    for(var li=0;li<speedLines.length;li++){
      var sl = speedLines[li];
      var lx = 1250-((dist*1.5+sl.off)%1450);
      var len = 50+state.speed*3;
      sl.el.setAttribute("x1",lx.toFixed(1)); sl.el.setAttribute("x2",(lx+len).toFixed(1));
      sl.el.setAttribute("y1",sl.y); sl.el.setAttribute("y2",sl.y);
      sl.el.setAttribute("opacity",slOp.toFixed(2));
    }

    /* 镜头 / 网格 / 车灯 */
    $("scene").setAttribute("transform","translate(560 440) scale("+state.zoom.toFixed(3)+") translate(-560 -440)");
    $("gridOverlay").setAttribute("opacity", state.grid ? "0.25" : "0");
    var beamOp = state.lamp ? theme.beam : 0;
    $("beam").setAttribute("opacity",beamOp.toFixed(2));
    $("lampGlow").setAttribute("opacity",(beamOp*0.9).toFixed(2));

    /* 遥测 */
    teleAcc += dt;
    if(teleAcc>0.12){
      teleAcc = 0;
      var wheelRpm = v/(2*Math.PI*r)*60;
      $("tSpeed").textContent = state.speed.toFixed(0);
      $("tWheel").textContent = wheelRpm.toFixed(0);
      $("tCadence").textContent = (wheelRpm*state.gear).toFixed(0);
      $("tDist").textContent = (dist/100).toFixed(1);
    }
  }

  /* ---------- 启动 ---------- */
  applyTheme(state.theme);
  syncUI();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
