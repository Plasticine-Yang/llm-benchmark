<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#81d7e8">
  <meta name="description" content="一只卡通鹈鹕骑着自行车穿过明亮的海滨公路。">
  <title>鹈鹕的海风单车</title>
  <style>
    :root {
      color-scheme: light;
      --sky-top: #70cee7;
      --sky-bottom: #d8f4ed;
      --ink: #183d4b;
      --cream: #fff9dc;
      --feather: #fffdf1;
      --pouch: #f8c75d;
      --pouch-shadow: #eda446;
      --coral: #ef6f61;
      --sea: #4cbac6;
      --sea-light: #9be0d8;
      --road: #536b70;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      overflow: hidden;
      background: #173b4a;
      font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
    }

    .scene {
      display: block;
      width: 100vw;
      height: 100svh;
      background: linear-gradient(var(--sky-top), var(--sky-bottom));
    }

    .clouds { animation: driftClouds 26s linear infinite; }
    .islands { animation: driftIslands 18s linear infinite; }
    .shore { animation: driftShore 10s linear infinite; }
    .road-details { animation: roadRush 1.15s linear infinite; }
    .wheel-spin { animation: wheelTurn 0.82s linear infinite; transform-origin: center; }
    .crank-spin { animation: wheelTurn 0.82s linear infinite; transform-origin: 635px 535px; }
    .rider { animation: riderBounce 0.41s ease-in-out infinite alternate; }
    .front-thigh { animation: frontThigh 0.82s ease-in-out infinite; transform-origin: 608px 351px; }
    .front-calf { animation: frontCalf 0.82s ease-in-out infinite; transform-origin: 624px 428px; }
    .back-thigh { animation: backThigh 0.82s ease-in-out infinite; transform-origin: 608px 351px; }
    .back-calf { animation: backCalf 0.82s ease-in-out infinite; transform-origin: 584px 424px; }
    .scarf-tail { animation: scarfFlutter 0.7s ease-in-out infinite alternate; transform-origin: 532px 284px; }
    .wing { animation: wingSway 0.82s ease-in-out infinite; transform-origin: 610px 292px; }
    .crest { animation: crestFlutter 0.56s ease-in-out infinite alternate; transform-origin: 641px 191px; }
    .eye-glint { animation: blink 4.6s ease-in-out infinite; transform-origin: center; }
    .water-lines { animation: waterFlow 3s linear infinite; }

    @keyframes driftClouds {
      to { transform: translateX(-1200px); }
    }

    @keyframes driftIslands {
      to { transform: translateX(-1200px); }
    }

    @keyframes driftShore {
      to { transform: translateX(-600px); }
    }

    @keyframes roadRush {
      to { transform: translateX(-300px); }
    }

    @keyframes waterFlow {
      to { stroke-dashoffset: 120px; }
    }

    @keyframes wheelTurn {
      to { transform: rotate(360deg); }
    }

    @keyframes riderBounce {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    @keyframes frontThigh {
      0%, 100% { transform: rotate(18deg); }
      25% { transform: rotate(-8deg); }
      50% { transform: rotate(-28deg); }
      75% { transform: rotate(-2deg); }
    }

    @keyframes frontCalf {
      0%, 100% { transform: rotate(-15deg); }
      25% { transform: rotate(20deg); }
      50% { transform: rotate(36deg); }
      75% { transform: rotate(8deg); }
    }

    @keyframes backThigh {
      0%, 100% { transform: rotate(-28deg); }
      25% { transform: rotate(-2deg); }
      50% { transform: rotate(18deg); }
      75% { transform: rotate(-8deg); }
    }

    @keyframes backCalf {
      0%, 100% { transform: rotate(36deg); }
      25% { transform: rotate(8deg); }
      50% { transform: rotate(-15deg); }
      75% { transform: rotate(20deg); }
    }

    @keyframes scarfFlutter {
      from { transform: rotate(3deg) scaleY(0.98); }
      to { transform: rotate(-7deg) scaleY(1.03); }
    }

    @keyframes wingSway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(6deg); }
    }

    @keyframes crestFlutter {
      from { transform: rotate(-3deg); }
      to { transform: rotate(8deg); }
    }

    @keyframes blink {
      0%, 43%, 47%, 100% { transform: scaleY(1); }
      45% { transform: scaleY(0.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene * { animation-play-state: paused !important; }
    }
  </style>
</head>
<body>

</body>
