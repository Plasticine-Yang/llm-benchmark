<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pelican Pedal Club</title>
  <style>
    :root {
      --ink: #17374c;
      --paper: #f7f3e8;
      --coral: #f16f55;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #d9e5dd;
      color: var(--ink);
      font-family: "Trebuchet MS", "Avenir Next", Avenir, sans-serif;
    }

    .poster {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 520px;
      overflow: hidden;
      background: var(--paper);
      isolation: isolate;
    }

    svg { display: block; width: 100%; height: 100%; }

    .title {
      position: absolute;
      z-index: 3;
      top: clamp(24px, 4vw, 62px);
      left: clamp(24px, 5vw, 80px);
      pointer-events: none;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--coral);
      font-size: clamp(10px, .9vw, 14px);
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 35px;
      height: 3px;
      content: "";
      background: currentColor;
      border-radius: 99px;
    }

    h1 {
      max-width: 430px;
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 6.6vw, 104px);
      font-weight: 700;
      line-height: .82;
      letter-spacing: -.06em;
    }

    h1 span {
      display: block;
      margin-left: .66em;
      color: var(--coral);
      font-style: italic;
      font-weight: 400;
    }

    .status {
      position: absolute;
      z-index: 4;
      right: clamp(22px, 4vw, 62px);
      bottom: clamp(20px, 3vw, 46px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 15px;
      border: 1px solid rgba(247, 243, 232, .35);
      border-radius: 999px;
      background: rgba(23, 55, 76, .88);
      box-shadow: 0 8px 24px rgba(23, 55, 76, .16);
      color: #fffaf0;
      font-size: clamp(10px, .9vw, 13px);
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f8d65e;
      box-shadow: 0 0 0 0 rgba(248, 214, 94, .7);
      animation: ping 2s ease-out infinite;
    }

    .cloud-a { animation: cloud-drift-a 24s linear infinite; }
    .cloud-b { animation: cloud-drift-b 34s linear infinite; }
    .far-coast { animation: coast-drift 18s linear infinite; }
    .near-grass { animation: grass-drift 3.2s linear infinite; }
    .road-dashes { animation: road-drift .95s linear infinite; }
    .wind-line { animation: wind 2.2s ease-in-out infinite; }
    .wind-line:nth-child(2) { animation-delay: -.7s; }
    .wind-line:nth-child(3) { animation-delay: -1.4s; }
    .pelican { animation: ride-bob .72s ease-in-out infinite alternate; }
    .tail { transform-origin: 580px 433px; animation: tail-flick 1.1s ease-in-out infinite alternate; }
    .crest { transform-origin: 829px 257px; animation: crest 1.4s ease-in-out infinite alternate; }
    .wing-tip { transform-origin: 688px 434px; animation: wing 1.2s ease-in-out infinite alternate; }
    .blink { transform-origin: 856px 299px; animation: blink 4.2s ease-in-out infinite; }
    .wheel-spin, .pedal-spin { transform-box: fill-box; transform-origin: center; animation: spin .82s linear infinite; }
    .pedal-spin { animation-duration: 1s; }
    .shadow { transform-origin: center; animation: shadow-pulse .72s ease-in-out infinite alternate; }
    .badge-wheel { transform-origin: 1320px 107px; animation: spin 10s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ride-bob { to { transform: translateY(-6px) rotate(-.25deg); } }
    @keyframes tail-flick { to { transform: rotate(-5deg); } }
    @keyframes crest { to { transform: rotate(7deg); } }
    @keyframes wing { to { transform: rotate(-3deg) translateY(-2px); } }
    @keyframes blink { 0%, 44%, 49%, 100% { transform: scaleY(1); } 46%, 47% { transform: scaleY(.08); } }
    @keyframes shadow-pulse { to { transform: scaleX(.96); opacity: .18; } }
    @keyframes cloud-drift-a { to { transform: translateX(190px); } }
    @keyframes cloud-drift-b { to { transform: translateX(-230px); } }
    @keyframes coast-drift { to { transform: translateX(-205px); } }
    @keyframes grass-drift { to { transform: translateX(-280px); } }
    @keyframes road-drift { to { transform: translateX(-250px); } }
    @keyframes wind { 0%, 100% { opacity: 0; transform: translateX(30px); } 30%, 70% { opacity: .55; } 80% { transform: translateX(-80px); } }
    @keyframes ping { 70%, 100% { box-shadow: 0 0 0 8px rgba(248, 214, 94, 0); } }

    @media (max-aspect-ratio: 4/3) {
      .title { top: 28px; }
      h1 { font-size: clamp(40px, 10vw, 78px); }
      svg { width: 130%; margin-left: -22%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-play-state: paused !important; }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="一只鹈鹕骑着自行车穿过海岸公路的动画插画">
    <header class="title">
      <div class="eyebrow">Coastline Dispatch · No. 08</div>
      <h1>Pelican<span>Pedal Club</span></h1>
    </header>

    <div class="status"><span class="status-dot"></span> cruising · 18 km/h</div>

    <svg viewBox="0 0 1440 900" role="img" aria-labelledby="svg-title svg-desc" preserveAspectRatio="xMidYMid slice">
      <title id="svg-title">鹈鹕骑自行车</title>
      <desc id="svg-desc">一只戴着骑行帽的鹈鹕沿着海边公路骑自行车，车轮、脚踏、云层和道路都在运动。</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f7f1df" />
          <stop offset=".58" stop-color="#cae6df" />
          <stop offset="1" stop-color="#77c3c2" />
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#66c7c2" />
          <stop offset="1" stop-color="#278f91" />
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#42616b" />
          <stop offset="1" stop-color="#17374c" />
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd361" />
          <stop offset="1" stop-color="#ef784f" />
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#ffd268" stop-opacity=".72" />
          <stop offset="1" stop-color="#ffd268" stop-opacity="0" />
        </radialGradient>
        <filter id="soft-shadow" x="-30%" y="-50%" width="160%" height="200%">
          <feGaussianBlur stdDeviation="9" />
        </filter>
        <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7" result="noise" />
          <feColorMatrix in="noise" type="saturate" values="0" result="gray" />
          <feComponentTransfer in="gray" result="fade">
            <feFuncA type="table" tableValues="0 .055" />
          </feComponentTransfer>
          <feBlend in="SourceGraphic" in2="fade" mode="multiply" />
        </filter>
        <clipPath id="scene-clip"><rect width="1440" height="900" /></clipPath>
      </defs>

      <g clip-path="url(#scene-clip)">
        <!-- Sky -->
        <rect width="1440" height="900" fill="url(#sky)" />
        <circle cx="1130" cy="196" r="185" fill="url(#sunGlow)" />
        <circle cx="1130" cy="196" r="72" fill="#ffd164" />
        <path d="M1079 196h102M1130 145v102" stroke="#ffe59a" stroke-width="2" opacity=".5" />

        <!-- clouds -->
        <g class="cloud-a" fill="#fffaf0" opacity=".74">
          <path d="M795 159c13-23 50-22 61 3 10-10 34-7 39 12H761c5-17 20-22 34-15Z" />
          <path d="M52 295c14-27 57-28 73 0 19-14 50-4 54 21H10c4-23 25-31 42-21Z" opacity=".62" />
        </g>
        <g class="cloud-b" fill="none" stroke="#fffaf0" stroke-linecap="round" stroke-width="5" opacity=".56">
          <path d="M1206 338h121c-6-19-29-26-45-14-10-27-53-27-65 0" />
          <path d="M331 187h82c-5-14-23-20-34-10-10-20-39-17-45 3" />
        </g>

        <!-- graphic badge -->
        <g transform="translate(0 8)" opacity=".9">
          <circle cx="1320" cy="107" r="43" fill="none" stroke="#17374c" stroke-width="1.5" opacity=".35" />
          <g class="badge-wheel" fill="#17374c">
            <path d="M1317 58h6v16h-6zM1317 140h6v16h-6zM1271 104h16v6h-16zM1353 104h16v6h-16z" opacity=".65" />
            <path d="m1287 70 4-4 11 11-4 4zm55 55 4-4 11 11-4 4zm4-59 11 11-4 4-11-11zm-55 55 11 11-4 4-11-11z" opacity=".65" />
          </g>
          <circle cx="1320" cy="107" r="5" fill="#f16f55" />
          <text x="1320" y="181" fill="#17374c" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="3">RIDE · TIDE</text>
        </g>

        <!-- sea and horizon -->
        <path d="M0 445Q260 422 482 446t443-2q267-32 515 1v230H0Z" fill="url(#sea)" />
        <path d="M0 466c170-16 295 13 466-2s330-6 470 4 316-15 504-6" fill="none" stroke="#d8f0e7" stroke-width="4" opacity=".45" />
        <path d="M868 515q80-21 169 1t184-4" fill="none" stroke="#d8f0e7" stroke-width="5" stroke-linecap="round" opacity=".5" />
        <path d="M1044 554q48-12 104 1" fill="none" stroke="#d8f0e7" stroke-width="3" stroke-linecap="round" opacity=".45" />

        <!-- parallax distant coast -->
        <g class="far-coast" fill="#417e79" opacity=".9">
          <path d="M-205 499c55-26 84-24 139-9 61 17 100-17 154-15 48 2 82 41 130 36 54-6 95-32 153-11l40 91h-616Z" />
          <path d="M0 499c55-26 84-24 139-9 61 17 100-17 154-15 48 2 82 41 130 36 54-6 95-32 153-11l40 91H0Z" />
          <path d="M576 499c55-26 84-24 139-9 61 17 100-17 154-15 48 2 82 41 130 36 54-6 95-32 153-11l40 91H576Z" />
          <path d="M1152 499c55-26 84-24 139-9 61 17 100-17 154-15 48 2 82 41 130 36 54-6 95-32 153-11l40 91h-616Z" />
          <path d="M1728 499c55-26 84-24 139-9 61 17 100-17 154-15 48 2 82 41 130 36 54-6 95-32 153-11l40 91h-616Z" />
        </g>

        <!-- verge and road -->
        <path d="M0 586c218-22 418 8 640-5 294-17 531-7 800 9v84H0Z" fill="#d5c864" />
        <path d="M0 642c304-24 486 13 742-6 236-17 450-18 698 4v260H0Z" fill="url(#road)" />
        <path d="M0 665c342-27 676 19 1017-7 179-14 290-12 423-3" fill="none" stroke="#f5eed8" stroke-width="8" opacity=".94" />
        <g class="road-dashes" fill="#f8d866" opacity=".96">
          <rect x="-240" y="804" width="120" height="10" rx="5" />
          <rect x="10" y="804" width="120" height="10" rx="5" />
          <rect x="260" y="804" width="120" height="10" rx="5" />
          <rect x="510" y="804" width="120" height="10" rx="5" />
          <rect x="760" y="804" width="120" height="10" rx="5" />
          <rect x="1010" y="804" width="120" height="10" rx="5" />
          <rect x="1260" y="804" width="120" height="10" rx="5" />
          <rect x="1510" y="804" width="120" height="10" rx="5" />
        </g>

        <!-- speed lines -->
        <g fill="none" stroke="#f7f3e8" stroke-linecap="round" stroke-width="5" opacity=".5">
          <path class="wind-line" d="M344 488h105" />
          <path class="wind-line" d="M394 526h73" />
          <path class="wind-line" d="M307 566h119" />
        </g>

        <!-- bicycle ground shadow -->
        <ellipse class="shadow" cx="750" cy="765" rx="322" ry="26" fill="#091f2b" opacity=".22" filter="url(#soft-shadow)" />

        <!-- rear wheel -->
        <g transform="translate(505 647)">
          <g class="wheel-spin">
            <circle r="121" fill="#fff" fill-opacity=".05" stroke="#112d3d" stroke-width="13" />
            <circle r="108" fill="none" stroke="#f7f3e8" stroke-width="3" />
            <g stroke="#d4e4df" stroke-width="2" opacity=".8">
              <path d="M0-107V107M-107 0H107M-76-76 76 76M76-76-76 76" />
              <path d="M-41-99 41 99M41-99-41 99M-99-41 99 41M99-41-99 41" />
            </g>
            <circle r="14" fill="#f16f55" stroke="#f8eedd" stroke-width="4" />
          </g>
        </g>

        <!-- front wheel -->
        <g transform="translate(969 647)">
          <g class="wheel-spin">
            <circle r="121" fill="#fff" fill-opacity=".05" stroke="#112d3d" stroke-width="13" />
            <circle r="108" fill="none" stroke="#f7f3e8" stroke-width="3" />
            <g stroke="#d4e4df" stroke-width="2" opacity=".8">
              <path d="M0-107V107M-107 0H107M-76-76 76 76M76-76-76 76" />
              <path d="M-41-99 41 99M41-99-41 99M-99-41 99 41M99-41-99 41" />
            </g>
            <circle r="14" fill="#f16f55" stroke="#f8eedd" stroke-width="4" />
          </g>
        </g>

        <!-- bicycle frame -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M505 647 631 487 739 647Zm126-160h205L739 647" stroke="#f16f55" stroke-width="18" />
          <path d="M836 487 969 647" stroke="#f16f55" stroke-width="15" />
          <path d="M820 493 859 421 907 416" stroke="#17374c" stroke-width="13" />
          <path d="M884 406h42" stroke="#17374c" stroke-width="12" />
          <path d="M619 487 600 441" stroke="#17374c" stroke-width="13" />
          <path d="M570 437h72" stroke="#17374c" stroke-width="15" />
          <circle cx="739" cy="647" r="29" fill="#f8d65e" stroke="#17374c" stroke-width="8" />
        </g>

        <!-- pelican rider -->
        <g class="pelican">
          <!-- tail -->
          <g class="tail">
            <path d="M610 414c-45-19-84-15-123 4 38 5 62 18 84 43 16-9 31-25 39-47Z" fill="#f7f3e8" stroke="#17374c" stroke-width="5" />
            <path d="M575 424c-36-2-57 4-78 15" fill="none" stroke="#9cb8b4" stroke-width="4" stroke-linecap="round" />
          </g>

          <!-- body -->
          <path d="M565 396c45-42 126-48 192-19 45 19 78 59 66 100-13 48-76 63-146 53-67-9-121-43-132-83-5-19 2-36 20-51Z" fill="#f7f3e8" stroke="#17374c" stroke-width="6" />
          <path d="M584 484c53 31 135 43 202 17-32 37-159 44-202-17Z" fill="#dce5df" opacity=".8" />

          <!-- neck and head -->
          <path d="M746 453c23-37 35-74 40-109 6-46 5-82 43-98 35-15 76 8 82 44 5 29-14 46-33 66-25 26-21 71 3 113l-80 32c-18-18-41-27-72-29Z" fill="#f7f3e8" stroke="#17374c" stroke-width="6" />
          <path d="M799 375c17-8 39-7 57 3-17 19-21 45-10 73" fill="none" stroke="#d5e1db" stroke-width="12" stroke-linecap="round" />

          <!-- crest and cap -->
          <g class="crest" fill="#f7f3e8" stroke="#17374c" stroke-width="5" stroke-linejoin="round">
            <path d="M818 257c-20-31-1-54 20-22 3-35 30-40 28-4 18-23 40-8 20 18Z" />
          </g>
          <path d="M807 267c17-37 73-44 101-8l-8 20c-27-14-61-13-89 3Z" fill="#f16f55" stroke="#17374c" stroke-width="6" />
          <path d="M899 274c25-2 39 4 51 17-23-7-38-5-53 2Z" fill="#f8d65e" stroke="#17374c" stroke-width="5" />

          <!-- beak and pouch -->
          <path d="M875 294c60-8 132 10 194 39-65 2-130 2-194-5Z" fill="#f8d65e" stroke="#17374c" stroke-width="6" stroke-linejoin="round" />
          <path d="M876 326c58 8 132 7 193 7-48 22-111 48-164 34-20-6-30-20-29-41Z" fill="url(#beak)" stroke="#17374c" stroke-width="6" stroke-linejoin="round" />
          <path d="M909 344c42 4 91 1 128-5-39 15-83 28-117 20" fill="none" stroke="#d76049" stroke-width="4" stroke-linecap="round" opacity=".75" />

          <!-- face -->
          <circle cx="856" cy="299" r="14" fill="#fff" stroke="#17374c" stroke-width="4" />
          <g class="blink">
            <circle cx="859" cy="300" r="6.5" fill="#17374c" />
            <circle cx="862" cy="297" r="2" fill="#fff" />
          </g>

          <!-- wing -->
          <path d="M616 400c36-30 104-24 140 24 20 27 49 50 95 52 9 1 12 15 3 20-40 22-89 4-122-25-22 27-76 41-117 13-27-18-25-62 1-84Z" fill="#e6e8dd" stroke="#17374c" stroke-width="6" />
          <g class="wing-tip">
            <path d="M713 454c36 18 81 32 135 24" fill="none" stroke="#9eb5b0" stroke-width="5" stroke-linecap="round" />
            <path d="M688 430c19 24 29 45 31 66M666 430c7 25 10 46 6 65" fill="none" stroke="#bccbc5" stroke-width="4" stroke-linecap="round" />
          </g>

          <!-- animated legs -->
          <path d="M657 502Q671 555 703 585T754 632" fill="none" stroke="#efa34f" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
            <animate attributeName="d" dur="1s" repeatCount="indefinite"
              values="M657 502Q671 555 703 585T754 632; M657 502Q690 544 733 560T774 603; M657 502Q671 555 703 585T754 632; M657 502Q643 544 650 590T700 663; M657 502Q671 555 703 585T754 632" />
          </path>
          <path d="M704 510Q743 544 748 587T704 663" fill="none" stroke="#d9813f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
            <animate attributeName="d" dur="1s" repeatCount="indefinite"
              values="M704 510Q743 544 748 587T704 663; M704 510Q721 551 695 599T679 637; M704 510Q743 544 748 587T704 663; M704 510Q763 532 781 567T774 603; M704 510Q743 544 748 587T704 663" />
          </path>
        </g>

        <!-- crank and pedals -->
        <g transform="translate(739 647)">
          <g class="pedal-spin">
            <path d="M-48 0h96" fill="none" stroke="#17374c" stroke-width="8" stroke-linecap="round" />
            <circle cx="-48" cy="0" r="7" fill="#f7f3e8" stroke="#17374c" stroke-width="4" />
            <circle cx="48" cy="0" r="7" fill="#f7f3e8" stroke="#17374c" stroke-width="4" />
            <path d="M-63 2h31M33 2h31" stroke="#f8d65e" stroke-width="8" stroke-linecap="round" />
          </g>
          <circle r="9" fill="#17374c" />
        </g>

        <!-- foreground moving grasses -->
        <g class="near-grass" fill="none" stroke="#f7e27a" stroke-linecap="round" stroke-width="5" opacity=".72">
          <path d="M-180 665q10-45 35-70M-170 629q-20-30-37-33M100 666q8-49 37-78M117 632q-19-28-38-31M386 665q5-37 30-63M402 635q-17-24-34-28M1270 664q8-50 38-77M1288 629q-19-28-38-31M1545 664q8-50 38-77" />
        </g>

        <!-- subtle print grain -->
        <rect width="1440" height="900" fill="transparent" filter="url(#paper-grain)" pointer-events="none" />
      </g>
    </svg>
  </main>
</body>
</html>
