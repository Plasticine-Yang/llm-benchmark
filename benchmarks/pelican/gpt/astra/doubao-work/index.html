<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9eceb">
  <title>骑到海风里 · 鹈鹕的单车漫游</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23d9eceb'/%3E%3Cpath d='M15 47Q7 29 28 26V17Q28 6 39 10Q47 13 43 23L60 29L42 35Q36 57 15 47' fill='%23fffdf4' stroke='%232c5659' stroke-width='2'/%3E%3Cpath d='M41 23L60 29L41 35Z' fill='%23efa843'/%3E%3Ccircle cx='38' cy='19' r='2' fill='%232c5659'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;--sky:#d9eceb;--ink:#244e52;--muted:#587779;--paper:#fffdf4;--accent:#e78a48}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--sky)}
    body{font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
    .film{position:relative;min-height:760px;height:100svh;overflow:hidden;isolation:isolate}
    .masthead{position:absolute;z-index:2;top:clamp(26px,5.8vh,66px);left:clamp(24px,6vw,100px);pointer-events:none}
    .masthead p{font-size:12px;letter-spacing:.12em;margin:0 0 13px;color:var(--muted)}
    h1{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-weight:600;font-size:clamp(28px,3.3vw,46px);letter-spacing:.09em;line-height:1.35;margin:0}
    .subtitle{font-size:13px!important;letter-spacing:.06em!important;margin:15px 0 0!important}
    .edition{position:absolute;right:clamp(24px,6vw,100px);top:clamp(30px,6vh,68px);z-index:2;font-size:11px;writing-mode:vertical-rl;letter-spacing:.18em;color:var(--muted);display:flex;align-items:center;gap:15px}
    .edition:before{content:"";display:block;width:1px;height:34px;background:#839e9e}
    .scene{display:block;position:absolute;inset:0;width:100%;height:100%}
    .controls{position:absolute;bottom:28px;left:clamp(24px,6vw,100px);right:clamp(24px,6vw,100px);z-index:3;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .caption{font-size:12px;letter-spacing:.1em;margin:0;color:#456563}
    .control-set{display:flex;align-items:center;gap:9px}
    button{font:inherit;font-size:12px;color:var(--ink);background:#fffdf499;border:1px solid #45656340;border-radius:99px;min-height:42px;padding:0 17px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;touch-action:manipulation;transition:background .18s,border-color .18s}
    button:hover{background:#fffdf4;border-color:#45656380}
    button:focus-visible{outline:3px solid #1c747c;outline-offset:4px}
    button svg{width:15px;height:15px;fill:currentColor}
    #motion-status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .speed-label{color:#69827d;margin-right:3px}
    .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    @media(min-aspect-ratio:17/10){.scene{width:88%;left:6%;}.film{min-height:650px}}
    @media(max-width:600px){.film{min-height:620px}.masthead{top:32px}.masthead p{font-size:10px;margin-bottom:10px}.subtitle{font-size:11px!important;max-width:190px;line-height:1.7}.edition{font-size:10px;right:24px;top:35px}.controls{bottom:24px;align-items:flex-start;flex-direction:column;gap:15px}.caption{font-size:11px}.control-set{align-self:flex-end}button{min-height:40px;padding:0 15px}.scene{top:42px;height:calc(100% - 65px)}}
  </style>
</head>
<body>
  <main class="film" aria-label="鹈鹕骑自行车的海岸动画">
    <header class="masthead">
      <p>鹈鹕的单车漫游</p>
      <h1>骑到海风里。</h1>
      <p class="subtitle">不赶时间，只追一小阵风。</p>
    </header>
    <div class="edition" aria-hidden="true">海岸骑行日记</div>

        <path d="M428 368C430 400 474 421 520 420C564 420 603 392 616 371C609 410 569 432 521 433C472 433 427 410 421 383Z" fill="#d9e3d8" opacity=".85"/>
        <path d="M610 249C604 277 621 300 618 328" class="line" stroke="#e4e9dd" stroke-width="12"/>
        <!-- 背部羽毛与叠羽 -->
        <path d="M460 355C494 338 537 348 564 372C560 392 538 407 507 405C488 403 469 397 455 384L484 387Q464 376 454 367L481 371Z" fill="#e6ece1" stroke="#8fa79c" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M474 360Q518 356 542 377M484 371Q513 372 531 385M492 386Q508 391 521 391" class="line" stroke="#afbeb0" stroke-width="2.5"/>
        <!-- 握住车把的翅尖 -->
        <path d="M555 346C582 337 606 341 630 350L700 361Q715 358 723 364Q728 371 719 374L696 374Q656 370 626 370C600 374 575 370 556 363" fill="#f6f7eb" stroke="#385d5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- 长喙与标志性的垂落喉囊 -->
        <g id="head-details">

    <footer class="controls">
      <p class="caption">下一站，还是好天气。</p>
      <div class="control-set">
        <button id="toggle" type="button" aria-label="暂停动画" aria-pressed="false">
          <svg id="pause-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4h3v12H5zm7 0h3v12h-3z"/></svg>

        <button id="speed" type="button" aria-label="当前速度：悠游，点击切换速度"><span class="speed-label">速度</span><span id="speed-text">悠游</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 5 5 5-5 5 1.5 1.5L14 10 7.5 3.5z"/></svg></button>

    <span id="motion-status" role="status" aria-live="polite"></span>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const ui = {toggle:$('toggle'), text:$('toggle-text'), icon:$('pause-icon'), speed:$('speed'), speedText:$('speed-text'), status:$('motion-status')};
      const parts = Object.fromEntries(['pelican','rear-wheel','front-wheel','crank','far-leg','far-foot','far-pedal','near-leg','near-leg-highlight','near-foot','near-pedal','clouds','waves','road','verge','foreground','sailboat','eye','scarf-tail','scarf-tail-back','breeze','distant-birds'].map(id => [id,$(id)]));
      const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const narrow = window.matchMedia('(max-width: 600px)');
      const speeds = [{name:'悠游',value:1},{name:'轻快',value:1.45},{name:'慢慢来',value:.65}];
      let paused = preference.matches, speedIndex = 0, elapsed = 0, previous = null, frameId = 0;
      const tau = Math.PI * 2;
      const crankCenter = {x:550,y:557};
      function transform(id,value){parts[id].setAttribute('transform',value);}
      function knee(hip,ankle,upper,lower,side){
        const dx=ankle.x-hip.x,dy=ankle.y-hip.y;
        const distance=Math.max(.001,Math.hypot(dx,dy));
        const bounded=Math.min(distance,upper+lower-.001);
        const a=(upper*upper-lower*lower+bounded*bounded)/(2*bounded);
        const h=Math.sqrt(Math.max(0,upper*upper-a*a));
        return {x:hip.x+a*dx/distance+side*h*dy/distance,y:hip.y+a*dy/distance-side*h*dx/distance};
      }
      function poseLeg(side,angle,bob){
        const near=side==='near';
        const pedal={x:crankCenter.x+34*Math.cos(angle),y:crankCenter.y+34*Math.sin(angle)};
        const ankle={x:pedal.x-5,y:pedal.y-10};
        const hip={x:near?523:543,y:409+bob};
        const joint=knee(hip,ankle,92,94,1);
        const d=`M${hip.x} ${hip.y}L${joint.x} ${joint.y}L${ankle.x} ${ankle.y}`;
        parts[side+'-leg'].setAttribute('d',d);
        if(near)parts['near-leg-highlight'].setAttribute('d',d);
        transform(side+'-pedal',`translate(${pedal.x} ${pedal.y})`);
        const x=pedal.x,y=pedal.y;
        parts[side+'-foot'].setAttribute('d',`M${x-19} ${y-5}Q${x-19} ${y-13} ${x-7} ${y-14}L${x+5} ${y-11}L${x+23} ${y-4}Q${x+27} ${y} ${x+19} ${y+1}H${x-18}Z`);
      }
      function render(t){
        // 所有运动由同一时钟驱动；脚踏相差半周，车轮滚动距离与路面位移一致。
        const phase=t*2.5+.3;
        const bob=Math.sin(phase*2)*2;
        const distance=t*142;
        const wheelAngle=distance/98*180/Math.PI;
        transform('rear-wheel',`rotate(${wheelAngle})`);
        transform('front-wheel',`rotate(${wheelAngle})`);
        transform('crank',`translate(550 557) rotate(${phase*180/Math.PI})`);
        transform('pelican',`translate(0 ${bob})`);
        poseLeg('far',phase+Math.PI,bob);
        poseLeg('near',phase,bob);
        transform('road',`translate(${-distance%240} 0)`);
        transform('verge',`translate(${-distance%1200} 0)`);
        transform('foreground',`translate(${-distance%1200} 0)`);
        transform('waves',`translate(${-(t*16)%340} 0)`);
        // 云层从两侧画外循环，避免突然跳回画面。
        const cloudX=-(t*9)%1430;
        transform('clouds',`translate(${cloudX} 0)`);
        transform('sailboat',`translate(${1240-(t*7+210)%1440} ${432+Math.sin(t*1.4)*1.4})`);
        transform('distant-birds',`translate(${-(t*5)%1400} ${Math.sin(t)*3})`);
        const wind=Math.sin(t*5),wind2=Math.sin(t*5-1.2);
        parts['scarf-tail'].setAttribute('d',`M596 314Q544 ${336+wind*5} 497 ${315+wind2*7}Q459 ${298+wind*9} 425 ${315+wind2*9}L430 ${330+wind2*9}Q461 ${316+wind*9} 494 ${332+wind2*7}Q548 ${354+wind*5} 603 327Z`);
        parts['scarf-tail-back'].setAttribute('d',`M595 309Q544 ${315-wind*4} 513 ${294-wind2*5}Q488 ${283-wind*6} 461 ${294-wind2*7}L463 ${311-wind2*7}Q494 ${301-wind*6} 515 ${316-wind2*5}Q558 ${335-wind*4} 598 324Z`);
        const blink=t%5.7;
        const openness=blink>5.48?Math.max(.07,Math.abs(blink-5.59)/.11):1;
        transform('eye',`translate(626 212) scale(1 ${openness}) translate(-626 -212)`);
        parts.breeze.setAttribute('opacity',String(.35+Math.sin(t*2)*.2));
        transform('breeze',`translate(${-Math.sin(t*1.4)*12} 0)`);
      }
      function loop(now){
        frameId=0;
        if(paused||document.hidden){previous=null;return;}
        if(previous!==null)elapsed+=Math.min((now-previous)/1000,.05)*speeds[speedIndex].value;
        previous=now;
        render(elapsed);
        frameId=requestAnimationFrame(loop);
      }
      function schedule(){if(!frameId&&!paused&&!document.hidden)frameId=requestAnimationFrame(loop);}
      function updateControls(announce){
        ui.text.textContent=paused?'继续骑行':'歇一会儿';
        ui.toggle.setAttribute('aria-label',paused?'继续播放动画':'暂停动画');
        ui.toggle.setAttribute('aria-pressed',String(paused));
        ui.icon.innerHTML=paused?'<path d="m6 3 11 7-11 7z"/>':'<path d="M5 4h3v12H5zm7 0h3v12h-3z"/>';
        if(announce)ui.status.textContent=paused?'动画已暂停':'动画继续播放';
      }
      ui.toggle.addEventListener('click',()=>{paused=!paused;previous=null;updateControls(true);if(paused){cancelAnimationFrame(frameId);frameId=0;}else schedule();});
      ui.speed.addEventListener('click',()=>{speedIndex=(speedIndex+1)%speeds.length;ui.speedText.textContent=speeds[speedIndex].name;ui.speed.setAttribute('aria-label',`当前速度：${speeds[speedIndex].name}，点击切换速度`);ui.status.textContent=`骑行速度：${speeds[speedIndex].name}`;});
      document.addEventListener('visibilitychange',()=>{previous=null;if(document.hidden){cancelAnimationFrame(frameId);frameId=0;}else schedule();});
      preference.addEventListener('change',e=>{if(e.matches){paused=true;cancelAnimationFrame(frameId);frameId=0;previous=null;updateControls(true);}});
      function resize(){ $('scene').setAttribute('viewBox',narrow.matches?'215 35 760 760':'0 0 1200 760'); }
      narrow.addEventListener('change',resize);
      resize();render(0);updateControls(false);schedule();
    })();
  </script>
</body>
</html>
