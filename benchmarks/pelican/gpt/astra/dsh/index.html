<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let playing=true,last=0,time=0;const btn=$('toggle');function setPlaying(value){playing=value;document.body.classList.toggle('paused',!playing);btn.textContent=playing?'暂停骑行':'继续骑行';btn.setAttribute('aria-pressed',String(!playing));}btn.addEventListener('click',()=>setPlaying(!playing));function leg(phase,near){const x=527+29*Math.cos(phase),y=398+29*Math.sin(phase);const hip={x:near?476:462,y:304};const dx=x-hip.x,dy=y-hip.y,d=Math.hypot(dx,dy),a=65,b=65,m=d/2,h=Math.sqrt(Math.max(0,a*a-m*m));const kx=hip.x+dx*.5+dy/d*h,ky=hip.y+dy*.5-dx/d*h;$(near?'nearLeg':'farLeg').setAttribute('d',`M${hip.x} ${hip.y}L${kx} ${ky}L${x} ${y-5}`);$(near?'nearFoot':'farFoot').setAttribute('d',`M${x-5} ${y-10}Q${x+8} ${y-7} ${x+20} ${y+1}L${x-11} ${y+1}Z`);$(near?'pedal1':'pedal2').setAttribute('d',`M${x-12} ${y+4}h33`);return{x,y};}function draw(){const phase=time*2*Math.PI/1600;const p=leg(phase,true),q=leg(phase+Math.PI,false);$('crank').setAttribute('d',`M${q.x} ${q.y}L${p.x} ${p.y}`);const rotation=`rotate(${phase*180/Math.PI})`;$('rearWheel').setAttribute('transform',rotation);$('frontWheel').setAttribute('transform',rotation);}function frame(now){if(last&&playing)time+=Math.min(now-last,50);last=now;draw();requestAnimationFrame(frame);}if(matchMedia('(prefers-reduced-motion: reduce)').matches)setPlaying(false);draw();requestAnimationFrame(frame);})();
</script></body></html>
