<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f5ee">
  <title>Pelican Pedal Club · 海边慢骑</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f5ee;
      --ink: #304f46;
      --muted: #7b887d;
      --line: #dce1d5;
      --orange: #d9794e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--orange); outline-offset: 5px; }
    .page { max-width: 1296px; margin: auto; padding: 32px 48px 23px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 29px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 43px; height: 43px; }
    .brand-name { font-size: 12px; line-height: 1.6; font-weight: 750; letter-spacing: 2.5px; }
    .header-note { display: flex; align-items: center; gap: 11px; color: #7c897e; font-size: 11px; letter-spacing: 2px; }
    .header-note::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #829779; }
    .postcard { margin: 0; border: 1px solid #d9e0d3; border-radius: 19px; overflow: hidden; box-shadow: 0 8px 35px #344d3c05; }
    .stage { position: relative; overflow: hidden; background: #e7eee4; }
    .scene { display: block; width: 100%; height: auto; }
    .editorial { position: absolute; top: 7.3%; left: 4.8%; pointer-events: none; }
    .eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 22px; font-size: 9px; letter-spacing: 2.6px; font-weight: 650; }
    .eyebrow::before { content: ""; width: 24px; height: 1px; background: currentColor; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(35px, 5.6vw, 76px); font-weight: 400; line-height: 1.04; letter-spacing: -3.8px; }
    h1 em { color: #678374; font-weight: 400; }
    .intro { margin: 21px 0 0 3px; font-size: 11px; color: #718575; letter-spacing: 2px; }
    .postmark { position: absolute; top: 6.7%; right: 4%; width: 79px; height: 79px; color: #768b77; transform: rotate(12deg); opacity: .76; }
    .stage-note { position: absolute; bottom: 5%; left: 4.8%; display: flex; gap: 9px; align-items: center; color: #85907b; }
    .stage-note svg { width: 21px; height: 21px; }
    .stage-note span { font-size: 8px; letter-spacing: 1.8px; }
    .mile { position: absolute; bottom: 5.1%; right: 4.5%; font-size: 9px; color: #85907b; letter-spacing: 2px; }
    .toolbar { padding: 21px 27px; display: flex; gap: 18px; justify-content: space-between; align-items: center; background: #fafaf4; border-top: 1px solid #d9e0d3; }
    .route { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .route-icon { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid #dde3d8; border-radius: 50%; }
    .route-icon svg { width: 19px; height: 19px; }
    .route-name { font-size: 12px; font-weight: 600; letter-spacing: 1px; }
    .route-description { margin-top: 5px; font-size: 9px; color: #8e998c; letter-spacing: 1px; }
    .controls { display: flex; align-items: center; gap: 22px; }
    .speed-controls { display: flex; align-items: center; gap: 3px; }
    .speed-label { font-size: 10px; margin-right: 9px; color: #8b9688; }
    .speed-button { width: 43px; height: 30px; border: 0; color: #8a9587; border-radius: 7px; background: transparent; cursor: pointer; font-size: 10px; transition: background .2s, color .2s; }
    .speed-button:hover { color: var(--ink); background: #eff1e8; }
    .speed-button[aria-pressed="true"] { color: var(--ink); background: #e9eee2; font-weight: 650; }
    .divider { width: 1px; height: 25px; background: #e0e5da; }
    .play-button { display: flex; align-items: center; justify-content: center; gap: 9px; min-width: 104px; height: 38px; padding: 0 16px; color: #f7f8ed; background: var(--ink); border: 1px solid var(--ink); border-radius: 22px; cursor: pointer; font-size: 11px; letter-spacing: 1px; transition: background .2s, transform .2s; }
    .play-button:hover { background: #456457; transform: translateY(-1px); }
    .play-button svg { width: 12px; height: 12px; }
    .play-symbol { display: none; }
    .is-paused .play-symbol { display: block; }
    .is-paused .pause-symbol { display: none; }
    .footer { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 21px 2px 0; color: #91988b; }
    .footer-motto { font-size: 8px; letter-spacing: 2.2px; }
    .footer-note { font-size: 10px; letter-spacing: 1px; }
    .footer-note span { display: inline-block; margin: 0 5px; color: #c2825a; }
    @media (min-width: 1440px) { .page { padding-top: 43px; } .masthead { margin-bottom: 35px; } }
    @media (max-width: 760px) {
      .page { padding: 23px 20px 20px; }
      .masthead { margin-bottom: 22px; }
      .brand-mark { width: 35px; height: 35px; }
      .brand-name { font-size: 10px; letter-spacing: 1.8px; }
      .header-note { font-size: 9px; letter-spacing: 1px; }
      .eyebrow { font-size: 7px; letter-spacing: 1.7px; margin-bottom: 12px; }
      h1 { font-size: clamp(35px, 5.8vw, 48px); letter-spacing: -2px; }
      .intro { font-size: 9px; letter-spacing: 1px; margin-top: 13px; }
      .postmark { width: 55px; height: 55px; }
      .toolbar { padding: 17px; gap: 12px; }
      .route-icon { display: none; }
      .route-name { font-size: 11px; }
      .route-description { font-size: 8px; letter-spacing: .3px; }
      .controls { gap: 11px; }
      .speed-label, .divider { display: none; }
      .speed-button { width: 32px; }
      .play-button { min-width: 85px; padding: 0 11px; }
      .stage-note span, .mile { font-size: 6px; letter-spacing: 1px; }
      .stage-note svg { width: 15px; height: 15px; }
    }
    @media (max-width: 500px) {
      .page { padding: 19px 14px; }
      .header-note { font-size: 8px; letter-spacing: .4px; }
      .postcard { border-radius: 14px; }
      .stage { aspect-ratio: 4 / 5; }
      .scene { position: absolute; width: 172%; max-width: none; height: auto; left: -42%; bottom: 0; }
      .editorial { top: 7%; left: 7%; }
      h1 { font-size: 47px; line-height: 1; }
      .eyebrow { font-size: 7px; margin-bottom: 15px; }
      .intro { margin-top: 16px; }
      .postmark { right: 6%; top: 6%; width: 59px; height: 59px; }
      .stage-note { left: 7%; bottom: 5%; }
      .mile { right: 7%; bottom: 5.5%; }
      .toolbar { flex-wrap: wrap; gap: 18px; padding: 19px 20px; }
      .route { width: 100%; }
      .route-icon { display: grid; width: 31px; height: 31px; }
      .controls { width: 100%; justify-content: space-between; }
      .speed-label { display: block; }
      .speed-button { width: 40px; }
      .play-button { min-width: 104px; }
      .footer { padding-top: 18px; }
      .footer-motto { font-size: 6px; letter-spacing: 1.3px; }
      .footer-note { font-size: 8px; letter-spacing: .4px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand" aria-label="Pelican Pedal Club">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="1.1"/>
          <path d="M12 30c8 4 17 1 17-6 0-3-3-5-2-9 1-4 7-4 8 0l7 2-9 3c-1 5 0 11-8 14-5 2-10 1-13-4Z" fill="currentColor"/>
          <path d="m30 17 10 .3-9 2" fill="#e2ad73"/>

        </svg>
        <div class="brand-name">PELICAN<br>PEDAL CLUB</div>

      <div class="header-note">沿着海风，慢慢骑</div>

            </g>
            <g id="grass" fill="none" stroke="#9da681" stroke-width="2" stroke-linecap="round">

              <path d="M607 220q42-4 81 0" fill="none" stroke="#3c5b4a" stroke-width="5"/>
              <path d="M637 258h8" stroke="#baaa76" stroke-width="3"/>

              <path d="M557 334c10-19 29-21 46-6 20 19 38 30 65 34 19 3 39-1 53-6 9-3 15 1 10 7l-6 4c11-1 13 3 5 7-21 10-47 11-70 5-26-6-45-17-60-25 5 21-15 31-32 20-14-9-17-25-11-40Z" fill="#f8f7e8" stroke-width="2.2"/>

          <g id="foreground-grass">
            <use href="#grass" transform="translate(108 629) scale(1.05)"/>

        <div class="editorial">
          <p class="eyebrow">POSTCARD NO. 001</p>
          <h1>Life in the<br><em>slow lane.</em></h1>
          <p class="intro">跟着鹈鹕，把日子骑慢一点。</p>
        </div>
        <svg class="postmark" viewBox="0 0 90 90" fill="none" aria-hidden="true">
          <defs><path id="stamp-top" d="M15 46a30 30 0 1 1 60 0"/><path id="stamp-bottom" d="M13 48a32 32 0 0 0 64 0"/></defs>
          <circle cx="45" cy="45" r="43" stroke="currentColor" stroke-width=".7"/>
          <circle cx="45" cy="45" r="25" stroke="currentColor" stroke-width=".7"/>
          <g fill="currentColor" font-family="sans-serif" font-size="7" letter-spacing="2.1">
            <text><textPath href="#stamp-top" startOffset="50%" text-anchor="middle">THE SCENIC ROUTE</textPath></text>

          <path d="M29 48q8-8 16 0t16 0M29 54q8-8 16 0t16 0" stroke="currentColor" stroke-width="1"/>

      <figcaption class="toolbar">
        <div class="route">
          <div class="route-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M3 14q4-4 9 0t9 0M3 19q4-4 9 0t9 0"/><path d="M9 9a4 4 0 1 1 8 0M13 2V1M6 5 4 4m15 1 2-1"/></svg>
          </div>
          <div><div class="route-name">海岸线 · 自由骑行</div><div class="route-description">微风，花香，以及不着急的好时光。</div></div>
        </div>
        <div class="controls">
          <div class="speed-controls" role="group" aria-label="骑行速度">
            <span class="speed-label">骑行节奏</span>
            <button class="speed-button" data-speed="0.5" aria-label="半速骑行" aria-pressed="false">0.5×</button>
            <button class="speed-button" data-speed="1" aria-label="正常速度骑行" aria-pressed="true">1×</button>
            <button class="speed-button" data-speed="1.5" aria-label="一点五倍速骑行" aria-pressed="false">1.5×</button>
          </div>
          <div class="divider" aria-hidden="true"></div>
          <button class="play-button" id="play-toggle" aria-label="暂停动画">
            <svg class="pause-symbol" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><rect x="2" y="1" width="2.5" height="10" rx=".8"/><rect x="7.5" y="1" width="2.5" height="10" rx=".8"/></svg>
            <svg class="play-symbol" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M3 1.5q0-1 1-.4l7 4.2q1 .7 0 1.4l-7 4.2q-1 .6-1-.4Z"/></svg>
            <span id="play-label">歇一会儿</span>
          </button>
        </div>
      </figcaption>
    </figure>

    <footer class="footer"><span class="footer-motto">LESS HURRY. MORE HAPPY.</span><span class="footer-note">没有目的地<span>↗</span>沿途都是好风景</span></footer>
  </main>

  <script>
    (() => {
      'use strict';
      const byId = (id) => document.getElementById(id);
      const parts = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'crank', 'pelican', 'cyclist',
        'leg-front', 'leg-front-highlight', 'leg-back', 'leg-back-highlight',
        'foot-front', 'foot-back', 'scarf-long', 'scarf-short', 'eye',
        'clouds', 'birds', 'waves-far', 'sailboat', 'far-grass',
        'road-marks', 'foreground-grass', 'bike-shadow', 'flowers'
      ].map((id) => [id, byId(id)]));
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const toggle = byId('play-toggle');
      let playing = !motionPreference.matches;
      let speed = 1;
      let time = 0;
      let lastTime = null;
      let frameId = null;

      // Duplicate moving scenery so every wrap is continuous and stays filled.
      const scenery = [
        { id: 'far-grass', width: 1400, rate: 24 },
        { id: 'road-marks', width: 1280, rate: 110 },
        { id: 'foreground-grass', width: 1400, rate: 110 }
      ];
      scenery.forEach(({ id, width }) => {
        const group = parts[id];
        const originals = [...group.children];
        for (const offset of [-width, width]) {
          const copy = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          copy.setAttribute('transform', `translate(${offset} 0)`);
          originals.forEach((child) => copy.appendChild(child.cloneNode(true)));
          group.appendChild(copy);
        }
      });

      function moveLeg(side, angle, bob) {
        const front = side === 'front';
        const hipX = front ? 589 : 577;
        const hipY = (front ? 386 : 383) + bob;
        const footX = 622 + Math.cos(angle) * 32;
        const footY = 531 + Math.sin(angle) * 32;
        const ankleX = footX - 4;
        const ankleY = footY - 6;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const distance = Math.hypot(dx, dy);
        const upper = 94;
        const lower = 103;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + along * dx / distance + bend * dy / distance;
        const kneeY = hipY + along * dy / distance - bend * dx / distance;
        const path = `M${hipX} ${hipY} Q${kneeX - 4} ${kneeY - 5} ${kneeX} ${kneeY} L${ankleX} ${ankleY}`;
        parts[`leg-${side}`].setAttribute('d', path);
        parts[`leg-${side}-highlight`].setAttribute('d', path);
        parts[`foot-${side}`].setAttribute('transform', `translate(${footX} ${footY})`);
      }

      function draw() {
        const angle = time * 2.7;
        const degrees = angle * 180 / Math.PI;
        const bob = Math.sin(angle * 2) * 1.7;
        parts['rear-spokes'].setAttribute('transform', `rotate(${degrees * 2.4})`);
        parts['front-spokes'].setAttribute('transform', `rotate(${degrees * 2.4})`);
        parts.crank.setAttribute('transform', `rotate(${degrees} 622 531)`);
        parts.pelican.setAttribute('transform', `translate(0 ${bob})`);
        parts.cyclist.setAttribute('transform', `translate(0 ${Math.sin(time * 8) * .45})`);
        moveLeg('front', angle, bob);
        moveLeg('back', angle + Math.PI, bob);

        const flutter = Math.sin(time * 7) * 4;
        const flutter2 = Math.sin(time * 7 - 1.2) * 3;
        parts['scarf-long'].setAttribute('d', `M642 287q-27-9-48 ${-2 + flutter}t-51 ${-8 + flutter2}l6 13-8 6q29 12 56 ${-3 - flutter}t43 2Z`);
        parts['scarf-short'].setAttribute('d', `M641 291q-27 4-42 ${17 + flutter2}t-27 11l11 6-1 9q22-6 34 ${-23 - flutter2}t27-12Z`);
        parts.flowers.setAttribute('transform', `rotate(${Math.sin(time * 3.1) * 2} 799 371)`);

        // A brief blink, with all animation tied to a single pausable clock.
        const blinkPhase = time % 5.7;
        const eyeScale = blinkPhase > 5.45 ? Math.max(.08, Math.abs(blinkPhase - 5.575) / .125) : 1;
        parts.eye.setAttribute('transform', `translate(0 ${232 * (1 - eyeScale)}) scale(1 ${eyeScale})`);
        parts.clouds.setAttribute('transform', `translate(${-((time * 2) % 1450)} 0)`);
        parts.birds.setAttribute('transform', `translate(${Math.sin(time * .18) * 22} ${Math.sin(time * .9) * 3})`);
        parts['waves-far'].setAttribute('transform', `translate(${Math.sin(time * .45) * 12} 0)`);
        parts.sailboat.setAttribute('transform', `translate(${309 - (time * 3 % 1500)} ${366 + Math.sin(time * 1.1) * 1.7})`);
        parts['bike-shadow'].setAttribute('rx', 220 + Math.sin(angle * 2) * 2);
        scenery.forEach(({ id, width, rate }) => {
          parts[id].setAttribute('transform', `translate(${-((time * rate) % width)} 0)`);
        });
      }

      // Clouds and the sailboat also repeat beyond the edge of the postcard.
      const cloudCopy = parts.clouds.cloneNode(true);
      cloudCopy.removeAttribute('id');
      cloudCopy.setAttribute('transform', 'translate(1450 0)');
      parts.clouds.appendChild(cloudCopy);
      const boatCopy = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      boatCopy.setAttribute('transform', 'translate(1500 0)');
      [...parts.sailboat.children].forEach((child) => boatCopy.appendChild(child.cloneNode(true)));
      parts.sailboat.appendChild(boatCopy);

      function tick(timestamp) {
        frameId = null;
        if (!playing || document.hidden) { lastTime = null; return; }
        if (lastTime !== null) time += Math.min((timestamp - lastTime) / 1000, .05) * speed;
        lastTime = timestamp;
        draw();
        frameId = requestAnimationFrame(tick);
      }

      function schedule() {
        if (frameId === null && playing && !document.hidden) frameId = requestAnimationFrame(tick);
      }

      function updatePlayback() {
        toggle.classList.toggle('is-paused', !playing);
        toggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        byId('play-label').textContent = playing ? '歇一会儿' : '继续兜风';
        lastTime = null;
        if (!playing && frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
        }
        schedule();
      }

      toggle.addEventListener('click', () => { playing = !playing; updatePlayback(); });
      document.querySelectorAll('[data-speed]').forEach((button) => {
        button.addEventListener('click', () => {
          speed = Number(button.dataset.speed);
          document.querySelectorAll('[data-speed]').forEach((item) => {
            item.setAttribute('aria-pressed', String(item === button));
          });
        });
      });
      document.addEventListener('visibilitychange', () => { lastTime = null; schedule(); });
      motionPreference.addEventListener('change', (event) => {
        if (event.matches) { playing = false; updatePlayback(); }
      });
      draw();
      updatePlayback();
    })();
  </script>
