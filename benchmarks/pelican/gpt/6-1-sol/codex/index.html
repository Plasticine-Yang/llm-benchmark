<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3e9">
  <title>顺风俱乐部 · 鹈鹕骑行记</title>
  <style>
    :root { color-scheme: light; --paper:#f7f3e9; --ink:#263f43; --muted:#7c8981; --orange:#db734c; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    .page { max-width:1440px; margin:auto; min-height:100svh; padding:32px 5.5vw 24px; display:flex; flex-direction:column; }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; }
    .brand { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:650; letter-spacing:2px; }
    .brand svg { width:34px; height:34px; }
    .edition { font-size:10px; letter-spacing:2px; color:var(--muted); }
    main { flex:1; position:relative; width:100%; max-width:1120px; margin:35px auto 0; }
    .intro { position:absolute; top:24px; left:3%; z-index:1; pointer-events:none; }
    .eyebrow { font-size:10px; letter-spacing:3px; color:var(--orange); margin:0 0 17px; }
    h1 { font-family:"Songti SC","STSong",serif; font-size:clamp(30px,4vw,52px); font-weight:500; margin:0; letter-spacing:3px; }
    .subtitle { margin:15px 0 0; font-size:12px; color:var(--muted); letter-spacing:2px; line-height:1.9; }
    .scene { display:block; width:100%; height:auto; overflow:visible; }
    .bottom { display:flex; align-items:center; justify-content:space-between; border-top:1px solid #dedfd4; padding-top:21px; gap:24px; }
    .caption { display:flex; align-items:center; gap:15px; font-size:11px; letter-spacing:1.5px; }
    .caption .number { font-family:Georgia,serif; font-size:25px; color:var(--orange); }
    .controls { display:flex; gap:10px; align-items:center; }
    button { font:inherit; color:var(--ink); font-size:11px; letter-spacing:1px; border:1px solid #cdd3c7; background:transparent; padding:10px 15px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:7px; }
    button:hover { background:#eaece0; border-color:#a8b5a6; }
    button:focus-visible { outline:2px solid var(--orange); outline-offset:4px; }
    button svg { width:13px; height:13px; }
    footer { margin-top:27px; display:flex; justify-content:space-between; color:#919b91; font-size:9px; letter-spacing:2px; }
    .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.6s linear infinite; }
    .crank { transform-origin:490px 505px; animation:spin 1.6s linear infinite; }
    .rider { animation:bob 1.6s ease-in-out infinite; }
    .head { transform-origin:483px 273px; animation:nod 3.2s ease-in-out infinite; }
    .scarf-end { transform-origin:467px 277px; animation:flutter .8s ease-in-out infinite alternate; }
    .road-moving { animation:road 1.6s linear infinite; }
    .cloud { animation:cloud 24s linear infinite; }
    .cloud-slow { animation:cloud 34s linear infinite; }
    .far-bird { animation:float 4s ease-in-out infinite; }
    .speed-line { animation:breeze 2.4s ease-in-out infinite; }
    .speed-line.second { animation-delay:-1.2s; }
    .blink { transform-origin:503px 213px; animation:blink 6s infinite; }
    .stopped * { animation-play-state:paused !important; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes bob { 0%,50%,100% { transform:translateY(0); } 25%,75% { transform:translateY(3px); } }
    @keyframes nod { 0%,100% { transform:rotate(-1deg); } 50% { transform:rotate(1.5deg); } }
    @keyframes flutter { from { transform:rotate(-4deg); } to { transform:rotate(5deg); } }
    @keyframes road { to { transform:translateX(-180px); } }
    @keyframes cloud { from { transform:translateX(30px); } to { transform:translateX(-90px); } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
    @keyframes breeze { 0%,100% { opacity:.15; transform:translateX(8px); } 50% { opacity:.8; transform:translateX(-12px); } }
    @keyframes blink { 0%,44%,47%,100% { transform:scaleY(1); } 45%,46% { transform:scaleY(.1); } }
    @media (max-width:640px) {
      .page { padding:23px 6vw 22px; }
      .edition { letter-spacing:1px; font-size:8px; }
      .brand { font-size:12px; letter-spacing:1px; }
      main { margin-top:26px; min-height:520px; display:flex; align-items:flex-end; }
      .intro { left:0; top:12px; }
      h1 { font-size:34px; }
      .scene { width:145%; max-width:none; margin-left:-22.5%; margin-bottom:22px; }
      .page { overflow:hidden; }
      .bottom { align-items:flex-start; gap:15px; }
      .caption { gap:8px; font-size:9px; letter-spacing:.5px; }
      .caption .number { font-size:22px; }
      .controls { gap:6px; }
      button { padding:9px 10px; font-size:10px; }
      footer { font-size:8px; letter-spacing:1px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="18" stroke="#263f43"/><path d="M11 26c0-7 4-7 7-10 0-4 3-6 6-5l9 5-10 1c0 5 2 9-4 11-3 1-5 0-8-2Z" fill="#263f43"/><path d="m23 14 9 2-9 2" fill="#db734c"/></svg>
        <span>顺风俱乐部</span>
      </div>
      <span class="edition">THE SLOW RIDES / VOL. 001</span>

    <div class="bottom">

      <div class="controls">

    <footer><span>一只鹈鹕的悠闲日常</span><span>DRAWN IN SVG · MADE TO WANDER</span></footer>
  </div>
  <script>
    const scene = document.getElementById('scene');
    const play = document.getElementById('play');
    const playLabel = document.getElementById('play-label');
    const playIcon = document.getElementById('play-icon');
    const speedButton = document.getElementById('speed');
    const speedLabel = document.getElementById('speed-label');
    const motions = [...scene.querySelectorAll('animate')];
    const animations = scene.getAnimations({subtree:true});
    const rates = [1, 1.5, 0.75];
    let paused = false;
    let rateIndex = 0;
    function setPaused(value) {
      paused = value;
      scene.classList.toggle('stopped', paused);
      if (paused) scene.pauseAnimations(); else scene.unpauseAnimations();
      playLabel.textContent = paused ? '继续' : '暂停';
      playIcon.setAttribute('d', paused ? 'M4 2l10 6-10 6z' : 'M4 3h3v10H4zM9 3h3v10H9z');
      play.setAttribute('aria-pressed', String(paused));
      play.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
    }
    play.addEventListener('click', () => setPaused(!paused));
    speedButton.addEventListener('click', () => {
      const previousRate = rates[rateIndex];
      rateIndex = (rateIndex + 1) % rates.length;
      const rate = rates[rateIndex];
      const currentTime = scene.getCurrentTime();
      motions.forEach(motion => motion.setAttribute('dur', `${1.6 / rate}s`));
      scene.setCurrentTime(currentTime * previousRate / rate);
      animations.forEach(animation => animation.updatePlaybackRate(rate));
      speedLabel.textContent = `${rate}×`;
    });
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (reducedMotion.matches) setPaused(true);
    reducedMotion.addEventListener('change', event => setPaused(event.matches));
  </script>
</body>
