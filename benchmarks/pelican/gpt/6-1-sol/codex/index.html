<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2e8">
  <title>顺风去海边 · Pelican Bicycle Club</title>
  <style>
    :root { color-scheme: light; --ink: #294a46; --paper: #f6f2e8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    .page { max-width: 1500px; margin: auto; padding: 30px 48px 25px; }
    header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #294a4626; padding-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 750; letter-spacing: 2.1px; }
    .brand svg { width: 27px; height: 27px; }
    .edition { font-family: monospace; font-size: 11px; letter-spacing: 1.2px; opacity: .6; }
    .intro { padding: 36px 0 0; display: flex; align-items: end; justify-content: space-between; gap: 20px; }
    .eyebrow { margin: 0 0 12px; font-size: 10px; letter-spacing: 3px; color: #8d9b88; font-weight: 700; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 55px); font-weight: 550; letter-spacing: -2px; line-height: 1.2; }
    .intro p { margin: 0 0 3px; color: #77867a; font-size: 12px; line-height: 1.9; }
    .scene { position: relative; margin-top: 27px; border-radius: 12px; overflow: hidden; background: #ececde; }
    #landscape { display: block; width: 100%; max-height: 69vh; min-height: 320px; }
    .scene-label { position: absolute; left: 27px; top: 24px; display: flex; align-items: center; gap: 7px; color: #536c5d; font-family: monospace; font-size: 10px; letter-spacing: 1px; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: #739683; }
    .controls { position: absolute; bottom: 22px; right: 25px; display: flex; align-items: center; gap: 15px; }
    .speed { font-family: monospace; font-size: 10px; color: #647466; letter-spacing: 1px; }
    button { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid #294a4626; background: #f8f5e9df; color: var(--ink); padding: 10px 14px; border-radius: 24px; font: inherit; font-size: 11px; cursor: pointer; }
    button:hover { background: #fffaf0; }
    button:focus-visible { outline: 3px solid #e2a05c; outline-offset: 3px; }
    button svg { width: 12px; height: 12px; }
    footer { display: flex; justify-content: space-between; align-items: center; padding-top: 19px; gap: 20px; }
    .caption { display: flex; align-items: center; gap: 12px; font-size: 11px; color: #748174; }
    .caption i { width: 25px; height: 1px; background: #a0aa95; }
    .footnote { font: 10px monospace; letter-spacing: 1px; color: #8a9686; }
    @media (max-width: 650px) { .page { padding: 20px 18px; } .edition { font-size: 9px; letter-spacing: 0; } .brand { font-size: 10px; letter-spacing: 1px; } .intro { padding-top: 28px; display: block; } .intro p { margin-top: 14px; } #landscape { min-height: 350px; width: 160%; max-width: none; margin-left: -30%; } .scene-label { left: 15px; top: 16px; } .speed, .footnote { display: none; } .controls { right: 15px; bottom: 15px; } footer { padding-top: 16px; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand"><svg viewBox="0 0 30 30" fill="none" aria-hidden="true"><circle cx="7" cy="21" r="5" stroke="currentColor" stroke-width="1.5"/><circle cx="23" cy="21" r="5" stroke="currentColor" stroke-width="1.5"/><path d="m7 21 6-10 5 10H7l8-6h6l2 6M11 10h5m4 5-1-6h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>PELICAN BICYCLE CLUB</div>
      <span class="edition">A LITTLE LOOP OF HAPPINESS / 001</span>
    </header>
    <section class="intro">
      <div><p class="eyebrow">THE SLOW COAST COLLECTION</p><h1>顺风，去海边。</h1></div>
      <p>不赶时间，只追海风。<br>和一只鹈鹕，骑进悠长的午后。</p>
    </section>
    <section class="scene" aria-label="一只戴着绿色围巾的鹈鹕骑着黄色自行车，在海边持续踩踏前进的 SVG 动画">
      <div class="scene-label"><span class="dot"></span>COASTAL ROUTE · ENDLESS AFTERNOON</div>
      <svg id="landscape" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">鹈鹕的海边自行车旅行</title>
        <desc id="scene-desc">奶白色鹈鹕戴着绿色围巾，长长的橙黄色喙朝向前方，双脚交替蹬踏金黄色自行车。车轮旋转，云朵和路面向后流动。</desc>
        <defs>
          <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e5eadf"/><stop offset="1" stop-color="#f6edd9"/></linearGradient>
          <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#9bbfb6"/><stop offset="1" stop-color="#bcd0be"/></linearGradient>
          <linearGradient id="feathers" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf0"/><stop offset="1" stop-color="#e4e4d0"/></linearGradient>
          <linearGradient id="bill" x2="0" y2="1"><stop stop-color="#efba67"/><stop offset="1" stop-color="#dc9857"/></linearGradient>
          <linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#f0bf83"/><stop offset="1" stop-color="#e5a574"/></linearGradient>
          <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".5" fill="#766c46" opacity=".05"/><circle cx="5" cy="4" r=".4" fill="#fff" opacity=".14"/></pattern>
          <g id="wheel">
            <circle r="108" fill="#faf4df" stroke="#304b48" stroke-width="10"/>
            <circle r="99" fill="none" stroke="#bcc3ac" stroke-width="2"/>
            <g class="spokes" stroke="#71847a" stroke-width="1.6" opacity=".65">
              <path d="M-97 0H97M0-97V97M-68.6-68.6 68.6 68.6M-68.6 68.6 68.6-68.6M-89.6-37.1 89.6 37.1M-37.1-89.6 37.1 89.6M-89.6 37.1 89.6-37.1M-37.1 89.6 37.1-89.6"/>
            </g>
            <circle r="9" fill="#d9d9bb" stroke="#304b48" stroke-width="3"/>
          </g>
          <g id="cloud" fill="#f8f5e9" opacity=".75"><path d="M0 22C5 7 23 6 35 12 39-5 68-9 80 12 102 7 111 13 117 22Z"/></g>
          <g id="grass" fill="none" stroke="#889979" stroke-width="2.5" stroke-linecap="round"><path d="M0 0q0-25-12-37M0 0q5-39 16-47M0 0q16-22 29-22"/></g>
        </defs>
        <!-- The landscape drifts in layers, leaving our rider at the centre. -->
        <path d="M0 0H1200V760H0Z" fill="url(#sky)"/>
        <circle cx="870" cy="163" r="71" fill="#efc886" opacity=".85"/>
        <circle cx="870" cy="163" r="89" fill="none" stroke="#efd5a4" stroke-width="1" opacity=".6"/>
        <g id="clouds"><use href="#cloud" x="130" y="128"/><use href="#cloud" x="500" y="89" transform="translate(130 20) scale(.75)"/><use href="#cloud" x="1050" y="233"/><use href="#cloud" x="-400" y="200"/></g>
        <g id="gulls" fill="none" stroke="#78978c" stroke-width="2" stroke-linecap="round"><path d="M959 297q10-10 21 0 11-10 21 0"/><path d="M1019 265q7-7 14 0 7-7 14 0"/><path d="M184 275q8-7 16 0 8-7 16 0"/></g>
        <path d="M0 351Q155 329 280 352T550 349T840 347T1200 346V552H0Z" fill="url(#sea)"/>
        <path d="M0 353Q155 331 280 354T550 351T840 349T1200 348" fill="none" stroke="#e3ecdc" stroke-width="2"/>
        <g id="ripples" stroke="#e0e8d5" stroke-width="2" stroke-linecap="round" opacity=".8"><path d="M48 386h95m96 31h49m72-27h79m340-11h108m134 48h101M-105 437h118m134 20h102m588-13h94m84-44h45"/></g>
        <path d="M0 482q167-46 345-9t344-2 511-13V630H0Z" fill="#d4d7b5"/>
        <path d="M0 549q190-47 414-4t432-8 354 4V685H0Z" fill="#e4dbb9"/>
        <path d="M0 605q260-19 510-4t690-9V760H0Z" fill="#eae2c8"/>
        <path d="M0 683H1200V760H0Z" fill="#dfd9c3"/>
        <path d="M0 683H1200" stroke="#f9f1db" stroke-width="3"/>
        <g id="road" stroke="#f4edda" stroke-width="4" stroke-linecap="round"><path d="M-160 719h75M90 719h75M340 719h75M590 719h75M840 719h75M1090 719h75M1340 719h75"/></g>
        <g id="plants"><use href="#grass" x="104" y="651"/><use href="#grass" x="1110" y="633" transform="translate(333 190) scale(.7)"/><use href="#grass" x="1325" y="651"/><g fill="#8d9a7b"><ellipse cx="98" cy="621" rx="4" ry="10" transform="rotate(-25 98 621)"/><ellipse cx="116" cy="610" rx="4" ry="11" transform="rotate(23 116 610)"/></g></g>
        <ellipse id="shadow" cx="610" cy="684" rx="247" ry="13" fill="#788474" opacity=".16"/>
        <g id="bicycle">
          <use href="#wheel" x="440" y="575"/>
          <use href="#wheel" x="785" y="575"/>
          <g id="rear-spokes" transform="translate(440 575)" stroke="#a2ad95" stroke-width="3"><path d="M0-93V-65M0 65V93"/></g>
          <g id="front-spokes" transform="translate(785 575)" stroke="#a2ad95" stroke-width="3"><path d="M0-93V-65M0 65V93"/></g>
          <!-- Mudguards, chain and the slender classic diamond frame. -->
          <path d="M333 564a108 108 0 0 1 211-16M680 550a108 108 0 0 1 208 0" fill="none" stroke="#acb8a0" stroke-width="5" stroke-linecap="round"/>
          <path d="M438 562 604 541a24 24 0 0 1 3 48L439 588a13 13 0 0 1-1-26Z" fill="#bec5a7" stroke="#6f8172" stroke-width="2"/>
          <g fill="none" stroke="#bd8748" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"><path d="m440 575 112-134 58 124H440l287-112-127 112M552 441l185 12M785 575l-62-164"/></g>
          <g fill="none" stroke="#e7b962" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"><path d="m440 575 112-134 58 124H440l287-112-127 112M552 441l185 12M785 575l-62-164"/></g>
          <path d="m554 441-7-30" stroke="#53695c" stroke-width="6"/>
          <path d="M517 410q-4-10 12-10h49q14 1 18 9c-17 9-49 9-79 1Z" fill="#775d49"/>
          <path d="m725 415-9-36q-2-8 8-8h44q20 0 20 15t-15 15" fill="none" stroke="#53695c" stroke-width="6" stroke-linecap="round"/>
          <path d="M769 401h-16" stroke="#775d49" stroke-width="9" stroke-linecap="round"/>
          <circle cx="747" cy="367" r="8" fill="#e9c57e" stroke="#728173" stroke-width="2"/>
          <circle cx="610" cy="565" r="25" fill="#ebc77c" stroke="#816f4f" stroke-width="3"/>
          <circle cx="610" cy="565" r="18" fill="none" stroke="#b39964" stroke-width="1.5" stroke-dasharray="2 5"/>
          <g id="crank" stroke="#4a6256" stroke-width="5" stroke-linecap="round"><path d="M573 565h74"/></g>
          <circle cx="610" cy="565" r="5" fill="#506459"/>
        </g>
        <g id="far-leg" fill="none" stroke="#b97e4d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path id="far-leg-path"/><path id="far-foot" stroke-width="8"/></g>
        <g id="rider">
          <!-- Tail, plump body, rising neck, and a very recognisable pelican pouch. -->
          <path d="M493 349q-39-11-72-4l24 17-22 3q34 30 78 17Z" fill="#f5f3df" stroke="#788475" stroke-width="2"/>
          <path d="M476 301c29-41 104-53 150-20 42 31 52 96 5 125-51 33-130 17-162-22-21-26-14-57 7-83Z" fill="url(#feathers)" stroke="#788475" stroke-width="2.5"/>
          <path d="M584 298c25-37 29-61 27-95-2-33 15-59 43-59 27 0 46 20 44 48-2 25-24 42-26 76-2 35-5 68-25 84" fill="url(#feathers)" stroke="#788475" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M614 202c-11-4-17-17-12-27 7 5 12 6 17 5" fill="#faf9ea" stroke="#788475" stroke-width="2"/>
          <path d="M672 194c44 13 108 20 174 21-24 22-77 53-113 60-32 6-50-19-61-51Z" fill="url(#pouch)" stroke="#a17c56" stroke-width="2"/>
          <path d="M681 185c42 7 106 18 167 26q18 2 17 9c-56 4-126-2-187-14Z" fill="url(#bill)" stroke="#a17c56" stroke-width="2" stroke-linejoin="round"/>
          <path d="M694 214q54 11 138 6" fill="none" stroke="#c9935e" stroke-width="1.5"/>
          <path d="M715 245q18 18 38 13" fill="none" stroke="#f9d59d" stroke-width="3" stroke-linecap="round"/>
          <circle cx="664" cy="178" r="10" fill="#e4dbc1"/>
          <circle cx="665" cy="178" r="5.5" fill="#294a46"/>
          <circle cx="667" cy="176" r="1.8" fill="#fffdf1"/>
          <path d="m652 161 13-3" stroke="#7e8c78" stroke-width="2" stroke-linecap="round"/>
          <g id="scarf-tails">
            <path d="M617 271c-29-5-52-8-79-24-20-12-40-6-49-8 26 25 66 47 115 53Z" fill="#709888" stroke="#557c6e" stroke-width="1.5"/>
            <path d="M612 278c-34 14-66 13-105 10l10 16c36 8 79-1 104-12Z" fill="#93afa0" stroke="#557c6e" stroke-width="1.5"/>
            <path d="m491 239 8 9m3-6 8 10m0-7 8 11" stroke="#aec1aa" stroke-width="2"/>
          </g>
          <path d="M609 263q29 14 65 6l-3 17q-36 9-65-8Z" fill="#729c8a" stroke="#557c6e" stroke-width="1.5"/>
          <path d="M602 270q6-10 15 0l-3 17q-12 0-13-8Z" fill="#537d6d"/>
          <path d="M500 310c24-21 65-12 103 18 28 22 43 36 63 49l80 20q8 3 5 10c-2 5-8 4-14 3l-87-14c-53-3-108-4-141-36-17-16-24-36-9-50Z" fill="#f5f3e3" stroke="#788475" stroke-width="2.5" stroke-linejoin="round"/>
          <g fill="none" stroke="#bbc2ab" stroke-width="2" stroke-linecap="round"><path d="M501 333q27 35 79 45M515 320q23 36 74 50M537 320q25 28 61 40"/></g>
          <path d="M491 390q22 18 47 20" fill="none" stroke="#cbd0ba" stroke-width="2" stroke-linecap="round"/>
        </g>
        <g id="near-leg" stroke-linecap="round" stroke-linejoin="round"><path id="near-leg-path" fill="none" stroke="#d6985c" stroke-width="12"/><path id="near-foot" fill="#e3aa6c" stroke="#a4774e" stroke-width="2"/></g>
        <g id="pedals" stroke="#435b50" stroke-width="6" stroke-linecap="round"><path id="near-pedal"/><path id="far-pedal"/></g>
        <g id="wind" fill="none" stroke="#fff9e8" stroke-width="2" stroke-linecap="round" opacity=".7"><path d="M354 235h46m-72 14h36M306 463h52m-79 14h33"/></g>
        <path d="M0 0H1200V760H0Z" fill="url(#grain)" pointer-events="none"/>
      </svg>
      <div class="controls"><span class="speed">A NICE & EASY 12 KM/H</span><button id="toggle" type="button" aria-label="暂停动画" aria-pressed="false"><svg id="control-icon" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M2 2h3v8H2zm5 0h3v8H7z"/></svg><span id="control-text">停一会儿</span></button></div>
    </section>
    <footer><div class="caption"><i></i>生活偶尔需要一点无目的的快乐。</div><span class="footnote">MADE OF SVG, SUNSHINE & SEA BREEZE</span></footer>
  </main>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let elapsed = 0;
      let previous = null;
      const tau = Math.PI * 2;
      const spokePatterns = document.querySelectorAll('#wheel .spokes');

      // Two-link inverse kinematics keeps each ankle attached to its pedal.
      function leg(prefix, hip, foot, near) {
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 108, lower = 112;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const offset = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = { x: hip.x + dx * along / distance + dy * offset / distance,
                       y: hip.y + dy * along / distance - dx * offset / distance };
        $(prefix + '-leg-path').setAttribute('d', `M${hip.x} ${hip.y}Q${hip.x + 2} ${hip.y + 15} ${knee.x} ${knee.y}L${foot.x} ${foot.y - 6}`);
        if (near) {
          $(prefix + '-foot').setAttribute('d', `M${foot.x - 5} ${foot.y - 12}Q${foot.x + 6} ${foot.y - 5} ${foot.x + 21} ${foot.y - 4}L${foot.x + 26} ${foot.y + 2}L${foot.x - 12} ${foot.y + 2}Z`);
        } else {
          $(prefix + '-foot').setAttribute('d', `M${foot.x - 8} ${foot.y - 3}H${foot.x + 21}`);
        }
        $(prefix + '-pedal').setAttribute('d', `M${foot.x - 13} ${foot.y + 5}H${foot.x + 22}`);
      }

      function draw(t) {
        const angle = t * tau / 1.7;
        const bob = Math.sin(angle * 2) * 2.4;
        const near = { x: 610 + Math.cos(angle) * 37, y: 565 + Math.sin(angle) * 37 };
        const far = { x: 610 - Math.cos(angle) * 37, y: 565 - Math.sin(angle) * 37 };
        leg('far', { x: 553, y: 406 + bob }, far, false);
        leg('near', { x: 581, y: 408 + bob }, near, true);
        $('rider').setAttribute('transform', `translate(0 ${bob})`);
        $('crank').setAttribute('transform', `rotate(${angle * 180 / Math.PI} 610 565)`);
        const rotation = t * 106;
        $('rear-spokes').setAttribute('transform', `translate(440 575) rotate(${rotation})`);
        $('front-spokes').setAttribute('transform', `translate(785 575) rotate(${rotation})`);
        // Rotate the full spoke patterns, with hubs and tyres staying steady.
        spokePatterns.forEach(spokes => spokes.setAttribute('transform', `rotate(${rotation})`));
        $('scarf-tails').setAttribute('transform', `rotate(${Math.sin(t * 5) * 2.4} 615 275)`);
        $('clouds').setAttribute('transform', `translate(${-(t * 9 % 1500)} 0)`);
        // Duplicate clouds make the distant drift seamless.
        $('clouds-copy').setAttribute('transform', `translate(${1500 - (t * 9 % 1500)} 0)`);
        $('road').setAttribute('transform', `translate(${-(t * 195 % 250)} 0)`);
        $('plants').setAttribute('transform', `translate(${-(t * 125 % 1221)} 0)`);
        $('plants-copy').setAttribute('transform', `translate(${1221 - (t * 125 % 1221)} 0)`);
        $('ripples').setAttribute('transform', `translate(${Math.sin(t * .4) * 10} 0)`);
        $('gulls').setAttribute('transform', `translate(${Math.sin(t * .3) * 9} ${Math.sin(t * 1.2) * 3})`);
        $('wind').setAttribute('opacity', .4 + Math.sin(t * 3) * .2);
        $('shadow').setAttribute('rx', 247 + bob * .8);
      }
      for (const [source, copy, distance] of [['clouds', 'clouds-copy', 1500], ['plants', 'plants-copy', 1221]]) {
        const clone = $(source).cloneNode(true);
        clone.id = copy;
        clone.setAttribute('transform', `translate(${distance} 0)`);
        $(source).after(clone);
      }
      function updateControl() {
        $('toggle').setAttribute('aria-pressed', String(!playing));
        $('toggle').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        $('control-text').textContent = playing ? '停一会儿' : '继续兜风';
        $('control-icon').innerHTML = playing ? '<path d="M2 2h3v8H2zm5 0h3v8H7z"/>' : '<path d="M3 1.5 10 6 3 10.5Z"/>';
      }
      $('toggle').addEventListener('click', () => { playing = !playing; updateControl(); });
      reducedMotion.addEventListener('change', event => { playing = !event.matches; updateControl(); });
      document.addEventListener('visibilitychange', () => { previous = null; });
      function frame(now) {
        if (previous !== null && playing && !document.hidden) elapsed += Math.min((now - previous) / 1000, .05);
        previous = now;
        draw(elapsed);
        requestAnimationFrame(frame);
      }
      updateControl();
      draw(0);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
