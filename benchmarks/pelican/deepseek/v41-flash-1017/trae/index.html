<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>骑自行车的鹈鹕 · SVG 动画</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(120% 120% at 50% 15%, #1d2636 0%, #0a0e15 60%, #05070b 100%);
    font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  .scene {
    width: min(1200px, 94vw);
    filter: drop-shadow(0 30px 60px rgba(0, 0, 0, .55));
  }
  svg { display: block; width: 100%; height: auto; }

  .eye {
    animation: blink 5.5s infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(1); }
    94%, 96%      { transform: scaleY(.08); }
  }

  .glow {
    animation: glow 6s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes glow {
    0%, 100% { opacity: .45; transform: scale(.94); }
    50%      { opacity: .85; transform: scale(1.06); }
  }
</style>
</head>
<body>
<div class="scene">
<svg viewBox="0 0 1200 700" role="img" aria-label="一只鹈鹕骑着自行车沿着公路飞驰">
  <defs>
    <clipPath id="sceneClip">
      <rect x="0" y="0" width="1200" height="700" rx="20"/>
    </clipPath>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#6fc3ec"/>
      <stop offset=".5"  stop-color="#b6e4f6"/>
      <stop offset=".85" stop-color="#e8f8f0"/>
    </linearGradient>

    <radialGradient id="sunGlowGrad">
      <stop offset="0"   stop-color="#ffe9a0" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#ffe9a0" stop-opacity=".35"/>
      <stop offset="1"   stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2e5d1"/>
      <stop offset="1" stop-color="#a4d5b8"/>
    </linearGradient>

    <linearGradient id="midHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fcaa8"/>
      <stop offset="1" stop-color="#74b78f"/>
    </linearGradient>

    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#565c6b"/>
      <stop offset="1" stop-color="#2f333c"/>
    </linearGradient>

    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eee7d6"/>
    </linearGradient>

    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4ddca"/>
    </linearGradient>

    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9bb52"/>
      <stop offset="1" stop-color="#ec962b"/>
    </linearGradient>

    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd184"/>
      <stop offset="1" stop-color="#f0a039"/>
    </linearGradient>

    <radialGradient id="vignette" cx=".5" cy=".45" r=".75">
      <stop offset=".55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"   stop-color="#000000" stop-opacity=".22"/>
    </radialGradient>

    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- 云朵 -->
    <g id="cloud">
      <ellipse cx="0"   cy="0"  rx="52" ry="30"/>
      <ellipse cx="-46" cy="10" rx="34" ry="22"/>
      <ellipse cx="46"  cy="8"  rx="36" ry="24"/>
      <rect x="-48" y="-4" width="96" height="36" rx="18"/>
    </g>

    <!-- 远山 -->
    <path id="hillsFar" fill="url(#farHill)"
      d="M0,470 C120,415 240,460 360,436 C480,412 600,458 720,440
         C840,422 960,452 1080,434 C1140,426 1176,452 1200,470
         L1200,560 L0,560 Z"/>

    <!-- 近一点的丘陵 -->
    <path id="hillsMid" fill="url(#midHill)"
      d="M0,545 C100,510 200,528 300,515 C400,502 500,532 600,520
         C700,508 800,538 900,522 C1000,506 1100,532 1200,545
         L1200,560 L0,560 Z"/>

    <!-- 树 -->
    <g id="tree">
      <rect x="-7" y="-52" width="14" height="52" rx="4" fill="#5b9a78"/>
      <circle cx="0"   cy="-88" r="42" fill="#82c19c"/>
      <circle cx="-34" cy="-64" r="30" fill="#79b995"/>
      <circle cx="34"  cy="-66" r="32" fill="#8ac9a4"/>
    </g>

    <g id="treesRow">
      <use href="#tree" transform="translate(150,548) scale(.92)"/>
      <use href="#tree" transform="translate(470,551) scale(1.08)"/>
      <use href="#tree" transform="translate(760,546) scale(.78)"/>
      <use href="#tree" transform="translate(1030,550) scale(1)"/>
    </g>

    <!-- 路面虚线（周期 1200） -->
    <g id="dashRow" fill="#f4f7fa" opacity=".8">
      <rect x="20"  y="0" width="120" height="12" rx="6"/>
      <rect x="320" y="0" width="120" height="12" rx="6"/>
      <rect x="620" y="0" width="120" height="12" rx="6"/>
      <rect x="920" y="0" width="120" height="12" rx="6"/>
    </g>
  </defs>

  <g clip-path="url(#sceneClip)">
    <!-- ============ 天空 ============ -->
    <rect width="1200" height="700" fill="url(#sky)"/>

    <!-- 太阳 -->
    <g transform="translate(980,140)">
      <circle class="glow" r="130" fill="url(#sunGlowGrad)"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="120s" repeatCount="indefinite"/>
        <g stroke="#ffe9a3" stroke-width="7" stroke-linecap="round">
          <line x1="0" y1="-92" x2="0" y2="-112"/>
          <line x1="0" y1="-92" x2="0" y2="-112" transform="rotate(45)"/>
          <line x1="0" y1="-92" x2="0" y2="-112" transform="rotate(90)"/>
          <line x1="0" y1="-92" x2="0" y2="-112" transform="rotate(135)"/>
          <line x1="0" y1="-92" x2="0" y2="-112" transform="rotate(180)"/>
          <line x1="0" y1="-92" x2="0" y2="-112" transform="rotate(225)"/>
          <line x1="0" y1="-92" x2="0" y2="-112" transform="rotate(270)"/>
          <line x1="0" y1="-92" x2="0" y2="-112" transform="rotate(315)"/>
        </g>
      </g>
      <circle r="64" fill="#ffe27a"/>
      <circle r="64" fill="#fff4bd" opacity=".35"/>
    </g>

    <!-- 云朵 -->
    <g transform="translate(0,130)" opacity=".92">
      <g fill="#ffffff">
        <animateTransform attributeName="transform" type="translate"
          from="-320 0" to="1500 0" dur="54s" repeatCount="indefinite"/>
        <use href="#cloud"/>
      </g>
    </g>
    <g transform="translate(0,240) scale(.72)" opacity=".75">
      <g fill="#ffffff">
        <animateTransform attributeName="transform" type="translate"
          from="-300 0" to="1500 0" dur="72s" begin="-30s" repeatCount="indefinite"/>
        <use href="#cloud"/>
      </g>
    </g>
    <g transform="translate(0,196) scale(.5)" opacity=".6">
      <g fill="#ffffff">
        <animateTransform attributeName="transform" type="translate"
          from="-280 0" to="1500 0" dur="44s" begin="-12s" repeatCount="indefinite"/>
        <use href="#cloud"/>
      </g>
    </g>

    <!-- 远处的飞鸟 -->
    <g stroke="#7ba3bb" stroke-width="3" stroke-linecap="round" fill="none" opacity=".6">
      <g>
        <animateTransform attributeName="transform" type="translate"
          from="1150 0" to="-150 0" dur="60s" repeatCount="indefinite"/>
        <path d="M0,210 q10,-9 20,0 q10,-9 20,0"/>
        <path d="M60,182 q8,-7 16,0 q8,-7 16,0"/>
      </g>
    </g>

    <!-- ============ 远山 ============ -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-1200 0" dur="46s" repeatCount="indefinite"/>
      <use href="#hillsFar"/>
      <use href="#hillsFar" x="1200"/>
    </g>

    <!-- ============ 丘陵 + 树 ============ -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-1200 0" dur="14s" repeatCount="indefinite"/>
      <use href="#treesRow"/>
      <use href="#treesRow" x="1200"/>
      <use href="#hillsMid"/>
      <use href="#hillsMid" x="1200"/>
    </g>

    <!-- ============ 公路 ============ -->
    <rect x="0" y="560" width="1200" height="140" fill="url(#road)"/>
    <rect x="0" y="558" width="1200" height="5" fill="#eef3f7" opacity=".45"/>

    <g transform="translate(0,620)">
      <g>
        <animateTransform attributeName="transform" type="translate"
          from="0 0" to="-1200 0" dur="2.65s" repeatCount="indefinite"/>
        <use href="#dashRow"/>
        <use href="#dashRow" x="1200"/>
      </g>
    </g>

    <!-- 车下阴影 -->
    <ellipse cx="600" cy="566" rx="240" ry="13" fill="#000000" opacity=".28" filter="url(#soft)"/>

    <!-- 车尾扬起的尘土 -->
    <g fill="#e9e2d4">
      <circle cx="425" cy="548" r="7" opacity="0">
        <animate attributeName="opacity" values="0;.7;0" dur="1.3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -70 -18" dur="1.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="425" cy="552" r="5" opacity="0">
        <animate attributeName="opacity" values="0;.55;0" dur="1.3s" begin="-.45s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -60 -8" dur="1.3s" begin="-.45s" repeatCount="indefinite"/>
      </circle>
      <circle cx="425" cy="556" r="6" opacity="0">
        <animate attributeName="opacity" values="0;.5;0" dur="1.3s" begin="-.85s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -55 4" dur="1.3s" begin="-.85s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 速度线 -->
    <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
      <line x1="330" y1="300" x2="400" y2="300" opacity=".5">
        <animate attributeName="opacity" values="0;.6;0" dur="1.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -45 0" dur="1.4s" repeatCount="indefinite"/>
      </line>
      <line x1="350" y1="380" x2="410" y2="380" opacity=".35">
        <animate attributeName="opacity" values="0;.45;0" dur="1.4s" begin="-.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -40 0" dur="1.4s" begin="-.6s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- ============ 自行车 + 鹈鹕 ============ -->
    <g transform="translate(600,488)">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 0 -3; 0 0" keyTimes="0;.5;1" dur="1s" repeatCount="indefinite"/>

        <!-- --- 后轮 --- -->
        <g>
          <circle cx="-155" cy="0" r="72" fill="none" stroke="#2c2f3a" stroke-width="9"/>
          <circle cx="-155" cy="0" r="60" fill="none" stroke="#cfd7e3" stroke-width="4"/>
          <g>
            <animateTransform attributeName="transform" type="rotate"
              from="0 -155 0" to="360 -155 0" dur="1s" repeatCount="indefinite"/>
            <g stroke="#b9c3d1" stroke-width="2.5">
              <line x1="-207" y1="0" x2="-103" y2="0"/>
              <line x1="-207" y1="0" x2="-103" y2="0" transform="rotate(36 -155 0)"/>
              <line x1="-207" y1="0" x2="-103" y2="0" transform="rotate(72 -155 0)"/>
              <line x1="-207" y1="0" x2="-103" y2="0" transform="rotate(108 -155 0)"/>
              <line x1="-207" y1="0" x2="-103" y2="0" transform="rotate(144 -155 0)"/>
            </g>
            <circle cx="-155" cy="0" r="6" fill="#8d97a8"/>
          </g>
        </g>

        <!-- --- 前轮 --- -->
        <g>
          <circle cx="150" cy="0" r="72" fill="none" stroke="#2c2f3a" stroke-width="9"/>
          <circle cx="150" cy="0" r="60" fill="none" stroke="#cfd7e3" stroke-width="4"/>
          <g>
            <animateTransform attributeName="transform" type="rotate"
              from="0 150 0" to="360 150 0" dur="1s" repeatCount="indefinite"/>
            <g stroke="#b9c3d1" stroke-width="2.5">
              <line x1="98" y1="0" x2="202" y2="0"/>
              <line x1="98" y1="0" x2="202" y2="0" transform="rotate(36 150 0)"/>
              <line x1="98" y1="0" x2="202" y2="0" transform="rotate(72 150 0)"/>
              <line x1="98" y1="0" x2="202" y2="0" transform="rotate(108 150 0)"/>
              <line x1="98" y1="0" x2="202" y2="0" transform="rotate(144 150 0)"/>
            </g>
            <circle cx="150" cy="0" r="6" fill="#8d97a8"/>
          </g>
        </g>

        <!-- --- 链条 --- -->
        <circle cx="0" cy="26" r="22" fill="none" stroke="#9aa5b5" stroke-width="4"/>
        <circle cx="-155" cy="0" r="11" fill="none" stroke="#9aa5b5" stroke-width="4"/>
        <path d="M-155,-11 L0,4 M-155,11 L0,48" stroke="#9aa5b5" stroke-width="3" fill="none"/>

        <!-- --- 车架 --- -->
        <g fill="none" stroke="#e2574c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-155,0 L-58,-104"/>
          <path d="M-155,0 L0,26"/>
          <path d="M-58,-104 L0,26"/>
          <path d="M0,26 L98,-108"/>
          <path d="M-58,-104 L98,-108"/>
          <path d="M98,-108 C110,-76 128,-38 150,0"/>
        </g>
        <path d="M92,-116 L104,-100" stroke="#c8453c" stroke-width="12" stroke-linecap="round"/>

        <!-- 车把 -->
        <path d="M98,-108 L101,-142" stroke="#3a3f4c" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M74,-152 C92,-158 112,-156 128,-148" stroke="#3a3f4c" stroke-width="8" stroke-linecap="round" fill="none"/>
        <circle cx="130" cy="-147" r="7" fill="#e2574c"/>

        <!-- 车座 -->
        <path d="M-58,-104 L-63,-121" stroke="#3a3f4c" stroke-width="8" stroke-linecap="round"/>
        <path d="M-94,-128 C-86,-139 -50,-142 -37,-133 C-29,-127 -40,-119 -58,-118
                 C-76,-117 -90,-120 -94,-128 Z" fill="#2f3441"/>

        <!-- ================= 鹈鹕 ================= -->

        <!-- 远侧的翅膀（轻轻扇动） -->
        <path d="M-70,-206 C-100,-224 -142,-222 -164,-204 C-140,-198 -114,-188 -84,-184 Z" fill="#e6dfcd">
          <animateTransform attributeName="transform" type="rotate"
            values="0 -70 -206; 7 -70 -206; 0 -70 -206" keyTimes="0;.5;1"
            dur="2.4s" repeatCount="indefinite"/>
        </path>

        <!-- 尾羽 -->
        <path d="M-92,-176 C-118,-186 -144,-192 -162,-190 C-148,-182 -142,-172 -136,-160
                 C-120,-166 -104,-170 -90,-168 Z" fill="#efe8d7"/>

        <!-- 远侧的腿 -->
        <g stroke-linecap="round" fill="none">
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="-13 -38 -146; 13 -38 -146; -13 -38 -146" keyTimes="0;.5;1"
              dur="1s" begin="-.5s" repeatCount="indefinite"/>
            <path d="M-38,-146 L-38,-72" stroke="#d9862f" stroke-width="15"/>
            <g>
              <animateTransform attributeName="transform" type="rotate"
                values="20 -38 -72; -20 -38 -72; 20 -38 -72" keyTimes="0;.5;1"
                dur="1s" begin="-.5s" repeatCount="indefinite"/>
              <path d="M-38,-72 L-36,-2" stroke="#d9862f" stroke-width="12"/>
              <path d="M-36,-2 L-16,6 L-20,15 L-46,12 Z" fill="#d9862f" stroke="none"/>
            </g>
          </g>
        </g>

        <!-- 身体 -->
        <ellipse cx="-30" cy="-196" rx="74" ry="55" fill="url(#body)" transform="rotate(-8 -30 -196)"/>
        <ellipse cx="-24" cy="-176" rx="52" ry="34" fill="#f3eddd" opacity=".85" transform="rotate(-8 -24 -178)"/>

        <!-- 近侧的腿（踩踏板） -->
        <g stroke-linecap="round" fill="none">
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="13 -22 -150; -13 -22 -150; 13 -22 -150" keyTimes="0;.5;1"
              dur="1s" repeatCount="indefinite"/>
            <path d="M-22,-150 L-22,-74" stroke="#ef9b3c" stroke-width="16"/>
            <circle cx="-22" cy="-74" r="8" fill="#ef9b3c" stroke="none"/>
            <g>
              <animateTransform attributeName="transform" type="rotate"
                values="-24 -22 -74; 22 -22 -74; -24 -22 -74" keyTimes="0;.5;1"
                dur="1s" repeatCount="indefinite"/>
              <path d="M-22,-74 L-22,0" stroke="#ef9b3c" stroke-width="13"/>
              <path d="M-22,0 L-2,7 L-7,16 L-35,13 Z" fill="#ef9b3c" stroke="none"/>
            </g>
          </g>
        </g>

        <!-- 近侧的翅膀：伸向车把 -->
        <path d="M-4,-216 C38,-206 92,-186 122,-154 C127,-148 119,-142 112,-148
                 C80,-170 26,-186 -16,-192 Z" fill="url(#wingGrad)"/>
        <path d="M20,-196 C52,-186 84,-170 106,-152" stroke="#ddd5c2" stroke-width="3"
              fill="none" stroke-linecap="round"/>
        <path d="M2,-208 C36,-198 74,-182 100,-164" stroke="#ddd5c2" stroke-width="2.5"
              fill="none" stroke-linecap="round" opacity=".8"/>

        <!-- 脖子 -->
        <path d="M8,-224 C36,-248 48,-268 56,-292" stroke="url(#body)" stroke-width="36"
              fill="none" stroke-linecap="round"/>

        <!-- 头 -->
        <ellipse cx="62" cy="-304" rx="36" ry="32" fill="url(#body)" transform="rotate(-14 62 -304)"/>

        <!-- 头后的羽毛 -->
        <path d="M40,-326 C30,-342 16,-342 8,-332 C20,-332 28,-326 32,-318 Z" fill="#eae3d1"/>
        <path d="M52,-330 C48,-350 34,-356 24,-348" stroke="#eae3d1" stroke-width="6"
              fill="none" stroke-linecap="round"/>

        <!-- 喉囊 -->
        <path d="M84,-302 C92,-262 126,-232 168,-232 C204,-232 226,-252 236,-279
                 C190,-270 132,-282 84,-302 Z" fill="url(#pouch)">
          <animateTransform attributeName="transform" type="rotate"
            values="0 120 -290; 2.2 120 -290; 0 120 -290" keyTimes="0;.5;1"
            dur="2.6s" repeatCount="indefinite"/>
        </path>
        <path d="M116,-252 C140,-240 176,-238 206,-252" stroke="#e08f2a" stroke-width="2.5"
              fill="none" opacity=".45"/>

        <!-- 上喙 -->
        <path d="M86,-318 C140,-314 198,-300 238,-288 C243,-286 242,-279 236,-279
                 C188,-284 130,-295 84,-303 Z" fill="url(#beak)"/>
        <ellipse cx="128" cy="-302" rx="4" ry="2.4" fill="#d98a2a"/>
        <circle cx="236" cy="-283" r="3.6" fill="#e08f2a"/>

        <!-- 眼睛 -->
        <g class="eye">
          <circle cx="72" cy="-314" r="10" fill="#fdfaf2" stroke="#e0d8c5" stroke-width="2"/>
          <circle cx="74" cy="-314" r="5.4" fill="#2b2b33"/>
          <circle cx="76" cy="-316" r="1.8" fill="#ffffff"/>
        </g>

        <!-- --- 曲柄与踏板（在脚之上） --- -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            from="0 0 26" to="360 0 26" dur="1s" repeatCount="indefinite"/>
          <line x1="0" y1="26" x2="0" y2="-4" stroke="#4a5162" stroke-width="7" stroke-linecap="round"/>
          <line x1="0" y1="26" x2="0" y2="56" stroke="#4a5162" stroke-width="7" stroke-linecap="round"/>
          <rect x="-13" y="-11" width="26" height="8" rx="3" fill="#2f3441"/>
          <rect x="-13" y="53" width="26" height="8" rx="3" fill="#2f3441"/>
          <circle cx="0" cy="26" r="7" fill="#6b7484"/>
        </g>
      </g>
    </g>

    <!-- 暗角 -->
    <rect width="1200" height="700" fill="url(#vignette)" pointer-events="none"/>
  </g>
</svg>
</div>
</body>
</html>
