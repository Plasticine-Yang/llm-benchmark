<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pelican Riding a Bicycle — 2D SVG Animation</title>
  <style>
    :root {
      --bg-outer: #0d1f2d;
      --frame-border: rgba(255, 255, 255, 0.14);
      --pill-bg: rgba(15, 29, 44, 0.68);
      --pill-text: #f1f5f9;
      --accent: #2dd4bf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #16324a 0%, #091521 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .stage {
      position: relative;
      width: min(100vw, calc(100vh * 1200 / 720));
      height: min(100vh, calc(100vw * 720 / 1200));
      max-width: 1280px;
      max-height: 768px;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg#scene {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 18px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--frame-border);
      background: #8fd3f4;
      cursor: pointer;
    }

    .controls {
      position: absolute;
      right: 26px;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--pill-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .controls:hover {
      opacity: 1;
    }

    .controls button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--pill-text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease, transform 0.12s ease;
    }

    .controls button:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .controls button:active {
      transform: scale(0.95);
    }

    .controls button.active {
      background: var(--accent);
      color: #082f2c;
    }

    .divider {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg id="scene" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2D animated SVG of a pelican riding a turquoise coastal cruiser bicycle">
      <defs>
        <!-- Sky & Sun -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#60b6e8" />
          <stop offset="52%" stop-color="#a8ddf6" />
          <stop offset="84%" stop-color="#e4f3f6" />
          <stop offset="100%" stop-color="#fdecc8" />
        </linearGradient>

        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fffbeb" stop-opacity="1" />
          <stop offset="35%" stop-color="#fef08a" stop-opacity="0.7" />
          <stop offset="100%" stop-color="#fde047" stop-opacity="0" />
        </radialGradient>

        <!-- Ocean & Sand -->
        <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1982a8" />
          <stop offset="55%" stop-color="#22a6c4" />
          <stop offset="100%" stop-color="#5ccad8" />
        </linearGradient>

        <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f6dfae" />
          <stop offset="100%" stop-color="#e5c589" />
        </linearGradient>

        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5b6673" />
          <stop offset="45%" stop-color="#48525e" />
          <stop offset="100%" stop-color="#37404a" />
        </linearGradient>

        <linearGradient id="vergeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#76a868" />
          <stop offset="100%" stop-color="#537d4b" />
        </linearGradient>

        <!-- Bike Frame & Chrome -->
        <linearGradient id="frameTeal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2dd4bf" />
          <stop offset="48%" stop-color="#0d9488" />
          <stop offset="100%" stop-color="#0f766e" />
        </linearGradient>

        <linearGradient id="frameDark" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0f766e" />
          <stop offset="100%" stop-color="#115e59" />
        </linearGradient>

        <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="45%" stop-color="#cbd5e1" />
          <stop offset="100%" stop-color="#64748b" />

        <linearGradient id="leatherGrad" x1="0" y1="0" x2="0" y2="1">

          <stop offset="60%" stop-color="#92400e" />
          <stop offset="100%" stop-color="#6b2e07" />
        </linearGradient>

        <linearGradient id="wickerGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e7b678" />
          <stop offset="100%" stop-color="#b87a3d" />
        </linearGradient>

        <!-- Pelican Plumage & Bill -->
        <linearGradient id="plumageBody" x1="0.2" y1="0" x2="0.8" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="62%" stop-color="#f7f4ec" />
          <stop offset="100%" stop-color="#d8e0e8" />
        </linearGradient>

        <linearGradient id="plumageWing" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="55%" stop-color="#f1ede3" />
          <stop offset="100%" stop-color="#d5dde6" />
        </linearGradient>

        <linearGradient id="upperBillGrad" x1="0" y1="0" x2="1" y2="0.4">
          <stop offset="0%" stop-color="#fcd34d" />
          <stop offset="55%" stop-color="#f59e0b" />
          <stop offset="92%" stop-color="#fb923c" />
          <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>

        <linearGradient id="pouchGrad" x1="0.2" y1="0" x2="0.4" y2="1">
          <stop offset="0%" stop-color="#fdba74" />
          <stop offset="52%" stop-color="#fb923c" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <linearGradient id="legOrange" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fb923c" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <linearGradient id="legFarOrange" x1="0" y1="0" x2="1" y2="0">

        <linearGradient id="fishSilver" x1="0" y1="0" x2="0" y2="1">

        <!-- Seamless Reusable Parallax Tiles -->

            <path d="M 850 132 C 850 116 866 106 884 110 C 896 90 924 90 938 108 C 958 106 972 118 970 132 Z" />

          </g>

        <g id="clouds-near-tile">
          <g fill="#ffffff" opacity="0.82">
            <path d="M 240 164 C 240 142 262 128 286 134 C 300 104 344 102 364 128 C 392 124 416 140 412 164 Z" />
            <path d="M 670 118 C 670 98 690 86 710 92 C 724 64 766 64 784 88 C 808 86 830 100 826 118 Z" />
            <path d="M 1015 162 C 1015 144 1034 132 1054 137 C 1066 112 1102 112 1118 133 C 1140 130 1158 144 1155 162 Z" />
          </g>

        <g id="sailboats-tile">

          <!-- Tiny sailboat 1 -->

          <!-- Tiny sailboat 2 -->
          <g transform="translate(880, 398) scale(0.85)">
            <path d="M -16 0 L 16 0 L 11 6 L -12 6 Z" fill="#334155" />
            <path d="M 0 0 L 0 -28 L 13 -4 Z" fill="#fef3c7" />
            <path d="M -2 -3 L -2 -22 L -11 -4 Z" fill="#fca5a5" />
          </g>
          <!-- Ocean shimmer sparkles -->
          <g stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" opacity="0.65">

            <line x1="210" y1="418" x2="256" y2="418" />
            <line x1="470" y1="406" x2="520" y2="406" />
            <line x1="630" y1="422" x2="675" y2="422" />
            <line x1="780" y1="404" x2="824" y2="404" />
            <line x1="1030" y1="416" x2="1084" y2="416" />
          </g>
        </g>

        <g id="midground-tile">

          <path d="M 0 442 Q 100 434 200 443 Q 300 451 400 441 Q 500 433 600 442 Q 700 450 800 441 Q 900 434 1000 443 Q 1100 450 1200 442 Q 1300 434 1400 442 Q 1500 450 1600 442 L 1600 451 L 0 451 Z" fill="#ffffff" opacity="0.72" />
          <!-- Distant coastal dune bushes & palm clusters -->

            <g fill="#5b9a6f">

              <path d="M 8 -72 Q -14 -108 -34 -94 Q -10 -88 8 -72 Z" />
              <path d="M 8 -72 Q 38 -98 54 -76 Q 28 -76 8 -72 Z" />
              <path d="M 8 -72 Q 48 -72 56 -48 Q 30 -60 8 -72 Z" />
            </g>
          </g>
          <g transform="translate(960, 492) scale(0.92)">
            <path d="M 6 24 Q 4 -24 -8 -74" stroke="#9a7b56" stroke-width="7" fill="none" stroke-linecap="round" />
            <g fill="#5b9a6f">
              <path d="M -8 -74 Q -42 -88 -58 -64 Q -28 -68 -8 -74 Z" />
              <path d="M -8 -74 Q -18 -110 -38 -96 Q -14 -90 -8 -74 Z" />
              <path d="M -8 -74 Q 26 -98 44 -76 Q 16 -76 -8 -74 Z" />
              <path d="M -8 -74 Q 34 -70 42 -44 Q 16 -58 -8 -74 Z" />
            </g>
          </g>
          <!-- Boardwalk wooden railing posts & horizontal rail -->
          <g fill="#c9a579" stroke="#a68156" stroke-width="1.5">
            <rect x="0" y="502" width="1600" height="6" />
            <rect x="0" y="518" width="1600" height="5" />
            <rect x="40" y="492" width="8" height="48" rx="2" />
            <rect x="200" y="492" width="8" height="48" rx="2" />
            <rect x="360" y="492" width="8" height="48" rx="2" />
            <rect x="520" y="492" width="8" height="48" rx="2" />
            <rect x="680" y="492" width="8" height="48" rx="2" />
            <rect x="840" y="492" width="8" height="48" rx="2" />
            <rect x="1000" y="492" width="8" height="48" rx="2" />
            <rect x="1160" y="492" width="8" height="48" rx="2" />
            <rect x="1320" y="492" width="8" height="48" rx="2" />
            <rect x="1480" y="492" width="8" height="48" rx="2" />
          </g>
          <!-- Sea oat grass tufts along boardwalk -->
          <g stroke="#7ca56a" stroke-width="2.5" stroke-linecap="round" fill="none">
            <path d="M 90 540 Q 82 522 72 512 M 92 540 Q 92 518 96 508 M 94 540 Q 104 522 112 516" />
            <path d="M 420 540 Q 412 522 404 514 M 422 540 Q 424 520 428 509 M 424 540 Q 434 524 442 516" />
            <path d="M 750 540 Q 742 522 732 512 M 752 540 Q 752 518 756 508 M 754 540 Q 764 522 772 516" />
            <path d="M 1120 540 Q 1112 522 1104 514 M 1122 540 Q 1124 520 1128 509 M 1124 540 Q 1134 524 1142 516" />
            <path d="M 1410 540 Q 1402 522 1392 512 M 1412 540 Q 1412 518 1416 508 M 1414 540 Q 1424 522 1432 516" />
          </g>
        </g>

        <g id="road-back-tile">
          <!-- Subtle asphalt aggregate & top shoulder stripe -->
          <line x1="0" y1="556" x2="1200" y2="556" stroke="#e2e8f0" stroke-width="3" opacity="0.45" />
          <g fill="#334155" opacity="0.45">
            <circle cx="84" cy="566" r="2" /><circle cx="195" cy="572" r="1.5" />
            <circle cx="342" cy="564" r="2" /><circle cx="488" cy="574" r="1.8" />

            <circle cx="945" cy="565" r="2.1" /><circle cx="1110" cy="571" r="1.7" />

        </g>

        <g id="road-front-tile">
          <!-- Bike lane center dashed stripes (period 240 -> 5 dashes per 1200 tile) -->
          <g fill="#fde68a" opacity="0.88">
            <rect x="30" y="616" width="110" height="8" rx="4" />
            <rect x="270" y="616" width="110" height="8" rx="4" />
            <rect x="510" y="616" width="110" height="8" rx="4" />
            <rect x="750" y="616" width="110" height="8" rx="4" />
            <rect x="990" y="616" width="110" height="8" rx="4" />
          </g>
          <!-- Foreground pebbles & crack lines -->
          <g fill="#262f38" opacity="0.5">
            <circle cx="120" cy="596" r="2.2" /><circle cx="238" cy="645" r="2" />
            <circle cx="410" cy="600" r="1.8" /><circle cx="576" cy="650" r="2.3" />
            <circle cx="712" cy="595" r="2" /><circle cx="888" cy="644" r="2.2" />

            <path d="M 790 668 L 798 653 L 804 668 Z" />
            <path d="M 1050 668 L 1058 654 L 1064 668 Z" />
          </g>
        </g>

        <!-- Reusable Bicycle Wheel Spokes + Reflector Template (centered at 0,0, rim inner r=74) -->
        <g id="wheel-spokes-template">
          <g stroke="#cbd5e1" stroke-width="1.5" opacity="0.88">
            <line x1="-7" y1="6" x2="73" y2="10" />
            <line x1="7" y1="-6" x2="-73" y2="-10" />
            <line x1="-9" y1="0" x2="64" y2="-38" />

            <line x1="6" y1="7" x2="-36" y2="65" />

            <line x1="0" y1="9" x2="0" y2="74" />

            <line x1="-6" y1="7" x2="38" y2="64" />

            <line x1="-9" y1="0" x2="65" y2="36" />

            <line x1="-7" y1="-6" x2="52" y2="-52" />

        <g id="wheel-tire-template">
          <!-- Gumwall inner ring -->

      <!-- ================= LAYER 1: SKY & SUN ================= -->
      <rect x="0" y="0" width="1200" height="410" fill="url(#skyGrad)" />

      <!-- Sun -->

      <!-- Drifting Clouds -->

        <use href="#clouds-far-tile" x="0" />
        <use href="#clouds-far-tile" x="1200" />

      <g id="clouds-near-track">
        <use href="#clouds-near-tile" x="0" />
        <use href="#clouds-near-tile" x="1200" />
      </g>

      <!-- Tiny distant gulls -->
      <g id="distant-gulls" stroke="#3b6e8c" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65">
        <path id="gull-1" d="M 940 120 Q 948 112 955 120 Q 962 112 970 120" />
        <path id="gull-2" d="M 985 142 Q 991 136 996 142 Q 1001 136 1007 142" />

      <!-- ================= LAYER 2: OCEAN & SAILBOATS ================= -->
      <rect x="0" y="384" width="1200" height="64" fill="url(#oceanGrad)" />
      <g id="sailboats-track">
        <use href="#sailboats-tile" x="0" />
        <use href="#sailboats-tile" x="1200" />

      <!-- ================= LAYER 3: BEACH & BOARDWALK MIDGROUND ================= -->
      <rect x="0" y="442" width="1200" height="98" fill="url(#sandGrad)" />
      <g id="midground-track">
        <use href="#midground-tile" x="0" />
        <use href="#midground-tile" x="1600" />
      </g>

      <!-- ================= LAYER 4: COASTAL ROAD & CONTACT SHADOW ================= -->
      <!-- Curb border -->
      <rect x="0" y="536" width="1200" height="6" fill="#d6cbb8" />
      <rect x="0" y="542" width="1200" height="128" fill="url(#roadGrad)" />
      <g id="road-back-track">
        <use href="#road-back-tile" x="0" />
        <use href="#road-back-tile" x="1200" />
      </g>
      <rect x="0" y="666" width="1200" height="54" fill="url(#vergeGrad)" />

      <!-- Ground contact shadow directly below bicycle -->
      <ellipse id="bike-shadow" cx="575" cy="583" rx="285" ry="11" fill="#18222d" opacity="0.42" />

      <!-- ================= LAYER 5: FAR SIDE OF BIKE & PELICAN ================= -->
      <!-- Far handlebar & grip -->
      <path d="M 718 258 C 706 248 692 246 678 248" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
      <path d="M 692 247 L 674 248" fill="none" stroke="#78350f" stroke-width="10" stroke-linecap="round" />

      <!-- Far wing (behind neck/stem, reaching to far grip) -->
      <g id="far-wing-group">

      </g>

      <!-- Far crank arm & far pedal -->
      <line id="far-crank" x1="534" y1="500" x2="500" y2="518" stroke="#64748b" stroke-width="7" stroke-linecap="round" />

        btnBell: document.getElementById("btn-bell")
      };

      // Helpers
      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }

      // 2-Link Inverse Kinematics solver
      // bendDir = -1 bends knee forward (+x for downward leg); +1 bends elbow down (+y for forward wing)
      function solveIK(hip, ankle, L1, L2, bendDir) {
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const dist = clamp(Math.hypot(dx, dy), Math.abs(L1 - L2) + 1.5, L1 + L2 - 1.5);
        const base = Math.atan2(dy, dx);
        const cosAlpha = clamp((L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist), -1, 1);
        const alpha = Math.acos(cosAlpha);
        const jointAngle = base + bendDir * alpha;
        return {
          x: hip.x + L1 * Math.cos(jointAngle),
          y: hip.y + L1 * Math.sin(jointAngle)
        };
      }

      function setLine(el, p1, p2) {
        el.setAttribute("x1", p1.x.toFixed(2));
        el.setAttribute("y1", p1.y.toFixed(2));
        el.setAttribute("x2", p2.x.toFixed(2));
        el.setAttribute("y2", p2.y.toFixed(2));
      }

      function setPathLine(el, p1, p2) {
        el.setAttribute("d", `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} L ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`);
      }

      function updateLeg(phase, hip, thighCuffEl, thighOutlineEl, upperEl, lowerEl, footEl, crankEl, crankOutlineEl, pedalEl) {
        const px = BB.x + L_CRANK * Math.cos(phase);
        const py = BB.y + L_CRANK * Math.sin(phase);

        // Update crank arm & pedal
        setLine(crankEl, BB, { x: px, y: py });
        if (crankOutlineEl) setLine(crankOutlineEl, BB, { x: px, y: py });

        const pedalTilt = 0.14 * Math.sin(phase); // +/- ~8 deg natural ankle flexion
        const pedalDeg = (pedalTilt * 180) / Math.PI;
        pedalEl.setAttribute("transform", `translate(${px.toFixed(2)}, ${py.toFixed(2)}) rotate(${pedalDeg.toFixed(2)})`);

        // Ankle rests on pedal top surface slightly behind axle
        const cosT = Math.cos(pedalTilt);
        const sinT = Math.sin(pedalTilt);
        const localAx = -4;
        const localAy = -8;
        const ankle = {
          x: px + localAx * cosT - localAy * sinT,
          y: py + localAx * sinT + localAy * cosT
        };

        // Knee bends forward (-1 relative to downward Hip->Ankle vector)
        const knee = solveIK(hip, ankle, L_THIGH, L_SHIN, -1);

        // Feathered upper thigh cuff (~36% of thigh)
        const cuffEnd = {
          x: hip.x + (knee.x - hip.x) * 0.38,
          y: hip.y + (knee.y - hip.y) * 0.38
        };
        setPathLine(thighCuffEl, hip, cuffEnd);
        if (thighOutlineEl) setPathLine(thighOutlineEl, hip, cuffEnd);

        setPathLine(upperEl, hip, knee);
        setPathLine(lowerEl, knee, ankle);

        footEl.setAttribute("transform", `translate(${ankle.x.toFixed(2)}, ${ankle.y.toFixed(2)}) rotate(${pedalDeg.toFixed(2)})`);
      }

      function render() {
        const wheelAngleRad = theta * GEAR_RATIO;
        const wheelDeg = (wheelAngleRad * 180) / Math.PI;
        const crankDeg = (theta * 180) / Math.PI;

        // 1. Parallax backgrounds
        const farCloudOff = (distance * 0.045 + elapsed * 7) % 1200;
        const nearCloudOff = (distance * 0.085 + elapsed * 13) % 1200;
        const sailOff = (distance * 0.14 + elapsed * 4) % 1200;
        const midOff = (distance * 0.45) % 1600;
        const roadOff = distance % 1200;

        els.cloudsFar.setAttribute("transform", `translate(${(-farCloudOff).toFixed(2)}, 0)`);
        els.cloudsNear.setAttribute("transform", `translate(${(-nearCloudOff).toFixed(2)}, 0)`);
        els.sailboats.setAttribute("transform", `translate(${(-sailOff).toFixed(2)}, 0)`);
        els.midground.setAttribute("transform", `translate(${(-midOff).toFixed(2)}, 0)`);
        els.roadBack.setAttribute("transform", `translate(${(-roadOff).toFixed(2)}, 0)`);
        els.roadFront.setAttribute("transform", `translate(${(-roadOff).toFixed(2)}, 0)`);

        // Distant gulls gentle wing flap
        const g1 = Math.sin(elapsed * 4.2) * 4;
        const g2 = Math.sin(elapsed * 4.8 + 1.4) * 3.5;
        els.gull1.setAttribute("d", `M 940 ${(120 + g1 * 0.3).toFixed(1)} Q 948 ${(112 - g1).toFixed(1)} 955 120 Q 962 ${(112 - g1).toFixed(1)} 970 ${(120 + g1 * 0.3).toFixed(1)}`);
        els.gull2.setAttribute("d", `M 985 ${(142 + g2 * 0.3).toFixed(1)} Q 991 ${(136 - g2).toFixed(1)} 996 142 Q 1001 ${(136 - g2).toFixed(1)} 1007 ${(142 + g2 * 0.3).toFixed(1)}`);

        // Wind breeze wisps sweeping past
        const w1 = ((elapsed * 320) % 1350);
        const w2 = ((elapsed * 370 + 480) % 1350);
        const w3 = ((elapsed * 290 + 910) % 1350);
        els.wind1.setAttribute("transform", `translate(${(340 - w1).toFixed(1)}, 0)`);
        els.wind2.setAttribute("transform", `translate(${(920 - w2).toFixed(1)}, 0)`);
        els.wind3.setAttribute("transform", `translate(${(380 - w3).toFixed(1)}, 0)`);

        // 2. Spinning wheels, chainring, chain
        els.rearSpokes.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        els.frontSpokes.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
        els.chainringSpin.setAttribute("transform", `rotate(${crankDeg.toFixed(2)})`);
        // Chain links travel clockwise along top run (negative dashoffset moves forward along path)
        const chainOffset = -(theta * 28) % 9;
        els.chainLinks.setAttribute("stroke-dashoffset", chainOffset.toFixed(2));

        // 3. Organic rider bounce & secondary motion
        const torsoDy = 2.6 * Math.sin(2 * theta - 0.5);
        const torsoDx = 0.9 * Math.cos(theta);
        const torsoTilt = 1.0 * Math.cos(theta - 0.4);

        const headDy = 1.1 * Math.sin(2 * theta - 0.15);
        const headDx = 0.5 * Math.cos(theta);
        const headTilt = 0.7 * Math.sin(theta - 0.7);

        // Shadow gently breathes with cadence
        const shadowRx = 285 + 3 * Math.sin(2 * theta - 0.5);
        els.bikeShadow.setAttribute("rx", shadowRx.toFixed(1));

        // Basket fish cheerful bobbing
        const fishBob = 1.5 * Math.sin(2 * theta - 0.9);
        els.basketFish.setAttribute("transform", `translate(0, ${fishBob.toFixed(2)})`);

        // Bell chime pulse fade
        if (bellPulse > 0) {
          const chimeScale = 1 + (1 - bellPulse) * 0.45;
          els.bellChimes.setAttribute("opacity", bellPulse.toFixed(2));
          els.bellChimes.setAttribute("transform", `scale(${chimeScale.toFixed(2)})`);
        } else {
          els.bellChimes.setAttribute("opacity", "0");
        }

        // 4. Pelican Torso, Tail, Crest, Neck, Head & Pouch
        els.pelicanTorso.setAttribute("transform", `translate(${torsoDx.toFixed(2)}, ${torsoDy.toFixed(2)}) rotate(${torsoTilt.toFixed(2)}, 490, 290)`);

        const tailFlutter = Math.sin(elapsed * 8.5) * 2.4 + torsoTilt * 0.6;
        els.pelicanTail.setAttribute("transform", `translate(${torsoDx.toFixed(2)}, ${torsoDy.toFixed(2)}) rotate(${tailFlutter.toFixed(2)}, 430, 298)`);

        // Dynamic S-neck bridging moving collar & stabilized head
        const neckTopBack = { x: 525 + headDx, y: 148 + headDy };
        const neckTopFront = { x: 558 + headDx, y: 172 + headDy };
        const collarBack = { x: 505 + torsoDx, y: 232 + torsoDy };
        const collarFront = { x: 554 + torsoDx, y: 246 + torsoDy };
        els.pelicanNeck.setAttribute(
          "d",
          `M ${collarBack.x.toFixed(2)} ${collarBack.y.toFixed(2)} ` +
          `C ${(498 + torsoDx * 0.5).toFixed(2)} ${(192 + torsoDy * 0.5).toFixed(2)} ` +
          `${(512 + headDx * 0.6).toFixed(2)} ${(166 + headDy * 0.7).toFixed(2)} ` +
          `${neckTopBack.x.toFixed(2)} ${neckTopBack.y.toFixed(2)} ` +
          `L ${neckTopFront.x.toFixed(2)} ${neckTopFront.y.toFixed(2)} ` +
          `C ${(544 + headDx * 0.6).toFixed(2)} ${(190 + headDy * 0.7).toFixed(2)} ` +
          `${(534 + torsoDx * 0.5).toFixed(2)} ${(210 + torsoDy * 0.5).toFixed(2)} ` +
          `${collarFront.x.toFixed(2)} ${collarFront.y.toFixed(2)} Z`
        );

        // Head group
        els.pelicanHead.setAttribute("transform", `translate(${headDx.toFixed(2)}, ${headDy.toFixed(2)}) rotate(${headTilt.toFixed(2)}, 556, 152)`);

        // Crest wind flutter
        const crestWave = Math.sin(elapsed * 9.5) * 3.5;
        els.pelicanCrest.setAttribute("transform", `rotate(${crestWave.toFixed(2)}, 524, 138)`);

        // Blinking eyelid
        els.pelicanEyelid.setAttribute("opacity", blinkTimer > 0 ? "1" : "0");

        // Squawk / bill opening + gular pouch harmonic jiggle
        const squawkOpen = squawkTimer > 0 ? Math.sin((squawkTimer / 0.34) * Math.PI) * 8.5 : 0;
        const pouchWobble = 4.2 * Math.sin(2 * theta - 1.1) + squawkOpen * 0.7;

        const lowerTipY = 170 + squawkOpen;
        els.pelicanLowerBill.setAttribute(
          "d",
          `M 584 154 L 739 ${lowerTipY.toFixed(2)} L 735 ${(lowerTipY + 5).toFixed(2)} L 582 162 Z`
        );

        const pouchBotY = 218 + pouchWobble;
        const pouchMidY = 222 + pouchWobble * 1.15;
        els.pelicanPouch.setAttribute(
          "d",
          `M 560 174 C 574 202 612 ${pouchMidY.toFixed(2)} 658 ${pouchBotY.toFixed(2)} ` +
          `C 698 ${(214 + pouchWobble * 0.8).toFixed(2)} 724 ${(192 + squawkOpen * 0.6).toFixed(2)} 738 ${(lowerTipY + 2).toFixed(2)} L 586 154 Z`
        );
        els.pelicanPouchHighlight.setAttribute(
          "d",
          `M 594 ${(186 + pouchWobble * 0.5).toFixed(2)} Q 642 ${(208 + pouchWobble).toFixed(2)} 696 ${(196 + pouchWobble * 0.6).toFixed(2)}`
        );

        // 5. Legs (180 deg out of phase!)
        const nearHip = { x: 478 + torsoDx, y: 308 + torsoDy };
        const farHip = { x: 490 + torsoDx, y: 304 + torsoDy };

        updateLeg(
          theta + Math.PI,
          farHip,
          els.farThighCuff,
          null,
          els.farLegUpper,
          els.farLegLower,
          els.farFoot,
          els.farCrank,
          null,
          els.farPedal
        );

        updateLeg(
          theta,
          nearHip,
          els.nearThighCuff,
          els.nearThighOutline,
          els.nearLegUpper,
          els.nearLegLower,
          els.nearFoot,
          els.nearCrank,
          els.nearCrankOutline,
          els.nearPedal
        );

        // 6. Wings (articulated IK from moving shoulder to handlebar grips!)
        const nearShoulder = { x: 500 + torsoDx, y: 248 + torsoDy };
        const nearElbow = solveIK(nearShoulder, NEAR_GRIP, 88, 92, +1);
        const nearWrist = {
          x: nearElbow.x + (NEAR_GRIP.x - nearElbow.x) * 0.58,
          y: nearElbow.y + (NEAR_GRIP.y - nearElbow.y) * 0.58
        };

        els.nearWingCovert.setAttribute(
          "d",
          `M ${nearShoulder.x.toFixed(1)} ${(nearShoulder.y - 4).toFixed(1)} ` +
          `C ${(nearShoulder.x + 28).toFixed(1)} ${(nearShoulder.y - 12).toFixed(1)} ` +
          `${(nearElbow.x - 10).toFixed(1)} ${(nearElbow.y - 24).toFixed(1)} ` +
          `${nearElbow.x.toFixed(1)} ${(nearElbow.y - 6).toFixed(1)} ` +
          `C ${(nearElbow.x - 18).toFixed(1)} ${(nearElbow.y + 18).toFixed(1)} ` +
          `${(nearShoulder.x + 20).toFixed(1)} ${(nearShoulder.y + 52).toFixed(1)} ` +
          `${(nearShoulder.x - 4).toFixed(1)} ${(nearShoulder.y + 28).toFixed(1)} Z`
        );

        els.nearWingSecondary.setAttribute(
          "d",
          `M ${(nearElbow.x - 18).toFixed(1)} ${(nearElbow.y - 14).toFixed(1)} ` +
          `Q ${nearWrist.x.toFixed(1)} ${(nearWrist.y - 4).toFixed(1)} ` +
          `${(nearWrist.x + 18).toFixed(1)} ${(nearWrist.y - 10).toFixed(1)} ` +
          `Q ${(nearWrist.x - 4).toFixed(1)} ${(nearWrist.y + 16).toFixed(1)} ` +
          `${(nearElbow.x - 6).toFixed(1)} ${(nearElbow.y + 6).toFixed(1)} Z`
        );

        els.nearWingPrimary.setAttribute(
          "d",
          `M ${(nearWrist.x - 14).toFixed(1)} ${(nearWrist.y - 6).toFixed(1)} ` +
          `Q ${(NEAR_GRIP.x - 18).toFixed(1)} ${(NEAR_GRIP.y - 10).toFixed(1)} ` +
          `${(NEAR_GRIP.x + 6).toFixed(1)} ${(NEAR_GRIP.y - 3).toFixed(1)} ` +
          `Q ${(NEAR_GRIP.x + 8).toFixed(1)} ${(NEAR_GRIP.y + 5).toFixed(1)} ` +
          `${(NEAR_GRIP.x - 6).toFixed(1)} ${(NEAR_GRIP.y + 9).toFixed(1)} ` +
          `Q ${(nearWrist.x + 6).toFixed(1)} ${(nearWrist.y + 10).toFixed(1)} ` +
          `${(nearWrist.x - 16).toFixed(1)} ${(nearWrist.y + 6).toFixed(1)} Z`
        );

        els.nearWingTips.setAttribute(
          "d",
          `M ${(NEAR_GRIP.x - 12).toFixed(1)} ${(NEAR_GRIP.y - 3).toFixed(1)} ` +
          `Q ${(NEAR_GRIP.x + 3).toFixed(1)} ${(NEAR_GRIP.y - 6).toFixed(1)} ${(NEAR_GRIP.x + 8).toFixed(1)} ${NEAR_GRIP.y.toFixed(1)} ` +
          `M ${(NEAR_GRIP.x - 14).toFixed(1)} ${(NEAR_GRIP.y + 3).toFixed(1)} ` +
          `Q ${NEAR_GRIP.x.toFixed(1)} ${(NEAR_GRIP.y + 2).toFixed(1)} ${(NEAR_GRIP.x + 4).toFixed(1)} ${(NEAR_GRIP.y + 6).toFixed(1)}`
        );

        // Far wing reaching to far handlebar grip
        const farShoulder = { x: 534 + torsoDx, y: 238 + torsoDy };
        const farElbow = solveIK(farShoulder, FAR_GRIP, 78, 82, +1);
        els.farWingShape.setAttribute(
          "d",
          `M ${farShoulder.x.toFixed(1)} ${farShoulder.y.toFixed(1)} ` +
          `Q ${farElbow.x.toFixed(1)} ${farElbow.y.toFixed(1)} ${(FAR_GRIP.x - 2).toFixed(1)} ${FAR_GRIP.y.toFixed(1)} ` +
          `Q ${(farElbow.x + 8).toFixed(1)} ${(farElbow.y - 24).toFixed(1)} ${farShoulder.x.toFixed(1)} ${farShoulder.y.toFixed(1)} Z`
        );
      }

      function triggerBellAndSquawk() {
        bellPulse = 1.0;
        squawkTimer = 0.34;
      }

      function tick(now) {
        if (lastTime === null) lastTime = now;
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        if (playing) {
          const omega = speeds[speedMode].omega;
          const dTheta = omega * dt;
          theta += dTheta;
          distance += R_WHEEL * GEAR_RATIO * dTheta;
          elapsed += dt;

          // Periodic eye blink
          if (elapsed >= nextBlinkAt) {
            blinkTimer = 0.13;
            nextBlinkAt = elapsed + 3.2 + Math.random() * 2.2;
          }
          if (blinkTimer > 0) blinkTimer = Math.max(0, blinkTimer - dt);

          // Periodic cheerful bill clap
          if (elapsed >= nextSquawkAt) {
            squawkTimer = 0.34;
            nextSquawkAt = elapsed + 6.5 + Math.random() * 3.5;
          }
          if (squawkTimer > 0) squawkTimer = Math.max(0, squawkTimer - dt);
          if (bellPulse > 0) bellPulse = Math.max(0, bellPulse - dt * 1.4);

          render();
        }
        requestAnimationFrame(tick);
      }

      // Controls
      els.btnPlay.addEventListener("click", () => {
        playing = !playing;
        els.btnPlay.textContent = playing ? "Pause" : "Play";
        els.btnPlay.classList.toggle("active", playing);
        if (playing) lastTime = performance.now();
      });

      els.btnSpeed.addEventListener("click", () => {
        speedMode = (speedMode + 1) % speeds.length;
        els.btnSpeed.textContent = speeds[speedMode].label;
      });

      els.btnBell.addEventListener("click", () => {
        triggerBellAndSquawk();
        if (!playing) render();
      });

      els.scene.addEventListener("click", () => {
        triggerBellAndSquawk();
        if (!playing) render();
      });

      // Respect reduced motion preference on initial load
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        playing = false;
        els.btnPlay.textContent = "Play";
        els.btnPlay.classList.remove("active");
      }

      // Initial mathematically exact frame
      render();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
