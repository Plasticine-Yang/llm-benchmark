<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='14' cy='13' r='7' fill='white'/><path d='M19 13 L28 15 L19 17 Z' fill='%23FF8C42'/><circle cx='10' cy='25' r='4' fill='none' stroke='%232C3E50' stroke-width='2'/><circle cx='24' cy='25' r='4' fill='none' stroke='%232C3E50' stroke-width='2'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #6BB6E0 0%, #8FD0E8 40%, #B8E6F0 70%, #D4F1F4 100%);
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
    gap: 6px;
  }
  h1 {
    color: #1A3A5C;
    font-size: clamp(22px, 4.5vw, 36px);
    letter-spacing: 4px;
    font-weight: 800;
    text-shadow: 0 2px 8px rgba(255,255,255,0.6);
  }
  .subtitle {
    color: #3A6B8C;
    font-size: clamp(12px, 2vw, 16px);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .scene {
    width: min(94vw, 920px);
    aspect-ratio: 900 / 560;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(26, 58, 92, 0.25), 0 4px 16px rgba(26, 58, 92, 0.12);
  }
  svg { width: 100%; height: 100%; display: block; }

  /* ===== 轮子旋转 ===== */
  @keyframes wheelSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .wheel-spokes {
    transform-box: fill-box;
    transform-origin: center;
    animation: wheelSpin 0.75s linear infinite;
  }

  /* ===== 曲柄旋转 ===== */
  .crank-group {
    transform-box: fill-box;
    transform-origin: center;
    animation: wheelSpin 0.75s linear infinite;
  }
  .pedal {
    transform-box: fill-box;
    transform-origin: center;
    animation: wheelSpin 0.75s linear infinite reverse;
  }

  /* ===== 整车颠簸 ===== */
  @keyframes riderBounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  .rider {
    animation: riderBounce 0.375s ease-in-out infinite;
  }

  /* ===== 翅膀扇动 ===== */
  @keyframes wingFlap {
    0%, 100% { transform: rotate(0deg); }
    40%      { transform: rotate(-18deg); }
    70%      { transform: rotate(-8deg); }
  }
  .wing {
    transform-box: fill-box;
    transform-origin: right center;
    animation: wingFlap 0.6s ease-in-out infinite;
  }

  /* ===== 头部点动 ===== */
  @keyframes headBob {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    50%      { transform: rotate(2.5deg) translateY(-2px); }
  }
  .pelican-head {
    transform-box: fill-box;
    transform-origin: 15% 85%;
    animation: headBob 0.375s ease-in-out infinite;
  }

  /* ===== 喙开合 ===== */
  @keyframes beakOpen {
    0%, 65%, 100% { transform: rotate(0deg); }
    78%           { transform: rotate(10deg); }
    88%           { transform: rotate(6deg); }
  }
  .lower-beak {
    transform-box: fill-box;
    transform-origin: left top;
    animation: beakOpen 2.4s ease-in-out infinite;
  }

  /* ===== 腿踩踏 ===== */
  @keyframes legA {
    0%   { transform: rotate(52deg); }
    50%  { transform: rotate(88deg); }
    100% { transform: rotate(52deg); }
  }
  @keyframes legB {
    0%   { transform: rotate(88deg); }
    50%  { transform: rotate(52deg); }
    100% { transform: rotate(88deg); }
  }
  .leg-a {
    transform-box: fill-box;
    transform-origin: top center;
    animation: legA 0.75s ease-in-out infinite;
  }
  .leg-b {
    transform-box: fill-box;
    transform-origin: top center;
    animation: legB 0.75s ease-in-out infinite;
  }

  /* ===== 云朵移动 ===== */
  @keyframes cloudDrift {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }
  .cloud-layer-1 { animation: cloudDrift 32s linear infinite; }
  .cloud-layer-2 { animation: cloudDrift 48s linear infinite; }
  .cloud-layer-3 { animation: cloudDrift 26s linear infinite; }

  /* ===== 地面滚动 ===== */
  @keyframes groundScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-200px); }
  }
  .ground-scroll {
    animation: groundScroll 0.45s linear infinite;
  }

  /* ===== 速度线 ===== */
  @keyframes dash {
    0%   { transform: translateX(30px); opacity: 0; }
    15%  { opacity: 0.8; }
    85%  { opacity: 0.8; }
    100% { transform: translateX(-70px); opacity: 0; }
  }
  .speed-line {
    animation: dash 0.55s linear infinite;
  }
  .speed-line.delay-1 { animation-delay: 0.18s; }
  .speed-line.delay-2 { animation-delay: 0.36s; }

  /* ===== 太阳光晕 ===== */
  @keyframes sunPulse {
    0%, 100% { opacity: 0.35; transform: scale(1); }
    50%      { opacity: 0.2;  transform: scale(1.12); }
  }
  .sun-glow {
    transform-box: fill-box;
    transform-origin: center;
    animation: sunPulse 4s ease-in-out infinite;
  }

  /* ===== 小鸟 ===== */
  @keyframes birdFly {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(-20px, -8px); }
    100% { transform: translate(0, 0); }
  }
  .bird { animation: birdFly 3s ease-in-out infinite; }
  @keyframes wingBird {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(0.3); }
  }
  .bird-wings {
    transform-box: fill-box;
    transform-origin: center;
    animation: wingBird 0.4s ease-in-out infinite;
  }
</style>
</head>
<body>

<h1>鹈鹕骑自行车</h1>
<p class="subtitle">一只快乐的鹈鹕，踩着单车去旅行</p>

<div class="scene">
<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 草地单元（复用） -->
    <g id="grassUnit">
      <path d="M15 470 l4 -11 l4 11 z" fill="#5A8F30"/>
      <path d="M48 470 l5 -14 l5 14 z" fill="#689F38"/>
      <path d="M82 470 l3 -9 l3 9 z" fill="#558B2F"/>
      <path d="M115 470 l4 -12 l4 12 z" fill="#5A8F30"/>
      <path d="M148 470 l5 -13 l5 13 z" fill="#689F38"/>
      <path d="M178 470 l3 -8 l3 8 z" fill="#558B2F"/>
      <!-- 小石子 -->
      <ellipse cx="30" cy="475" rx="4" ry="2" fill="#8D6E63" opacity="0.5"/>
      <ellipse cx="130" cy="476" rx="3" ry="1.5" fill="#8D6E63" opacity="0.4"/>
    </g>
    <!-- 云朵单元 -->
    <g id="cloudUnit">
      <ellipse cx="0" cy="0" rx="38" ry="22" fill="white"/>
      <ellipse cx="30" cy="-10" rx="32" ry="20" fill="white"/>
      <ellipse cx="58" cy="0" rx="28" ry="18" fill="white"/>
      <ellipse cx="28" cy="10" rx="42" ry="16" fill="white"/>
    </g>
  </defs>

  <!-- ===== 天空背景 ===== -->
  <rect x="0" y="0" width="900" height="560" fill="url(#skyGrad)"/>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BA8D9"/>
      <stop offset="45%" stop-color="#8FCDE5"/>
      <stop offset="75%" stop-color="#BEE8F0"/>
      <stop offset="100%" stop-color="#E0F5F5"/>
    </linearGradient>
  </defs>

  <!-- ===== 太阳 ===== -->
  <g transform="translate(770, 90)">
    <circle class="sun-glow" r="65" fill="#FFE082"/>
    <circle r="42" fill="#FFD54F"/>
    <circle r="42" fill="none" stroke="#FFC107" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- ===== 远山 ===== -->
  <path d="M0 400 Q120 330 250 380 Q380 320 520 370 Q650 310 780 365 Q840 340 900 380 L900 470 L0 470 Z"
        fill="#8FC4A8" opacity="0.45"/>
  <path d="M0 425 Q180 370 360 410 Q540 360 720 400 Q820 375 900 405 L900 470 L0 470 Z"
        fill="#7DB894" opacity="0.55"/>

  <!-- ===== 云朵（三层，不同速度） ===== -->
  <g class="cloud-layer-1" opacity="0.9">
    <use href="#cloudUnit" x="950" y="75"/>
    <use href="#cloudUnit" x="2150" y="75"/>
  </g>
  <g class="cloud-layer-2" opacity="0.75" transform="scale(0.7)">
    <use href="#cloudUnit" x="1200" y="140"/>
    <use href="#cloudUnit" x="2400" y="140"/>
  </g>
  <g class="cloud-layer-3" opacity="0.85" transform="scale(1.15)">
    <use href="#cloudUnit" x="500" y="50"/>
    <use href="#cloudUnit" x="1700" y="50"/>
  </g>

  <!-- ===== 远处小鸟 ===== -->
  <g class="bird" transform="translate(180, 130)" fill="none" stroke="#3A6B8C" stroke-width="2.5" stroke-linecap="round">
    <g class="bird-wings">
      <path d="M-12 0 Q-6 -8 0 0 Q6 -8 12 0"/>
    </g>
  </g>
  <g class="bird" transform="translate(250, 170) scale(0.7)" fill="none" stroke="#3A6B8C" stroke-width="2.5" stroke-linecap="round" style="animation-delay:0.8s">
    <g class="bird-wings">
      <path d="M-12 0 Q-6 -8 0 0 Q6 -8 12 0"/>
    </g>
  </g>

  <!-- ===== 地面 ===== -->
  <rect x="0" y="470" width="900" height="90" fill="#7CB342"/>
  <rect x="0" y="470" width="900" height="6" fill="#9CCC65"/>
  <!-- 滚动草地 -->
  <g class="ground-scroll">
    <use href="#grassUnit" x="0"/>
    <use href="#grassUnit" x="200"/>
    <use href="#grassUnit" x="400"/>
    <use href="#grassUnit" x="600"/>
    <use href="#grassUnit" x="800"/>
    <use href="#grassUnit" x="1000"/>
  </g>
  <!-- 泥土路边缘 -->
  <rect x="0" y="488" width="900" height="3" fill="#8D6E63" opacity="0.3"/>

  <!-- ===== 速度线 ===== -->
  <g stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line class="speed-line" x1="200" y1="340" x2="250" y2="340"/>
    <line class="speed-line delay-1" x1="180" y1="370" x2="230" y2="370"/>
    <line class="speed-line delay-2" x1="210" y1="400" x2="245" y2="400"/>
  </g>

  <!-- ===== 骑行主体（自行车 + 鹈鹕） ===== -->
  <g class="rider">

    <!-- --- 后轮 --- -->
    <g transform="translate(285, 430)">
      <circle r="62" fill="#2C3E50"/>
      <circle r="58" fill="#34495E"/>
      <circle r="55" fill="#ECF0F1"/>
      <g class="wheel-spokes">
        <line x1="-52" y1="0" x2="52" y2="0" stroke="#BDC3C7" stroke-width="2.5"/>
        <line x1="0" y1="-52" x2="0" y2="52" stroke="#BDC3C7" stroke-width="2.5"/>
        <line x1="-37" y1="-37" x2="37" y2="37" stroke="#BDC3C7" stroke-width="2.5"/>
        <line x1="-37" y1="37" x2="37" y2="-37" stroke="#BDC3C7" stroke-width="2.5"/>
      </g>
      <circle r="9" fill="#7F8C8D"/>
      <circle r="4.5" fill="#2C3E50"/>
    </g>

    <!-- --- 前轮 --- -->
    <g transform="translate(555, 430)">
      <circle r="62" fill="#2C3E50"/>
      <circle r="58" fill="#34495E"/>
      <circle r="55" fill="#ECF0F1"/>
      <g class="wheel-spokes">
        <line x1="-52" y1="0" x2="52" y2="0" stroke="#BDC3C7" stroke-width="2.5"/>
        <line x1="0" y1="-52" x2="0" y2="52" stroke="#BDC3C7" stroke-width="2.5"/>
        <line x1="-37" y1="-37" x2="37" y2="37" stroke="#BDC3C7" stroke-width="2.5"/>
        <line x1="-37" y1="37" x2="37" y2="-37" stroke="#BDC3C7" stroke-width="2.5"/>
      </g>
      <circle r="9" fill="#7F8C8D"/>
      <circle r="4.5" fill="#2C3E50"/>
    </g>

    <!-- --- 车架 --- -->
    <g stroke="#E74C3C" stroke-width="7" stroke-linecap="round" fill="none">
      <!-- 座管 -->
      <line x1="340" y1="338" x2="395" y2="430"/>
      <!-- 后下叉 -->
      <line x1="395" y1="430" x2="285" y2="430"/>
      <!-- 后上叉 -->
      <line x1="285" y1="430" x2="340" y2="338"/>
      <!-- 下管 -->
      <line x1="395" y1="430" x2="505" y2="352"/>
      <!-- 上管 -->
      <line x1="340" y1="338" x2="505" y2="352"/>
      <!-- 头管 -->
      <line x1="505" y1="352" x2="515" y2="332"/>
      <!-- 前叉 -->
      <line x1="515" y1="332" x2="555" y2="430"/>
    </g>
    <!-- 车架焊点装饰 -->
    <circle cx="395" cy="430" r="5" fill="#C0392B"/>
    <circle cx="340" cy="338" r="4" fill="#C0392B"/>
    <circle cx="505" cy="352" r="4" fill="#C0392B"/>

    <!-- --- 车把 --- -->
    <g stroke="#2C3E50" stroke-width="5.5" stroke-linecap="round" fill="none">
      <line x1="515" y1="332" x2="542" y2="318"/>
      <line x1="542" y1="318" x2="555" y2="326"/>
    </g>
    <!-- 车把握把 -->
    <circle cx="555" cy="326" r="5" fill="#34495E"/>
    <!-- 刹车把手 -->
    <line x1="548" y1="322" x2="540" y2="335" stroke="#7F8C8D" stroke-width="2.5" stroke-linecap="round"/>

    <!-- --- 座椅 --- -->
    <ellipse cx="340" cy="332" rx="24" ry="7" fill="#2C3E50"/>
    <ellipse cx="340" cy="330" rx="20" ry="4" fill="#34495E"/>

    <!-- --- 曲柄与踏板 --- -->
    <g class="crank-group" transform="translate(395, 430)">
      <!-- 左曲柄 -->
      <line x1="0" y1="0" x2="0" y2="-34" stroke="#2C3E50" stroke-width="5.5" stroke-linecap="round"/>
      <g class="pedal" transform="translate(0, -34)">
        <rect x="-13" y="-4.5" width="26" height="9" rx="3.5" fill="#34495E"/>
        <rect x="-13" y="-4.5" width="26" height="3" rx="1.5" fill="#5D6D7E"/>
      </g>
      <!-- 右曲柄 -->
      <line x1="0" y1="0" x2="0" y2="34" stroke="#2C3E50" stroke-width="5.5" stroke-linecap="round"/>
      <g class="pedal" transform="translate(0, 34)">
        <rect x="-13" y="-4.5" width="26" height="9" rx="3.5" fill="#34495E"/>
        <rect x="-13" y="-4.5" width="26" height="3" rx="1.5" fill="#5D6D7E"/>
      </g>
      <!-- 中轴盖 -->
      <circle r="8" fill="#7F8C8D"/>
      <circle r="4" fill="#2C3E50"/>
      <!-- 链条圈 -->
      <circle r="22" fill="none" stroke="#95A5A6" stroke-width="3" stroke-dasharray="3 4"/>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <g class="pelican">

      <!-- --- 后腿（远侧） --- -->
      <g class="leg-b" transform="translate(338, 308)">
        <rect x="-5" y="0" width="9" height="78" rx="4.5" fill="#F07B30"/>
        <ellipse cx="0" cy="84" rx="17" ry="7.5" fill="#E67E22"/>
        <!-- 蹼 -->
        <path d="M-15 84 Q0 92 15 84 L12 88 Q0 94 -12 88 Z" fill="#D35400" opacity="0.6"/>
      </g>

      <!-- --- 前腿（近侧） --- -->
      <g class="leg-a" transform="translate(342, 310)">
        <rect x="-5" y="0" width="10" height="80" rx="5" fill="#FF8C42"/>
        <ellipse cx="0" cy="86" rx="18" ry="8" fill="#FF7043"/>
        <path d="M-16 86 Q0 95 16 86 L13 91 Q0 97 -13 91 Z" fill="#E64A19" opacity="0.5"/>
      </g>

      <!-- --- 身体 --- -->
      <g class="pelican-body">
        <!-- 尾巴 -->
        <path d="M288 268 L258 256 L262 278 L256 290 L288 282 Z" fill="#E0E0E0"/>
        <path d="M288 270 L265 262 L268 276 L264 286 L288 280 Z" fill="#EEEEEE"/>

        <!-- 身体主体 -->
        <ellipse cx="332" cy="272" rx="54" ry="42" fill="#FAFAFA"/>
        <ellipse cx="332" cy="272" rx="54" ry="42" fill="none" stroke="#E0E0E0" stroke-width="2"/>
        <!-- 腹部阴影 -->
        <ellipse cx="335" cy="285" rx="40" ry="25" fill="#F0F0F0" opacity="0.6"/>

        <!-- 翅膀（收在身体左侧，扇动） -->
        <g class="wing">
          <path d="M305 252 Q272 240 262 268 Q266 296 305 290 Q295 272 305 252 Z" fill="#BDBDBD"/>
          <path d="M305 258 Q280 250 275 270 Q278 288 305 284" fill="none" stroke="#9E9E9E" stroke-width="1.8"/>
          <path d="M300 265 Q285 262 282 274" fill="none" stroke="#9E9E9E" stroke-width="1.2"/>
          <!-- 翅膀尖端羽毛 -->
          <path d="M264 268 L254 262 M266 278 L255 278 M268 286 L258 290" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <!-- --- 头部 --- -->
        <g class="pelican-head">
          <!-- 脖子 -->
          <path d="M362 252 Q374 232 384 216" fill="none" stroke="#FAFAFA" stroke-width="17" stroke-linecap="round"/>
          <path d="M362 254 Q373 236 382 222" fill="none" stroke="#EEEEEE" stroke-width="10" stroke-linecap="round"/>

          <!-- 头 -->
          <circle cx="396" cy="208" r="31" fill="#FAFAFA"/>
          <circle cx="396" cy="208" r="31" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

          <!-- 头顶小撮毛 -->
          <path d="M388 180 Q390 172 395 178 Q398 170 402 179" fill="none" stroke="#BDBDBD" stroke-width="2.5" stroke-linecap="round"/>

          <!-- 眼睛 -->
          <circle cx="407" cy="200" r="5" fill="#2C3E50"/>
          <circle cx="408.5" cy="198.5" r="1.8" fill="white"/>
          <!-- 眼圈 -->
          <circle cx="407" cy="200" r="7" fill="none" stroke="#FFB74D" stroke-width="1.5"/>

          <!-- 上喙 -->
          <path d="M420 204 L498 208 L492 220 L420 216 Z" fill="#FF8C42"/>
          <path d="M420 204 L498 208 L495 213 L420 210 Z" fill="#FFA726"/>
          <!-- 喙尖钩 -->
          <path d="M494 206 Q502 204 500 214 Q497 218 492 216" fill="#E67E22"/>
          <!-- 鼻孔 -->
          <circle cx="435" cy="209" r="1.5" fill="#D35400"/>

          <!-- 下喙 / 喉囊 -->
          <g class="lower-beak">
            <path d="M420 216 Q458 256 492 220 Q475 240 445 236 Q428 230 420 216 Z" fill="#FFB347"/>
            <path d="M425 218 Q455 248 485 224" fill="none" stroke="#FFA726" stroke-width="1.5"/>
            <!-- 喉囊纹理 -->
            <path d="M435 228 Q445 236 458 232" fill="none" stroke="#FF9800" stroke-width="1" opacity="0.5"/>
          </g>

          <!-- 脸颊红晕 -->
          <ellipse cx="415" cy="218" rx="6" ry="4" fill="#FFAB91" opacity="0.4"/>
        </g>

        <!-- 右翅向前搭车把 -->
        <g>
          <path d="M355 258 Q420 275 480 300 Q510 312 548 322" fill="none" stroke="#C8C8C8" stroke-width="14" stroke-linecap="round"/>
          <path d="M355 258 Q420 275 480 300 Q510 312 548 322" fill="none" stroke="#BDBDBD" stroke-width="10" stroke-linecap="round"/>
          <!-- 翅膀末端"握"车把 -->
          <circle cx="550" cy="324" r="8" fill="#BDBDBD"/>
          <circle cx="550" cy="324" r="5" fill="#9E9E9E"/>
        </g>
      </g>

    </g><!-- /pelican -->
  </g><!-- /rider -->

  <!-- ===== 地面阴影 ===== -->
  <ellipse cx="420" cy="497" rx="160" ry="10" fill="#1B5E20" opacity="0.2"/>

</svg>
</div>

</body>
</html>
