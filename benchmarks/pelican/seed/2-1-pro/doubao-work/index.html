<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='16' r='9' fill='white' stroke='%23c9d2da' stroke-width='1.5'/%3E%3Cpath d='M20 13 L31 12 L21 19 Z' fill='%23f2942c'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 22px;
    background: linear-gradient(180deg, #b6e2f3 0%, #d9f1f9 100%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .stage {
    position: relative;
    width: min(96vw, 1000px);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 26px 60px rgba(31, 82, 110, .28);
    background: #fff;
  }
  svg#scene { display: block; width: 100%; height: auto; }
  .title {
    position: absolute;
    top: 18px; left: 22px;
    color: #fff;
    font-size: clamp(17px, 2.6vw, 25px);
    font-weight: 700;
    letter-spacing: 3px;
    text-shadow: 0 2px 10px rgba(35, 85, 108, .4);
    pointer-events: none;
  }
  .btn {
    position: absolute;
    top: 16px; right: 16px;
    width: 44px; height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.88);
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 0 4px 14px rgba(35, 85, 108, .22);
    transition: background .2s, transform .15s;
  }
  .btn:hover { background: #fff; }
  .btn:active { transform: scale(.92); }
  .btn svg { width: 22px; height: 22px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="stage">
  <span class="title">鹈鹕骑自行车</span>
  <button class="btn" id="toggleBtn" aria-label="暂停或播放动画">
    <svg id="iconPause" viewBox="0 0 24 24" fill="none">
      <path d="M8 5v14M16 5v14" stroke="#2f6f7e" stroke-width="3.2" stroke-linecap="round"/>
    </svg>
    <svg id="iconPlay" viewBox="0 0 24 24" hidden>
      <path d="M7 5l13 7-13 7z" fill="#2f6f7e"/>
    </svg>
  </button>

  <svg id="scene" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑自行车的卡通动画">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#96d3f0"/>
        <stop offset="58%" stop-color="#c7ebf8"/>
        <stop offset="100%" stop-color="#eaf8fd"/>
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffeaa6" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#ffeaa6" stop-opacity="0"/>
      </radialGradient>

      <!-- 可复用元素 -->
      <symbol id="cloud" viewBox="0 0 120 60">
        <ellipse cx="34" cy="40" rx="26" ry="19" fill="#ffffff"/>
        <ellipse cx="64" cy="30" rx="32" ry="25" fill="#ffffff"/>
        <ellipse cx="94" cy="41" rx="24" ry="17" fill="#ffffff"/>
        <rect x="18" y="39" width="90" height="18" rx="9" fill="#ffffff"/>
        <ellipse cx="60" cy="52" rx="46" ry="7" fill="#e7f1f7"/>
      </symbol>
      <symbol id="bush" viewBox="0 0 160 70">
        <circle cx="38" cy="44" r="28" fill="#7cbe86"/>
        <circle cx="84" cy="32" r="34" fill="#83c58c"/>
        <circle cx="126" cy="46" r="24" fill="#7cbe86"/>
        <ellipse cx="80" cy="64" rx="72" ry="9" fill="#6cab74"/>
      </symbol>
      <symbol id="grass" viewBox="0 0 30 24">
        <path d="M6 24 Q9 10 3 2 M15 24 Q17 8 13 0 M24 24 Q28 12 26 4"
              fill="none" stroke="#57a248" stroke-width="3" stroke-linecap="round"/>
      </symbol>
      <symbol id="flower" viewBox="0 0 20 26">
        <line x1="10" y1="26" x2="10" y2="11" stroke="#4f9c43" stroke-width="2.4"/>
        <circle cx="10" cy="6" r="3.4" fill="#f78fa1"/>
        <circle cx="5" cy="9" r="3.4" fill="#f78fa1"/>
        <circle cx="15" cy="9" r="3.4" fill="#f78fa1"/>
        <circle cx="10" cy="10" r="3.2" fill="#ffd15c"/>
      </symbol>
      <symbol id="stone" viewBox="0 0 24 14">
        <ellipse cx="12" cy="9" rx="11" ry="6" fill="#b7bec5"/>
        <ellipse cx="9" cy="7" rx="5" ry="2.6" fill="#cbd1d7"/>
      </symbol>
      <symbol id="farbird" viewBox="0 0 22 8">
        <path d="M1 5 Q6 0 11 5 Q16 0 21 5" fill="none" stroke="#5d7a86" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
    </defs>

    <!-- ===== 背景：天空 ===== -->
    <rect x="0" y="0" width="960" height="600" fill="url(#sky)"/>
    <circle cx="802" cy="92" r="62" fill="url(#sunGlow)"/>
    <circle cx="802" cy="92" r="40" fill="#ffd76b"/>
    <g id="clouds"></g>
    <g id="farbirds"></g>

    <!-- ===== 背景：远山（固定） ===== -->
    <path d="M0 470 L0 408 Q80 352 170 392 Q250 332 350 388 Q430 336 520 392 Q610 344 700 392 Q800 340 900 396 Q940 388 960 404 L960 470 Z"
          fill="#a9ccc9"/>
    <path d="M0 470 L0 438 Q120 392 240 430 Q360 384 480 432 Q600 392 720 434 Q840 396 960 436 L960 470 Z"
          fill="#93c2b4"/>
    <g id="bushes"></g>

    <!-- ===== 地面：草地 + 骑行小径 ===== -->
    <rect x="0" y="470" width="960" height="130" fill="#85c66f"/>
    <ellipse cx="180" cy="545" rx="120" ry="26" fill="#92cf7c" opacity=".6"/>
    <ellipse cx="640" cy="560" rx="150" ry="30" fill="#92cf7c" opacity=".6"/>
    <rect x="0" y="484" width="960" height="34" fill="#666d75"/>
    <line x1="0" y1="484" x2="960" y2="484" stroke="#c6cbd0" stroke-width="3"/>
    <line x1="0" y1="518" x2="960" y2="518" stroke="#525960" stroke-width="3"/>
    <g id="dashes"></g>
    <g id="flora"></g>

    <!-- ===== 自行车 + 鹈鹕（整体随颠簸上下） ===== -->
    <g id="rig">

      <!-- 后轮 -->
      <g transform="translate(310 428)">
        <circle r="72" fill="none" stroke="#2b3037" stroke-width="11"/>
        <circle r="61" fill="none" stroke="#d8dee3" stroke-width="3"/>
        <g class="spokes" stroke="#a7b0b8" stroke-width="2.3">
          <line x2="0" y2="-57" transform="rotate(0)"/>
          <line x2="0" y2="-57" transform="rotate(60)"/>
          <line x2="0" y2="-57" transform="rotate(120)"/>
          <line x2="0" y2="-57" transform="rotate(180)"/>
          <line x2="0" y2="-57" transform="rotate(240)"/>
          <line x2="0" y2="-57" transform="rotate(300)"/>
        </g>
        <circle r="7" fill="#525c67"/>
        <circle r="2.6" fill="#cfd6dc"/>
      </g>

      <!-- 前轮 -->
      <g transform="translate(620 428)">
        <circle r="72" fill="none" stroke="#2b3037" stroke-width="11"/>
        <circle r="61" fill="none" stroke="#d8dee3" stroke-width="3"/>
        <g class="spokes" stroke="#a7b0b8" stroke-width="2.3">
          <line x2="0" y2="-57" transform="rotate(0)"/>
          <line x2="0" y2="-57" transform="rotate(60)"/>
          <line x2="0" y2="-57" transform="rotate(120)"/>
          <line x2="0" y2="-57" transform="rotate(180)"/>
          <line x2="0" y2="-57" transform="rotate(240)"/>
          <line x2="0" y2="-57" transform="rotate(300)"/>
        </g>
        <circle r="7" fill="#525c67"/>
        <circle r="2.6" fill="#cfd6dc"/>
      </g>

      <!-- 车架 -->
      <g fill="none" stroke-linecap="round">
        <g stroke="#28a595" stroke-width="9">
          <line x1="310" y1="428" x2="420" y2="428"/>
          <line x1="310" y1="428" x2="356" y2="306"/>
          <line x1="420" y1="428" x2="356" y2="306"/>
          <line x1="420" y1="428" x2="596" y2="316"/>
          <line x1="356" y1="306" x2="596" y2="316"/>
        </g>
        <g stroke="#229183" stroke-width="6">
          <line x1="590" y1="320" x2="614" y2="428"/>
          <line x1="602" y1="314" x2="627" y2="428"/>
        </g>
        <g stroke="#28a595" stroke-width="8">
          <line x1="596" y1="316" x2="612" y2="294"/>
          <line x1="600" y1="290" x2="636" y2="298"/>
        </g>
        <line x1="624" y1="295" x2="638" y2="299" stroke="#2c3138" stroke-width="10"/>
      </g>

      <!-- 座椅 -->
      <path d="M322 304 Q350 288 382 298 Q386 302 380 306 Q350 300 326 310 Q320 308 322 304 Z" fill="#352b26"/>

      <!-- 飞轮与链条 -->
      <circle cx="310" cy="428" r="9" fill="none" stroke="#6b747c" stroke-width="4"/>
      <g stroke="#9098a0" stroke-width="2.5" stroke-dasharray="3 3" fill="none">
        <line x1="316" y1="422" x2="406" y2="416"/>
        <line x1="316" y1="434" x2="406" y2="440"/>
      </g>

      <!-- 远侧曲柄 / 踏板 -->
      <g id="farCrank">
        <line id="farArm" x1="420" y1="428" stroke="#6b747c" stroke-width="5" stroke-linecap="round"/>
        <g id="farPedal"><rect x="-10" y="-3" width="20" height="6" rx="2" fill="#454b53"/></g>
      </g>

      <!-- 远侧腿与脚 -->
      <path id="legFar" fill="none" stroke="#dd8622" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"/>
      <g id="footFar" transform="translate(420 428) scale(.92)">
        <ellipse cx="-2" cy="0" rx="14" ry="6" fill="#dd8622"/>
        <path d="M8 -5 L21 -9 L16 -1 L23 3 L15 5 L19 10 L8 6 Z" fill="#d57619"/>
        <path d="M12 -2 L17 0 M12 3 L17 3" stroke="#c26814" stroke-width="1.5" fill="none"/>
      </g>

      <!-- 鹈鹕身体 -->
      <g id="body">
        <path d="M252 212 Q212 192 184 212 Q214 222 252 228 Z" fill="#f3f7f9" stroke="#d2dbe2" stroke-width="2"/>
        <path d="M250 232 Q206 224 180 246 Q214 248 250 246 Z" fill="#f3f7f9" stroke="#d2dbe2" stroke-width="2"/>
        <ellipse cx="330" cy="235" rx="88" ry="67" fill="#fbfdfe" stroke="#d6dee5" stroke-width="2"/>
        <ellipse cx="320" cy="258" rx="72" ry="40" fill="#e8eef3"/>
        <ellipse cx="300" cy="205" rx="34" ry="18" fill="#ffffff" opacity=".7"/>
      </g>

      <!-- 近侧腿 -->
      <path id="legNear" fill="none" stroke="#f0932b" stroke-width="15"
            stroke-linecap="round" stroke-linejoin="round"/>

      <!-- 链轮 + 近侧曲柄 / 踏板 -->
      <g id="sprocket">
        <circle cx="420" cy="428" r="16" fill="none" stroke="#454c55" stroke-width="5"/>
        <circle cx="420" cy="428" r="5" fill="#454c55"/>
      </g>
      <line id="nearArm" x1="420" y1="428" stroke="#39414a" stroke-width="6" stroke-linecap="round"/>
      <g id="nearPedal"><rect x="-11" y="-3.5" width="22" height="7" rx="2" fill="#333941"/></g>

      <!-- 近侧脚蹼 -->
      <g id="footNear" transform="translate(420 428)">
        <ellipse cx="-2" cy="0" rx="14" ry="6" fill="#f0932b"/>
        <path d="M8 -5 L21 -9 L16 -1 L23 3 L15 5 L19 10 L8 6 Z" fill="#ec8420"/>
        <path d="M12 -2 L17 0 M12 3 L17 3" stroke="#d9751b" stroke-width="1.5" fill="none"/>
      </g>

      <!-- 翅膀（前伸扶车把，旋转中心在握把处） -->
      <g id="wing">
        <path d="M386 202 Q470 214 556 266 Q600 286 624 292 Q628 299 616 303 Q556 298 482 280 Q420 260 380 238 Z"
              fill="#f7fafc" stroke="#d2dbe3" stroke-width="2"/>
        <path d="M440 236 Q470 250 498 270 M486 246 Q516 262 540 280 M530 260 Q552 272 568 286"
              fill="none" stroke="#d8e1e8" stroke-width="2.5"/>
        <path d="M606 286 Q620 274 634 284 M606 293 Q620 284 636 293 M608 300 Q621 296 633 301"
              fill="none" stroke="#cbd5dd" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- 脖子 + 头 -->
      <g id="head">
        <path d="M388 208 Q402 170 432 160" fill="none" stroke="#cfd9e1" stroke-width="38" stroke-linecap="round"/>
        <path d="M388 208 Q402 170 432 160" fill="none" stroke="#fbfdfe" stroke-width="32" stroke-linecap="round"/>
        <ellipse cx="438" cy="156" rx="34" ry="30" fill="#fbfdfe" stroke="#d6dee5" stroke-width="2"/>
        <!-- 喉囊 / 下喙 -->
        <path d="M436 166 Q488 180 530 168 Q514 208 452 201 Q430 188 436 166 Z" fill="#f4972b"/>
        <path d="M448 178 Q470 190 498 184 M450 190 Q472 198 490 196"
              fill="none" stroke="#dd7f1e" stroke-width="1.6" opacity=".7"/>
        <!-- 上喙 -->
        <path d="M428 150 Q478 138 534 158 Q540 165 530 171 Q480 164 432 167 Z"
              fill="#f8b54d" stroke="#e2962b" stroke-width="1.6"/>
        <path d="M528 156 Q540 160 532 171 L523 168 Z" fill="#ec8a26"/>
        <path d="M440 165 Q488 172 528 166" fill="none" stroke="#c06f17" stroke-width="1.8"/>
        <circle cx="452" cy="152" r="1.4" fill="#d98a28"/>
        <!-- 眼睛 / 眉 / 脸颊 / 呆毛 -->
        <circle cx="446" cy="144" r="7.6" fill="#ffffff" stroke="#c3ced7" stroke-width="1.6"/>
        <circle cx="448" cy="144" r="4" fill="#2b3138"/>
        <circle cx="446.5" cy="142" r="1.5" fill="#ffffff"/>
        <path d="M437 132 Q447 126 457 131" fill="none" stroke="#c3ced7" stroke-width="3" stroke-linecap="round"/>
        <circle cx="453" cy="163" r="6" fill="#f6a59d" opacity=".55"/>
        <path d="M431 128 Q426 114 434 107 M440 127 Q441 112 449 107"
              fill="none" stroke="#d6dee5" stroke-width="3" stroke-linecap="round"/>
      </g>

    </g>
  </svg>
</main>

<script>
(function () {
  'use strict';
  var SVGNS = 'http://www.w3.org/2000/svg';

  // ---------- 常量 ----------
  var BB = { x: 420, y: 428 };          // 中轴（牙盘中心）
  var CRANK_R = 22;                     // 曲柄长度
  var WHEEL_R = 72;
  var WHEEL_OMEGA = 3.0;                // 车轮角速度 rad/s
  var GEAR_RATIO = 2.25;                // 车轮转数 / 曲柄转数
  var GROUND_SPEED = WHEEL_OMEGA * WHEEL_R;

  // 髋点与腿长（大腿 / 小腿）
  var HIP_NEAR = { x: 392, y: 285 }, LN1 = 80, LN2 = 92;
  var HIP_FAR  = { x: 376, y: 292 }, LF1 = 76, LF2 = 88;

  // ---------- DOM ----------
  function $(id) { return document.getElementById(id); }
  var rig = $('rig'), head = $('head'), wing = $('wing');
  var nearArm = $('nearArm'), farArm = $('farArm');
  var nearPedal = $('nearPedal'), farPedal = $('farPedal');
  var footNear = $('footNear'), footFar = $('footFar');
  var legNear = $('legNear'), legFar = $('legFar');
  var spokes = document.querySelectorAll('.spokes');

  // ---------- 工具 ----------
  function make(tag, attrs) {
    var node = document.createElementNS(SVGNS, tag);
    for (var k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }
  function use(symbol, x, y, w, h) {
    return make('use', { href: symbol, x: x, y: y, width: w, height: h });
  }
  function mod(n, m) { return ((n % m) + m) % m; }

  // 两连杆反向运动学：返回膝盖坐标（膝盖朝前方 +x）
  function knee(hip, px, py, l1, l2) {
    var dx = px - hip.x, dy = py - hip.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    d = Math.min(d, l1 + l2 - 0.6);
    d = Math.max(d, Math.abs(l1 - l2) + 0.6);
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var mx = hip.x + a * dx / d, my = hip.y + a * dy / d;
    var pxv = dy / d, pyv = -dx / d;   // 指向前方的单位法向量
    if (pxv < 0) { pxv = -pxv; pyv = -pyv; }
    return { x: mx + h * pxv, y: my + h * pyv };
  }

  // ---------- 初始化：路面虚线 ----------
  var dashData = [];
  var dashes = $('dashes');
  for (var i = 0; i < 11; i++) {
    var r = make('rect', { y: 498, width: 34, height: 6, fill: '#f2c84b' });
    dashes.appendChild(r);
    dashData.push({ node: r, base: i * 96 });
  }

  // ---------- 初始化：路边花草石 ----------
  var FLORA = [
    { sym: '#grass',  w: 30, h: 24 },
    { sym: '#flower', w: 20, h: 26 },
    { sym: '#stone',  w: 24, h: 14 }
  ];
  var floraData = [];
  var flora = $('flora');
  for (var j = 0; j < 18; j++) {
    var pick = FLORA[Math.floor(Math.random() * FLORA.length)];
    var s = 0.7 + Math.random() * 0.55;
    var bottom = 524 + Math.random() * 34;
    var w = pick.w * s, h = pick.h * s;
    var u = use(pick.sym, 0, bottom - h, w, h);
    flora.appendChild(u);
    floraData.push({ node: u, base: j * 58 + Math.random() * 30, w: w, h: h, bottom: bottom });
  }

  // ---------- 初始化：近景树丛（慢速视差） ----------
  var bushData = [];
  var bushes = $('bushes');
  for (var b = 0; b < 5; b++) {
    var bs = 0.85 + Math.random() * 0.4;
    var bw = 160 * bs, bh = 70 * bs;
    var bu = use('#bush', 0, 472 - bh, bw, bh);
    bushes.appendChild(bu);
    bushData.push({ node: bu, base: b * 235 + Math.random() * 40, w: bw, h: bh });
  }

  // ---------- 初始化：云（独立速度） ----------
  var cloudData = [];
  var clouds = $('clouds');
  for (var c = 0; c < 4; c++) {
    var cs = 0.55 + Math.random() * 0.65;
    var cu = use('#cloud', 0, 40 + Math.random() * 140, 120 * cs, 60 * cs);
    cu.setAttribute('opacity', 0.75 + Math.random() * 0.25);
    clouds.appendChild(cu);
    cloudData.push({ node: cu, x: Math.random() * 1000, v: 9 + Math.random() * 12, w: 120 * cs });
  }

  // ---------- 初始化：远处飞鸟 ----------
  var birdData = [];
  var farbirds = $('farbirds');
  for (var bd = 0; bd < 2; bd++) {
    var bu2 = use('#farbird', 0, 120 + Math.random() * 120, 44, 16);
    farbirds.appendChild(bu2);
    birdData.push({ node: bu2, x: Math.random() * 1000, y: 120 + Math.random() * 120, v: 22 + Math.random() * 8 });
  }

  // ---------- 状态 ----------
  var wheel = 0, crank = 0, dist = 0, last = 0;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var running = !reduced;

  function toggle() {
    running = !running;
    $('iconPause').hidden = !running;
    $('iconPlay').hidden = running;
  }
  $('toggleBtn').addEventListener('click', toggle);

  // ---------- 主循环 ----------
  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;

    if (running) {
      wheel += WHEEL_OMEGA * dt;
      crank = wheel / GEAR_RATIO;
      dist += GROUND_SPEED * dt;
    }

    var th = crank;
    var pn = { x: BB.x + CRANK_R * Math.cos(th),       y: BB.y + CRANK_R * Math.sin(th) };
    var pf = { x: BB.x + CRANK_R * Math.cos(th + Math.PI), y: BB.y + CRANK_R * Math.sin(th + Math.PI) };

    // 车轮辐条
    var deg = wheel * 180 / Math.PI;
    for (var s = 0; s < spokes.length; s++) {
      spokes[s].setAttribute('transform', 'rotate(' + deg + ')');
    }

    // 曲柄臂（踏板自身保持水平）
    nearArm.setAttribute('x2', pn.x); nearArm.setAttribute('y2', pn.y);
    farArm.setAttribute('x2', pf.x);  farArm.setAttribute('y2', pf.y);
    nearPedal.setAttribute('transform', 'translate(' + pn.x + ' ' + pn.y + ')');
    farPedal.setAttribute('transform', 'translate(' + pf.x + ' ' + pf.y + ')');

    // 脚蹼（随踏板公转，自身仅轻微摆动）
    var na = Math.sin(th) * 7, fa = Math.sin(th + Math.PI) * 7;
    footNear.setAttribute('transform', 'translate(' + pn.x + ' ' + (pn.y - 1) + ') rotate(' + na + ')');
    footFar.setAttribute('transform', 'translate(' + pf.x + ' ' + (pf.y - 1) + ') rotate(' + fa + ') scale(.92)');

    // 腿部 IK
    var kn = knee(HIP_NEAR, pn.x, pn.y - 2, LN1, LN2);
    var kf = knee(HIP_FAR,  pf.x, pf.y - 2, LF1, LF2);
    legNear.setAttribute('d', 'M' + HIP_NEAR.x + ' ' + HIP_NEAR.y +
      ' L' + kn.x.toFixed(1) + ' ' + kn.y.toFixed(1) +
      ' L' + pn.x.toFixed(1) + ' ' + (pn.y - 2).toFixed(1));
    legFar.setAttribute('d', 'M' + HIP_FAR.x + ' ' + HIP_FAR.y +
      ' L' + kf.x.toFixed(1) + ' ' + kf.y.toFixed(1) +
      ' L' + pf.x.toFixed(1) + ' ' + (pf.y - 2).toFixed(1));

    // 车身颠簸 / 头部点动 / 翅膀轻摆
    var bounce = Math.sin(wheel) * 2.2 + Math.sin(wheel * 2 + 0.5) * 0.8;
    rig.setAttribute('transform', 'translate(0 ' + bounce.toFixed(2) + ')');
    head.setAttribute('transform', 'rotate(' + (Math.sin(wheel + 0.6) * 1.6).toFixed(2) + ' 390 208)');
    wing.setAttribute('transform', 'rotate(' + (Math.sin(wheel * 1.3) * 1.2).toFixed(2) + ' 624 294)');

    // 路面虚线（与车速同步）
    for (var d1 = 0; d1 < dashData.length; d1++) {
      var dx1 = mod(dashData[d1].base - dist, 1056) - 48;
      dashData[d1].node.setAttribute('x', dx1.toFixed(1));
    }

    // 路边花草石
    for (var f = 0; f < floraData.length; f++) {
      var it = floraData[f];
      var fx = mod(it.base - dist, 1044) - 34;
      it.node.setAttribute('x', fx.toFixed(1));
      it.node.setAttribute('y', (it.bottom - it.h).toFixed(1));
    }

    // 树丛视差
    for (var b2 = 0; b2 < bushData.length; b2++) {
      var bu3 = bushData[b2];
      var bx = mod(bu3.base - dist * 0.24, 1175) - 170;
      bu3.node.setAttribute('x', bx.toFixed(1));
    }

    // 云
    for (var c2 = 0; c2 < cloudData.length; c2++) {
      var cl = cloudData[c2];
      cl.x -= cl.v * dt;
      if (cl.x < -cl.w - 20) cl.x = 1000 + Math.random() * 160;
      cl.node.setAttribute('x', cl.x.toFixed(1));
    }

    // 远处飞鸟
    for (var bi = 0; bi < birdData.length; bi++) {
      var br = birdData[bi];
      br.x -= br.v * dt;
      if (br.x < -50) { br.x = 1010; br.y = 100 + Math.random() * 150; }
      br.node.setAttribute('x', br.x.toFixed(1));
      br.node.setAttribute('y', br.y.toFixed(1));
    }

    requestAnimationFrame(frame);
  }

  // 静态先渲染一帧，再启动
  requestAnimationFrame(function (ts) { frame(ts); });
})();
</script>
</body>
</html>
