<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican Riding a Bicycle — 2D SVG Animation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(180deg, #aee3f5 0%, #d8f3e3 55%, #f6e7c1 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Avenir Next", "Segoe UI", sans-serif;
  }
  .stage {
    width: min(92vw, 900px);
  }
  h1 {
    text-align: center;
    color: #2c5545;
    font-size: clamp(18px, 3vw, 28px);
    margin: 0 0 12px;
    letter-spacing: 1px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 8px 18px rgba(30, 60, 50, 0.18));
    border-radius: 16px;
    background: transparent;
  }
</style>
</head>
<body>
<div class="stage">
  <h1>🚲 Pelican Riding a Bicycle</h1>

  <svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A cartoon pelican riding a bicycle along a sunny road">

    <defs>
      <!-- ground shadow gradient -->
      <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <!-- sun glow -->
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff7c0"/>
        <stop offset="60%" stop-color="#ffd75e"/>
        <stop offset="100%" stop-color="#ffcf3f" stop-opacity="0"/>
      </radialGradient>
      <!-- pelican body gradient -->
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#e8eef2"/>
      </linearGradient>
      <!-- beak gradient -->
      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#ffb347"/>
        <stop offset="100%" stop-color="#ff8c3a"/>
      </linearGradient>
    </defs>

    <!-- ================= SCENERY ================= -->
    <!-- sun with pulsing glow -->
    <circle cx="770" cy="95" r="85" fill="url(#sunGlow)">
      <animate attributeName="r" values="85;95;85" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="95" r="42" fill="#ffd94f"/>

    <!-- drifting clouds -->
    <g fill="#ffffff" opacity="0.9">
      <g>
        <ellipse cx="150" cy="90" rx="55" ry="20"/>
        <ellipse cx="190" cy="75" rx="40" ry="18"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 40 0; 0 0" dur="18s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="520" cy="60" rx="45" ry="16"/>
        <ellipse cx="555" cy="50" rx="30" ry="13"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -55 0; 0 0" dur="22s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- hills -->
    <path d="M0,330 Q160,240 330,330 T660,330 T990,330 V500 H0 Z" fill="#bfe6c8" opacity="0.7"/>
    <path d="M0,360 Q220,290 460,360 T920,360 V500 H0 Z" fill="#a5d9b3" opacity="0.8"/>

    <!-- road -->
    <rect x="0" y="420" width="900" height="80" fill="#8d9aa5"/>
    <rect x="0" y="420" width="900" height="8" fill="#76838e"/>
    <!-- dashed road line: two copies scrolled left for continuous motion -->
    <g fill="#f7f3d0">
      <g>
        <rect x="20"  y="455" width="60" height="9" rx="4"/>
        <rect x="150" y="455" width="60" height="9" rx="4"/>
        <rect x="280" y="455" width="60" height="9" rx="4"/>
        <rect x="410" y="455" width="60" height="9" rx="4"/>
        <rect x="540" y="455" width="60" height="9" rx="4"/>
        <rect x="670" y="455" width="60" height="9" rx="4"/>
        <rect x="800" y="455" width="60" height="9" rx="4"/>
        <rect x="930" y="455" width="60" height="9" rx="4"/>
        <animateTransform attributeName="transform" type="translate"
          from="0 0" to="-130 0" dur="0.55s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- scrolling roadside bushes -->
    <g>
      <g fill="#5faa72">
        <ellipse cx="80"  cy="418" rx="34" ry="18"/>
        <ellipse cx="360" cy="418" rx="30" ry="16"/>
        <ellipse cx="640" cy="418" rx="36" ry="19"/>
        <ellipse cx="880" cy="418" rx="30" ry="16"/>
      </g>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-260 0" dur="1.1s" repeatCount="indefinite"/>
      <g fill="#5faa72">
        <ellipse cx="-180" cy="418" rx="34" ry="18"/>
        <ellipse cx="120" cy="418" rx="30" ry="16"/>
        <ellipse cx="1140" cy="418" rx="30" ry="16"/>
      </g>
    </g>

    <!-- ================= BICYCLE ================= -->
    <g id="bike">
      <!-- ground shadow -->
      <ellipse cx="450" cy="448" rx="230" ry="18" fill="url(#shadowGrad)"/>

      <!-- wheels (spokes rotate) -->
      <g>
        <!-- rear wheel -->
        <g transform="translate(315,395)">
          <circle r="58" fill="none" stroke="#33404a" stroke-width="9"/>
          <circle r="52" fill="none" stroke="#cfd8de" stroke-width="2"/>
          <g stroke="#cfd8de" stroke-width="2.5">
            <line x1="0" y1="-50" x2="0" y2="50"/>
            <line x1="-50" y1="0" x2="50" y2="0"/>
            <line x1="-35" y1="-35" x2="35" y2="35"/>
            <line x1="-35" y1="35" x2="35" y2="-35"/>
            <line x1="-46" y1="-19" x2="46" y2="19"/>
            <line x1="-46" y1="19" x2="46" y2="-19"/>
            <animateTransform attributeName="transform" type="rotate"
              from="0" to="360" dur="0.55s" repeatCount="indefinite"/>
          </g>
          <circle r="8" fill="#33404a"/>
        </g>
        <!-- front wheel -->
        <g transform="translate(585,395)">
          <circle r="58" fill="none" stroke="#33404a" stroke-width="9"/>
          <circle r="52" fill="none" stroke="#cfd8de" stroke-width="2"/>
          <g stroke="#cfd8de" stroke-width="2.5">
            <line x1="0" y1="-50" x2="0" y2="50"/>
            <line x1="-50" y1="0" x2="50" y2="0"/>
            <line x1="-35" y1="-35" x2="35" y2="35"/>
            <line x1="-35" y1="35" x2="35" y2="-35"/>
            <line x1="-46" y1="-19" x2="46" y2="19"/>
            <line x1="-46" y1="19" x2="46" y2="-19"/>
            <animateTransform attributeName="transform" type="rotate"
              from="0" to="360" dur="0.55s" repeatCount="indefinite"/>
          </g>
          <circle r="8" fill="#33404a"/>
        </g>
      </g>

      <!-- frame -->
      <g stroke="#e0533f" stroke-width="9" stroke-linecap="round" fill="none">
        <path d="M315,395 L425,290 L555,290 L585,395"/>
        <path d="M315,395 L450,395 L425,290"/>
        <path d="M555,290 L540,255"/>
        <path d="M425,290 L430,250"/>
      </g>
      <!-- fork + handlebar -->
      <g stroke="#33404a" stroke-width="8" stroke-linecap="round" fill="none">
        <line x1="540" y1="255" x2="540" y2="235"/>
        <path d="M540,235 q0,-16 -24,-16 h-30"/>
      </g>
      <!-- handlebar grips -->
      <circle cx="486" cy="219" r="7" fill="#33404a"/>
      <!-- saddle -->
      <rect x="405" y="240" width="52" height="14" rx="7" fill="#33404a"/>
      <!-- pedal crank -->
      <g transform="translate(450,395)">
        <line x1="-24" y1="-24" x2="24" y2="24" stroke="#33404a" stroke-width="6"/>
        <g>
          <circle cx="-24" cy="-24" r="9" fill="#222c34"/>
          <animateTransform attributeName="transform" type="rotate"
            from="0 0 0" to="360 0 0" dur="0.55s" repeatCount="indefinite"/>
        </g>
        <circle r="10" fill="#e0533f"/>
      </g>
      <!-- chain guard hint -->
      <circle cx="450" cy="395" r="26" fill="none" stroke="#c2b280" stroke-width="4" opacity="0.8"/>
    </g>

    <!-- ================= PELICAN ================= -->
    <g id="pelican">
      <!-- gentle body bob synced with pedaling -->
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -5; 0 0" dur="0.55s" repeatCount="indefinite"/>

      <!-- legs: pedaling, attached near crank -->
      <g stroke="#f2a65a" stroke-width="11" stroke-linecap="round" fill="none">
        <!-- near leg (follows crank pedal) -->
        <g>
          <path d="M455,300 L426,371"/>
          <path d="M426,371 L450,395" stroke-width="9"/>
          <animateTransform attributeName="transform" type="rotate"
            values="0 455 300; 14 455 300; 0 455 300; -10 455 300; 0 455 300"
            dur="0.55s" repeatCount="indefinite"/>
        </g>
        <!-- far leg (opposite phase) -->
        <g opacity="0.85" stroke="#d98f3f">
          <path d="M448,300 L474,371"/>
          <path d="M474,371 L450,395" stroke-width="9"/>
          <animateTransform attributeName="transform" type="rotate"
            values="0 448 300; -10 448 300; 0 448 300; 14 448 300; 0 448 300"
            dur="0.55s" repeatCount="indefinite"/>
        </g>
      </g>
      <!-- webbed feet -->
      <g fill="#f2a65a">
        <path d="M446,388 l14,8 -14,6 z">
          <animateTransform attributeName="transform" type="rotate"
            values="0 450 395; 14 450 395; 0 450 395; -14 450 395; 0 450 395"
            dur="0.55s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- tail -->
      <path d="M340,270 q-38,-8 -52,14 q20,16 50,10 z" fill="#eef3f6"/>

      <!-- body -->
      <ellipse cx="415" cy="265" rx="88" ry="58" fill="url(#bodyGrad)" stroke="#c9d4db" stroke-width="2"/>

      <!-- wing (flaps slightly) -->
      <g>
        <path d="M400,250 q60,-18 84,20 q-30,34 -80,16 q-14,-20 -4,-36 z"
              fill="#dde7ee" stroke="#c2cfd8" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0 405 258; -4 405 258; 0 405 258" dur="1.1s" repeatCount="indefinite"/>
      </g>

      <!-- neck -->
      <path d="M470,235 q28,-18 30,-52 q2,-30 -14,-44"
            fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
      <path d="M470,235 q28,-18 30,-52 q2,-30 -14,-44"
            fill="none" stroke="#eef2f5" stroke-width="22" stroke-linecap="round" opacity="0.6"/>

      <!-- head -->
      <g transform="translate(486,132)">
        <animateTransform attributeName="transform" type="translate"
          values="486 132; 486 128; 486 132" dur="0.55s" repeatCount="indefinite" additive="replace"/>
        <!-- head shape -->
        <ellipse cx="0" cy="0" rx="34" ry="28" fill="#ffffff" stroke="#dfe6eb" stroke-width="2"/>
        <!-- head crest -->
        <path d="M-30,-16 q-12,-14 -4,-26 q10,8 12,20 z" fill="#eef3f6"/>

        <!-- eye -->
        <circle cx="-10" cy="-8" r="7" fill="#2b3138"/>
        <circle cx="-12" cy="-10" r="2.4" fill="#ffffff"/>
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.45;0.5;0.55;1"
                 dur="4s" repeatCount="indefinite"/>

        <!-- beak: long pelican bill, opens/closes -->
        <g>
          <!-- upper bill -->
          <path d="M-8,2 q40,-14 96,-4 q2,6 -6,8 l-90,4 z" fill="url(#beakGrad)"/>
          <!-- lower bill + pouch -->
          <g>
            <path d="M-8,10 q34,26 84,12 q10,-4 4,-14 l-88,-4 z" fill="#ff9d52"/>
            <animateTransform attributeName="transform" type="rotate"
              values="0 -8 10; 7 -8 10; 0 -8 10" dur="2.2s" repeatCount="indefinite"/>
          </g>
        </g>
      </g>

      <!-- one wing tip reaching the handlebar -->
      <path d="M470,240 q20,-14 34,-18" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- ================= EXTRAS ================= -->
    <!-- little speed lines behind the bike -->
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.6">
      <line x1="215" y1="330" x2="265" y2="330">
        <animate attributeName="x1" values="215;150;215" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="235" y1="370" x2="290" y2="370">
        <animate attributeName="x1" values="235;170;235" dur="0.7s" repeatCount="indefinite"/>
      </line>
      <line x1="200" y1="250" x2="255" y2="250">
        <animate attributeName="x1" values="200;135;200" dur="1.1s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- floating fish in the pouch? a tiny fish jumping in the river hill — playful touch -->
    <g transform="translate(120, 300)">
      <path d="M0,0 q10,-8 20,0 q-10,8 -20,0 z" fill="#6fb7d9"/>
      <path d="M20,0 l10,-6 v12 z" fill="#6fb7d9"/>
      <animateTransform attributeName="transform" type="translate"
        values="120 300; 120 285; 120 300" dur="3s" repeatCount="indefinite" additive="replace"/>
    </g>
  </svg>
</div>
</body>
</html>
