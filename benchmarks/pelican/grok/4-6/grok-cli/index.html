<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑车 · 纯 CSS SVG 动画</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 50% 0%, #1b3a4a 0%, transparent 55%),
        linear-gradient(165deg, #0b1720 0%, #12262f 45%, #0a141a 100%);
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
      color: #dceaf0;
    }

    h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      margin-bottom: 0.9rem;
      opacity: 0.8;
    }

    .stage {
      width: min(960px, 96vw);
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      background: #7ec8e6;
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.07),
        0 28px 70px rgba(0, 0, 0, 0.5);
    }

    .scene {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sun-rays {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 36s linear infinite;
    }

    .scroll-cloud { animation: scroll-960 32s linear infinite; }
    .scroll-cloud-mid { animation: scroll-960 22s linear infinite; }
    .scroll-sea { animation: scroll-960 10s linear infinite; }
    .scroll-wave { animation: scroll-wave 3.2s linear infinite; }
    .scroll-dune { animation: scroll-960 14s linear infinite; }
    .scroll-mid { animation: scroll-960 5.5s linear infinite; }
    .scroll-near { animation: scroll-960 2.6s linear infinite; }

    @keyframes scroll-960 {
      from { transform: translateX(0); }
      to   { transform: translateX(-960px); }
    }

    @keyframes scroll-wave {
      from { transform: translateX(0); }
      to   { transform: translateX(-160px); }
    }

    .rider {
      animation: bob 0.4s ease-in-out infinite alternate;
    }

    @keyframes bob {
      from { transform: translateY(0); }
      to   { transform: translateY(3px); }
    }

    .shadow {
      animation: shadow-pulse 0.4s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes shadow-pulse {
      from { transform: scaleX(1); opacity: 0.22; }
      to   { transform: scaleX(0.92); opacity: 0.16; }
    }

    .wheel-spin,
    .crank-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.8s linear infinite;
    }

    .pedal-counter {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin-rev 0.8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    .thigh-near,
    .thigh-far,
    .shin-near,
    .shin-far {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation-duration: 0.8s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .thigh-near { animation-name: thigh-near; }
    .thigh-far  { animation-name: thigh-far; }
    .shin-near  { animation-name: shin-near; }
    .shin-far   { animation-name: shin-far; }

    @keyframes thigh-near {
      0%   { transform: rotate(-40deg); }
      12.5%{ transform: rotate(-28deg); }
      25%  { transform: rotate(-16deg); }
      37.5%{ transform: rotate(-10deg); }
      50%  { transform: rotate(-6deg); }
      62.5%{ transform: rotate(-22deg); }
      75%  { transform: rotate(-52deg); }
      87.5%{ transform: rotate(-50deg); }
      100% { transform: rotate(-40deg); }
    }

    @keyframes shin-near {
      0%   { transform: rotate(32deg); }
      12.5%{ transform: rotate(20deg); }
      25%  { transform: rotate(10deg); }
      37.5%{ transform: rotate(18deg); }
      50%  { transform: rotate(38deg); }
      62.5%{ transform: rotate(70deg); }
      75%  { transform: rotate(98deg); }
      87.5%{ transform: rotate(62deg); }
      100% { transform: rotate(32deg); }
    }

    @keyframes thigh-far {
      0%   { transform: rotate(-6deg); }
      12.5%{ transform: rotate(-22deg); }
      25%  { transform: rotate(-52deg); }
      37.5%{ transform: rotate(-50deg); }
      50%  { transform: rotate(-40deg); }
      62.5%{ transform: rotate(-28deg); }
      75%  { transform: rotate(-16deg); }
      87.5%{ transform: rotate(-10deg); }
      100% { transform: rotate(-6deg); }
    }

    @keyframes shin-far {
      0%   { transform: rotate(38deg); }
      12.5%{ transform: rotate(70deg); }
      25%  { transform: rotate(98deg); }
      37.5%{ transform: rotate(62deg); }
      50%  { transform: rotate(32deg); }
      62.5%{ transform: rotate(20deg); }
      75%  { transform: rotate(10deg); }
      87.5%{ transform: rotate(18deg); }
      100% { transform: rotate(38deg); }
    }

    .pouch {
      transform-box: fill-box;
      transform-origin: 18% 8%;
      animation: pouch-wobble 1.5s ease-in-out infinite;
    }

    @keyframes pouch-wobble {
      0%, 100% { transform: rotate(-2.5deg) scaleY(1); }
      50%      { transform: rotate(3deg) scaleY(1.045); }
    }

    .head-bob {
      transform-box: fill-box;
      transform-origin: 22% 28%;
      animation: head-bob 1.6s ease-in-out infinite;
    }

    @keyframes head-bob {
      0%, 100% { transform: rotate(-2deg); }
      50%      { transform: rotate(2.4deg); }
    }

    .wing-arm {
      transform-box: fill-box;
      transform-origin: 8% 30%;
      animation: wing-hold 0.8s ease-in-out infinite;
    }

    @keyframes wing-hold {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-4deg); }
    }

    .eye-lid {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 3.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 88%, 96%, 100% { transform: scaleY(1); }
      91%, 93%           { transform: scaleY(0.08); }
    }

    .crest {
      transform-box: fill-box;
      transform-origin: 80% 100%;
      animation: crest-flutter 1.1s ease-in-out infinite alternate;
    }

    @keyframes crest-flutter {
      from { transform: rotate(-6deg); }
      to   { transform: rotate(8deg); }
    }

    .hint {
      margin-top: 0.85rem;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      opacity: 0.48;
    }

    @media (prefers-reduced-motion: reduce) {
      .sun-rays,
      .scroll-cloud,
      .scroll-cloud-mid,
      .scroll-sea,
      .scroll-wave,
      .scroll-dune,
      .scroll-mid,
      .scroll-near,
      .rider,
      .shadow,
      .wheel-spin,
      .crank-spin,
      .pedal-counter,
      .thigh-near,
      .thigh-far,
      .shin-near,
      .shin-far,
      .pouch,
      .head-bob,
      .wing-arm,
      .eye-lid,
      .crest {
        animation: none;
      }
    }
  </style>
</head>
